name: 每日自动更新

# ============================================================
#  每天自动更新推荐网页
#
#  运行在 GitHub 的服务器上 —— 你的电脑关机也照常执行。
#
#  时间说明（UTC）：
#    18:00 UTC = 北京时间 02:00（次日）
#    GitHub 的 cron 用 UTC，所以这里写 18:00
#
#  也可以在仓库 Actions 页面手动点「Run workflow」立即执行。
# ============================================================

on:
  schedule:
    # 每天 18:00 UTC = 北京 02:00
    - cron: '0 18 * * *'
  workflow_dispatch:        # 允许手动触发（本机 sync-cloud.mjs 就是这么触发的）
    inputs:
      quick:
        description: '快速模式：刚同步过数据，跳过抓取，只用同步过来的数据重新渲染 + 部署'
        required: false
        default: '1'

# 【说明】这里故意【不加】on: push 触发。
# 构建结束后会把 cloud/ 下的产物提交回仓库（见下面的提交步骤），
# 如果加了 push 触发，那次提交又会触发一次构建 → 无限循环。
# 本机同步（cloud/sync-cloud.mjs）上传完文件会用 workflow_dispatch 触发，
# 效果一样，而且不会循环。

# 允许把生成的网页提交回仓库
permissions:
  contents: write
  pages: write
  id-token: write

# 同一时间只跑一个
concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 【关键】用北京时间。
    # GitHub 服务器是 UTC，不设这个的话，北京凌晨 2 点跑出来
    # 会算成前一天，导致「公历/农历/干支/开奖日期」全都差一天，
    # 网页和 App 就对不上了。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 取出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 快速模式：本机刚刚同步过完整数据（cloud/scripts/sync-stamp.json 很新），
      # 云端直接拿来用，跳过抓开奖/抓几百场赔率那些慢步骤，
      # 只做「用同步过来的数据重新渲染 + 部署」，把生效时间压到 1 分钟左右。
      - name: 判断是否快速模式
        id: mode
        run: |
          QUICK="${{ github.event.inputs.quick }}"
          # 定时任务（schedule）没有输入 → 0，交给 cloud-build.mjs 按
          # sync-stamp.json 自己判断要不要抓数据（距上次同步 <12 小时就不抓）。
          # 手动/本机同步触发 → 用输入里的值，默认 1（闪电重建）。
          if [ -z "$QUICK" ]; then QUICK=0; fi
          echo "quick=$QUICK" >> "$GITHUB_OUTPUT"
          echo "事件=${{ github.event_name }} 快速模式 quick=$QUICK"

      - name: 执行云端构建
        working-directory: cloud
        env:
          CLOUD_QUICK: ${{ steps.mode.outputs.quick }}
        # 【容错】抓取/渲染万一失败，也不要整个流程挂掉：
        # 后面照样会部署「上一次成功的网页 + 本次的 tickets.json」，
        # 分享页拉到新 tickets.json 就能把号码换新（页面自带重渲染逻辑）。
        continue-on-error: true
        run: node cloud-build.mjs

      - name: 把生成的网页放到站点目录
        run: |
          mkdir -p site
          cp -f cloud/out/index.html    site/index.html    || true
          cp -f cloud/out/football.html site/football.html || true
          # 【准实时数据源】分享页会去拉这个文件；
          # 只要它是新的，页面拿到后立刻就地重渲染成新号码
          cp -f cloud/out/tickets.json  site/tickets.json  || true
          touch site/.nojekyll
          echo "--- site 目录内容 ---"
          ls -lh site/
          echo "--- tickets.json 里的时间 ---"
          node -e "const j=require('./site/tickets.json');console.log('updated='+j.updated,'publishedAt='+j.publishedAt,'source='+j.source)" || true

      - name: 提交更新后的数据（保留号码与历史）
        run: |
          git config user.name  "auto-update-bot"
          git config user.email "auto-update-bot@users.noreply.github.com"
          git add -A cloud/ || true
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
            git push
          fi

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
