name: 每日自动更新

# ============================================================
#  定时更新推荐网页
#
#  运行在 GitHub 的服务器上 —— 你的电脑关机也照常执行。
#  【目标】电脑关一个月，云端照样：抓数据 → 算号 → 出页面 → 部署。
#
#  【时间表】GitHub 的 cron 只认 UTC，北京时间要减 8 小时。
#
#    cron                UTC 触发        北京时间        班次            这一班干什么
#    ------------------  --------------  --------------  --------------  ------------------------------------------
#    */10 * * * *        每 10 分钟       每 10 分钟      regular         比分 + 竞彩 + 晒票 + 文章 + 开机号
#                                                                       + 在售场次 + 缺才补摇 + 出页面 + 发布
#                       （⚠️ 2026-10-19：原来还有一条 每 5 分钟 的 live-only 班
#                          '2,7,12,…57 * * * *'，已停用 —— 它把云端排队位占满，
#                          导致最近 13 次运行全 cancelled。见下面 on.schedule 里的说明。）
#    0 18 * * *          18:00            次日 02:00      full            全量：抓全部数据（开奖/历史/足球/
#                                                                       竞彩/奖级/专家）+ 缺才补摇 + 清空热力图
#                                                                       + 清理 72 小时缓存 + 发布
#    0 10 * * *          10:00            18:00           heatmap-only    开奖日 18:00 出热力图（抓当日晒票）
#    0 13 * * *          13:00            21:00           heatmap-off     把热力图从网页上撤下来
#    30 13 * * *         13:30            21:30           draw-update     抓开奖号码（失败自动重试一次）
#    45 13 * * *         13:45            21:45           draw-update     再抓一次开奖（重试到抓全）
#    0 14 * * *          14:00            22:00           draw-update     核对开奖 + 公布中奖
#    0 15 * * *          15:00            23:00           draw-update     号码池刷新（补抓漏号 + 重算青蛙 20 码）
#
#  【每天会跑多少次】
#    每 10 分钟 144 班 + 每小时 :07 24 班
#    + 专用 7 班（02:00 / 18:00 / 21:00 / 21:30 / 21:45 / 22:00 / 23:00）
#    = 175 班/天（手动触发另算）。
#    GitHub 对公开仓库的 Actions 分钟数不收费（本仓库是 public）。
#    ⚠️ 2026-10-19 之前是 461 班/天（多了一条 288 班/天的「每 5 分钟」班）——
#       「跑不完」就是从那时候开始的，所以砍掉了那条，密度回到 173 班/天。
#       （2026-10-20 加了 22:00 那条「核对开奖 + 公布中奖」→ 173 + 1 = 174 班/天。）
#       （2026-10-20 又加了 23:00 那条「号码池刷新」→ 174 + 1 = 175 班/天。）
#  【为什么密集班次必须"轻"】
#    · 每 10 分钟那一班只做「比分 + 晒票 + 竞彩」这些必须高频的，
#      全量抓取 / 热力图 / 开奖 / 清缓存全部交给专用 cron。
#    · 重活（全量抓取 / 热力图 / 开奖 / 出号）全部交给上面那几条专用 cron，
#      密集班次【永远不】顺手做重活，避免同一分钟两条 cron 把同一件事干两遍
#      （重复抓取、号码被摇两次、重复部署）。
#  【GitHub 的 cron 在高峰期会延迟甚至跳过】
#    所以：① 班次判断用「cron 形态 + 实际北京时间」，延迟几分钟照样认得出；
#         ② 21:30 与 21:45 两班互为重试，抓不全时 15 分钟后还会再抓；
#         ③ 22:00 那班是【补抓 + 公布中奖】的最后一班：8 个彩种全抓一遍 →
#            和推荐号存档核对 → 中了自动更新历史开奖 + 小喇叭，不需要人管；
#         ④ 每 30 分钟那一班带「开奖数据兜底」：draws.js 超过 20 小时没更新
#            就顺手补抓一次 —— 万一 21:30/21:45/22:00 那三班被跳过了也不怕；
#         ⑤ 23:00 那一班刷【青蛙号码池】：号码池按「期号」当种子，期号一换池子就换，
#            所以开奖全部落定之后（23:00）再补抓一次 + 重出页面，池子必定是当期的。
#
#  【班次怎么认出来的】不是拿 cron 字符串做精确比较（一条 cron 可以是一串小时，
#    同一个表达式在不同小时触发时班次完全不同），而是
#    「cron 形态 + 实际北京时间」联合判断 —— 逻辑写在 cloud/cloud-build.mjs
#    的 resolveSlot() / SLOT_PLAN 里，workflow 只负责把 github.event.schedule 原样传过去。
#    （历史上这里踩过坑：cron 的分钟字段是 */30 这种带斜杠的写法，
#      老版解析不出来 → 全部退化成 auto；新版专门支持了这种写法。）
#
#  也可以在仓库 Actions 页面手动点「Run workflow」立即执行。
#  手动触发时可以：· quick=0 → 真的去抓数据（默认 1 = 只重新渲染，最快）
#                  · slot=full/regular/draw-update/live-only/heatmap-only/heatmap-off
#                    → 强制跑某一个班次（用来验证 / 补跑）
# ============================================================

on:
  schedule:
    # 【历史】原来这里是「每 5 分钟只更新比分」的 星号/5 那条：
    #   2026-10-18 曾把它并入下面的 */10（减少排队互撞）；
    #   2026-10-20 又单独加回来（错峰写法）；2026-10-19 再次停用（见下面那条的说明）。
    # 【每 10 分钟】常规班：晒票要 10 分钟一轮（用户要求「改成10分钟在全网获取一遍」）
    #   ⚠️ 云端现在【只有这一条】密集班，比分/晒票/竞彩都是 10 分钟一轮。
    #      那些不需要 10 分钟一轮的步骤（文章 / 在售场次）由脚本自己的
    #      --min-gap 30 把关，所以不会把源站问爆。
    #   ⚠️ GitHub 的 cron 在高峰期可能延迟几分钟，10 分钟只是"争取"，
    #      实际间隔可能到 12~15 分钟；要紧的是别把源站打爆，所以不做补偿。
    - cron: '*/10 * * * *'
      # 【开奖后精准跑 · 用户 2026-10-21「加」】
      # 双色球 21:15 开奖 → 21:40 跑（UTC 13:40 · 周二/四/日）
    - cron: '40 13 * * 0,2,4'
      # 大乐透 21:25 开奖 → 21:50 跑（UTC 13:50 · 周一/三/六）
    - cron: '50 13 * * 1,3,6'
    # 【每 5 分钟 · 只更新比分】live-only 轻量班 —— 【2026-10-19 已停用，不要随手加回来】
    #   原来这里有一条：cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'（288 班/天）。
    #   停用原因（实测）：它把云端排队位【永远占满】——
    #     · 一班要跑 6~20 分钟，而触发每 5 分钟一次，加上 */10 和每小时 :07，
    #       排队位（一个 concurrency 组只有 1 个 pending 名额）从来没空过；
    #     · 每个新触发都会把【正排队的上一班】取消掉 → 最近 13 次运行全是
    #       cancelled、jobs 数 = 0，连每天 02:00 的全量班都被顶掉 → 线上不更新。
    #   用户 2026-10-19 明确：**「宁可慢 5 分钟，也不能让云端跑不完」**。
    #   ⇒ 比分回到 10 分钟一轮（由下面 */10 那条负责，动作完全一样，只是少了一半频次）。
    #   ⚠️ 想恢复 5 分钟：把 cron 加回来【同时】确认上面 concurrency.group 仍然带
    #      ${{ github.event.schedule }} 指纹（不同 cron 各自排队、互不取消），
    #      否则会重新变成"新班顶掉旧班"。另外每恢复一条密集 cron，
    #      就多一倍 Pages 部署次数（GitHub 建议每小时不超过 10 次部署）。
    # - cron: '2,7,12,17,22,27,32,37,42,47,52,57 * * * *'
    # 【历史 · 已不存在】原来还有一条 */30 的独立 regular 班，
    #   2026-10-18 已并入 */10（减少排队互撞），现在只剩上面那条 */10。
    # 【全量更新 · 固定凌晨 2 点】UTC 18:00 = 北京 02:00（次日）
    #   抓全部数据 + 缺才补摇 + 清空热力图 + 清理缓存。
    #   ⚠️ 这一条和 */10 那条有可能在同一分钟各触发一次，
    #      所以 full 班的摇号用「缺才补」而不是「强制重摇」——两次跑出来的结果一致，
    #      不会把已经发布出去的号码摇两遍。
    - cron: '0 18 * * *'
    # 【加热力图】UTC 10:00 = 北京 18:00（开奖日才出图）
    - cron: '0 10 * * *'
    # 【热力图 · 每小时更新】用户 2026-10-17：「热力图…每一小时更新一次」
    #   UTC :07 = 北京 :07（每小时一次）。
    #   ⚠️ 为什么是 :07 而不是 :00：:00 那一分钟已经有好几条 cron 一起触发
    #      （*/10、全量 02:00、出热力图 18:00、去热力图 21:00），
    #      挤在同一分钟曾经互相取消（实测风暴）。
    #   ⚠️ 2026-10-19 起 concurrency.group 带触发源指纹（见文件下方），
    #      所以就算同一分钟有两条 cron，它们也各排各的队、不会互相取消。
    #      cloud-build.mjs 的 resolveSlot() 认「分钟=7」→ 走 heatmap-only 班次。
    - cron: '7 * * * *'
    # 【去掉热力图】UTC 13:00 = 北京 21:00
    - cron: '0 13 * * *'
    # 【更新开奖号码 · 第 1 次】UTC 13:30 = 北京 21:30
    #   本机也是 21:30 那一班抓（春风十里-开奖更新-2130）；
    #   云端排在同一时刻：抓开奖 → 摇下一期 → 出页面 → 发布。
    #   抓不到会自动【重试一次】，15 分钟后还有 21:45 那一班兜底。
    - cron: '30 13 * * *'
    # 【更新开奖号码 · 第 2 次】UTC 13:45 = 北京 21:45
    #   本机体彩那一班（春风十里-开奖更新-2145）之后，云端再抓一遍：
    #   抓全为止（两班互为重试）。
    - cron: '45 13 * * *'
    # 【核对开奖 + 公布中奖 · 第 3 次】UTC 14:00 = 北京 22:00
    #   用户 2026-10-20：「小喇叭和历史开奖要自己在晚上22点抓取开奖记录核对我的资料自行公布」。
    #   为什么还要有这一班：21:30 / 21:45 那两班各有「最多 8 轮 × 5 分钟」的重试，
    #   但慢开奖的彩种（个别源拖到 22:00 之后才发布）确实会漏 —— 漏了就等于
    #   【历史开奖还是上一期、小喇叭也不播这一期的中奖】。所以 22:00 再补一班：
    #       抓全 8 个彩种 → build-history（history.js）→ build-broadcast（broadcast.json）
    #       → export-static（拿 reco-archive.json 的真实推荐号比开奖号，中了写 wins，
    #         历史开奖 + 小喇叭一起更新）→ export-football（喇叭读 broadcast.json）
    #       → 摇下一期（缺才补）→ 出页面 → 发布。
    #   本机同一时刻也有这一班（春风十里-开奖核对-2200 / update-draws-reconcile.mjs）。
    #   ⚠️ 班次仍用 draw-update（21:30 / 21:45 / 22:00 / 23:00 四班同一套动作、互为重试）；
    #      cloud-build.mjs 的 SLOT_AT 里已经登记了 '22:00' → draw-update，
    #      不登记的话这一班会被当成 football-only（不抓开奖）—— 改 cron 时务必一起看。
    - cron: '0 14 * * *'
    # 【刷新青蛙号码池 · 当天最后一班】UTC 15:00 = 北京 23:00
    #   用户 2026-10-20：「青蛙号码池设置开奖后23点就自动刷新」。
    #   青蛙号码池 = 双色球 / 大乐透「核心算法 20 码」，用【期号当种子】，
    #   所以「换期就自动变」—— 而期号 +1 只由「抓到新开奖」驱动。
    #   开奖在 21:15 / 21:25，21:30 / 21:45 / 22:00 三班负责抓；个别源拖到
    #   22:00 之后才发布时，那三班会全扑空 → 期号不变 → 池子还是上一期。
    #   所以 23:00 再兜一次保险（这时当天的号肯定都齐了）：
    #       抓开奖（缺才抓）→ 出页面（重算 20 码）→ 发布 tickets.json。
    #   本机同一时刻也有这一班（春风十里-号码池刷新-2300 / update-pool-refresh.mjs）。
    #   ⚠️ 班次仍用 draw-update；cloud-build.mjs 的 SLOT_AT 里已经登记了
    #      '23:00' → draw-update，不登记的话这一班会被判成 football-only
    #      （不抓开奖、不出号）—— 改/加 cron 时务必一起看。
    - cron: '0 15 * * *'
  workflow_dispatch:        # 允许手动触发（本机 sync-cloud.mjs 就是这么触发的）
    inputs:
      quick:
        description: '快速模式：刚同步过数据，跳过抓取，只用同步过来的数据重新渲染 + 部署'
        required: false
        default: '1'
      heatmap:
        description: '热力图：1=抓当日晒票；0=不抓；留空=按班次自动判断'
        required: false
        default: ''
      slot:
        description: '强制指定班次（留空=按 cron 自动判断）：full / regular / live-only / draw-update / heatmap-only / heatmap-off'
        required: false
        default: ''

# 【2026-10-19 修 · 最近 13 次全 cancelled 的真根因，务必保留这段注释】
#   现象：连续 13 个 run 结论 cancelled，且【jobs 数 = 0】（一次都没跑起来）。
#   真根因不是 cancel-in-progress: true（它本来就是 false），而是 GitHub 的另一条规则：
#     同一 concurrency group 里【只允许有 1 个 pending（排队）run】——
#     再来一个触发，就把【还没开始跑的那个】取消掉（GitHub 官方文档：
#     "Any previously pending job or workflow in the concurrency group will be canceled"）。
#   证据：每个 cancelled 的 run 被取消的时刻，正好是【下一个 run 被创建的同一秒】，
#         且这些 run 的 jobs 列表是空的（说明被取消时还在排队、没占用 runner）。
#   为什么会挤满：班次要跑 6~20 分钟，而触发是 每 5 分钟 + 每 10 分钟 + 每小时 :07
#     + 本机 sync-cloud 的 workflow_dispatch（那天 02:42~03:05 连发 15 次）→
#     排队位永远被新触发顶掉 → 连每天 02:00 的全量班都会在排队时被顶掉。
#   修法（两处）：① 下面 concurrency.group 带上【触发源指纹】，各排各的队，
#                    谁也别顶掉谁（全量/开奖/热力图这些关键班次再也不会被顶掉）；
#                 ② 去掉每 5 分钟那条 cron（见 on.schedule 里的说明），
#                    把 288 班/天 的压力降下来（"宁可慢 5 分钟，也不能跑不完"）。
# 【说明】这里故意【不加】on: push 触发。
# 构建结束后会把 cloud/ 下的产物提交回仓库（见下面的提交步骤），
# 如果加了 push 触发，那次提交又会触发一次构建 → 无限循环。
# 本机同步（cloud/sync-cloud.mjs）上传完文件会用 workflow_dispatch 触发，
# 效果一样，而且不会循环。

# 允许把生成的网页提交回仓库
permissions:
  contents: write
  pages: write
  id-token: write

# 每个 run 一个独立的 concurrency 组（= 等于没有 concurrency，但保留段落形式）
# ============================================================
# 【2026-10-20 修 · 死锁】
#   现象（本机实测 UTC 16:32）：2 个 run 卡在 in_progress（#39279138046 已 56 分钟、
#     #39283107518 的 deploy 卡住），5 个 run 排队 queued、1 个 pending，
#     想取消还回 409 —— 网页一直不更新。
#   ⚠️ 两件事叠在一起，别只怪一方：
#     ① GitHub 平台自己在故障：githubstatus.com 2026-10-19T15:49Z 起
#        「Degraded availability for GitHub Actions, GitHub Pages and Webhooks」
#        （Actions / Pages 都是 degraded_performance）→ 卡住那两个 run
#        【所有 job 的所有步骤都 success，run 却一直 in_progress】，是平台侧不回收。
#     ② 上一版 concurrency.group 带【触发源指纹】（daily-update-<cron> / -manual）：
#        同一个 cron 组的下一班必须等上一班跑完 → 上一班被平台卡住，
#        整组就一起卡住，谁都不开跑（关键班次也一起等）。
#        ⚠️ 所以「表达式里写 schedule 字符串」本身没坏（GitHub 按文档生效），
#           要修的是「一个 run 卡住就拖死一整队」这个放大效应。
#   现在：group 用 github.run_id —— 每个 run 一个独立的组，
#         【永不互等、永不互取消】：不会因为别人的班次卡住就不开跑。
#   代价：极端情况可能同时跑两班（浪费 runner 分钟，但不会坏数据：
#         同一份数据构建结果一样、Pages 发布自己带锁、git push 那步本来就有 5 次重试）。
#   好处：不会再出现「整队 waiting、网页一直不更新」。
#   cancel-in-progress 仍为 false —— 它只决定「自己会不会被打断」，和「要不要等别人」无关。
# ============================================================
concurrency:
  group: daily-update-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # 【关键】用北京时间。
    # GitHub 服务器是 UTC，不设这个的话，北京凌晨 2 点跑出来
    # 会算成前一天，导致「公历/农历/干支/开奖日期」全都差一天，
    # 网页和 App 就对不上了。
    env:
      TZ: Asia/Shanghai

    steps:
      - name: 取出仓库代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 判断这一班是「快速模式」还是「完整抓取」，以及热力图要不要抓。
      # 【班次类型】不在这里判断 —— 由 cloud-build.mjs 按
      # 「cron 形态 + 实际北京时间」判断（resolveSlot），
      # 这里只把 github.event.schedule 原样传下去。
      - name: 判断是否快速模式 / 热力图开关 / 强制班次
        id: mode
        run: |
          QUICK="${{ github.event.inputs.quick }}"
          # 定时任务（schedule）没有输入 → 0，交给 cloud-build.mjs 按
          # sync-stamp.json 的 12 小时规则 + 班次表自己决定抓什么。
          # 手动触发 → 用输入里的值，默认 1（闪电重建）。
          if [ -z "$QUICK" ]; then QUICK=0; fi

          # 热力图：留空 = 由 cloud-build.mjs 按班次决定
          # （18:00 班出图 / 21:00 班清空 / 02:00 班清空 / 其余班不动）。
          # 手动触发时可以在界面上填 1 强制抓、填 0 强制不抓。
          HEATMAP="${{ github.event.inputs.heatmap }}"

          # 【强制班次】留空 = 按 cron 自动判断；填了就直接跑那个班次
          # （临时补跑某个班次 / 验证某个班次时用）。
          SLOT="${{ github.event.inputs.slot }}"

          echo "quick=$QUICK"     >> "$GITHUB_OUTPUT"
          echo "heatmap=$HEATMAP" >> "$GITHUB_OUTPUT"
          echo "slot=$SLOT"       >> "$GITHUB_OUTPUT"
          echo "事件=${{ github.event_name }}　cron=${{ github.event.schedule }}　快速模式=$QUICK　热力图=$HEATMAP　强制班次=$SLOT"

      # 【热力图 · 票面照片 OCR】
      #   热力图的主口径是「一起彩晒票页 → 下载票面照片 → OCR 识别号码」。
      #   这里【不需要装任何 OCR 引擎】：
      #     · 引擎是纯 JS 的 tesseract.js（WASM），语言模型是 chi_sim+eng，
      #       两者都由本机 cloud/sync-cloud.mjs 同步进仓库
      #       （cloud/scripts/runtime/ocr/，约 54 MB / 317 个文件，完全离线）；
      #     · 因此不用 apt-get、不用进 npm、不依赖任何 CDN —— 云端不会因为
      #       网络问题装不上 OCR，也不会和本机结果不一致。
      #   这一步只是「体检」：把体积打出来，缺文件就报错，避免静默降级。
      - name: 检查票面照片 OCR 运行时（纯 JS，无需安装）
        run: |
          echo "--- runtime/ocr 体积 ---"
          du -sh cloud/scripts/runtime/ocr 2>/dev/null || echo "（没有 runtime/ocr）"
          echo "--- 关键文件 ---"
          for f in \
            cloud/scripts/ocr-tickets.mjs \
            cloud/scripts/runtime/ocr/node_modules/tesseract.js/src/index.js \
            cloud/scripts/runtime/ocr/node_modules/tesseract.js-core/index.js \
            cloud/scripts/runtime/ocr/tessdata/chi_sim.traineddata.gz \
            cloud/scripts/runtime/ocr/tessdata/eng.traineddata.gz ; do
            if [ -f "$f" ]; then echo "✅ $f  ($(du -h "$f" | cut -f1))"
            else echo "⚠️  缺 $f —— 热力图会降级成「近 30 期开奖频率」"; fi
          done

      # 【足球晒票 · 票面照片】尽力而为的一步（2026-10-18 加）
      #   实测：GitHub（美国 eastus）访问这个源返回 HTTP 405（阿里云 WAF），
      #   所以云端这一班【抓不到】，真正能用的数据是本机抓好、随 sync 同步过来的
      #   cloud/scripts/football-tickets.js。
      #   ⚠️ 那为什么还留着这一步：
      #       ① 抓取脚本自己会「抓不到就退 10、不覆盖旧文件」，
      #          所以本机同步过来的那份【绝不会】被云端这一班冲掉；
      #       ② 万一哪天 WAF 放开了，云端不用改代码就自动开始出票面。
      #   ⚠️ 必须 continue-on-error + `|| true`：它失败是【预期内的】，不能把流程弄红。
      - name: 足球晒票票面（尽力而为 · 云端预期 405）
        continue-on-error: true
        run: |
          cd cloud
          node scripts/fetch-football-tickets.mjs || {
            code=$?
            if [ "$code" = "10" ]; then
              echo "（预期内）本轮没抓到 —— 沿用同步过来的 football-tickets.js"
            else
              echo "（预期内，云端抓不到这个源）退出码 $code —— 沿用同步过来的 football-tickets.js"
            fi
          }

      - name: 执行云端构建
        working-directory: cloud
        env:
          CLOUD_QUICK: ${{ steps.mode.outputs.quick }}
          # 留空 = 让 cloud-build.mjs 按班次判断；填 0/1 = 强制
          CLOUD_HEATMAP: ${{ steps.mode.outputs.heatmap }}
          # 留空 = 按 cron 判断班次；填了 = 强制跑这个班次（临时补跑 / 验证用）
          CLOUD_SLOT: ${{ steps.mode.outputs.slot }}
          # 【关键】把是哪一个 cron 触发的传给 cloud-build.mjs ——
          # 它用「这个 cron 的形态（每5分钟/每30分钟/定时）+ 实际北京时间」算出班次类型
          # （full / regular / live-only / heatmap-only / heatmap-off / draw-update）。
          # 注意：cron 可以是一串小时，同一个字符串在不同小时触发 → 班次不同，
          # 所以【绝不能】用字符串相等来判断（原来写死 '0 10 * * *' 就是这么失效的）。
          HEATMAP_SLOT: ${{ github.event.schedule }}
          # 【强制重摇】不需要在这里传：缺才补摇由 SLOT_PLAN 自动决定。
          # 需要临时强制/禁止时，也可以在这里加 CLOUD_ROLL=force|fill|skip。
          #
          # 【开奖数据源顺序 · 关键】GitHub 服务器在美国，抓中国彩票官方接口
          # 会被直接拒绝（实测：福彩 cwl.gov.cn → 403、体彩 sporttery.cn → 567），
          # 所以云端【不能】把官方接口排第一：一次 403 就白等一轮超时。
          # 这里明确指定「美国 IP 也能通」的公开源优先，官方接口放最后兜底
          # （万一哪天通了就自动用回权威源）：
          #     一起彩   www.yiqicai.com/kj/  ← 一个页面覆盖全部 8 个彩种
          #     500XML   kaijiang.500.com/static/.../list.xml
          #     17500    www.17500.cn/getData/*.TXT
          #     官方     福彩 / 体彩官方接口（兜底尝试）
          # 注意：这三个备选源都是【公开可访问的页面/接口】，没有绕过任何访问限制；
          #       与本机跑的是同一份代码、同一套号码合法性校验。
          # 想临时换顺序：改这一行即可（逗号分隔，留空段=关掉某个源）。
          DRAW_SOURCE_ORDER: 'yiqicai,fc500,fc17500,official'
          # 抓取用的出口标记（build-draws/history 用它决定默认源顺序 + 日志口径）
          CLOUD_BUILD: '1'
        # 【容错】抓取/渲染万一失败，也不要整个流程挂掉：
        # 后面照样会部署「上一次成功的网页 + 本次的 tickets.json」，
        # 分享页拉到新 tickets.json 就能把号码换新（页面自带重渲染逻辑）。
        continue-on-error: true
        run: node cloud-build.mjs

      # 【必须每次都跑】把这一班生成/更新的产物放进 site/。
      # 用户要求「所有的更新都要同步到网页上」：
      # 不管哪一班，只要跑到这里，site/ 就是这一班的最新产物，随后一定会被部署。
      #
      # 【兜底：从线上拉回当前那一份】
      #   cloud-build.mjs 只发布【本次真的重新生成过】的页面（看文件修改时间），
      #   没生成就不拷贝 → 这里 site/ 就会缺文件。
      #   缺了就说明「这一班没有新页面」，那就把【正在对外服务的最新那份】拉回来：
      #   ① 站点永远不会 404；② 绝不会把旧页面当成新页面发出去。
      - name: 把生成的网页放到站点目录
        if: always()
        run: |
          mkdir -p site
          cp -f cloud/out/index.html    site/index.html    || true
          cp -f cloud/out/football.html site/football.html || true
          # 【走势图】2026-10-17：原来这里还有一行
          #   cp -f cloud/out/走势图.html site/走势图.html || true
          # 用户要求「留在近30期走势预选参考里面. 删除单独走势图独立页」→
          # 独立页不再生成、也不再发布；走势图内容内联在 index.html 的
          # 「近 30 期走势 · 预选参考」折叠块里，所以这一行【删掉】
          # （留着只会往 site/ 拷一个不存在的文件，日志里白白多一行 || true）。
          # 【比赛详情页】竞彩页每张比赛卡片都指向 比赛详情.html?c=编号
          #   （__MATCH_DETAIL_LINK__ 由 export-football.mjs 加的卡片链接）。
          #   不在这里 cp 的话，即使 cloud-build.mjs 把它拷进了 out/，
          #   也【永远进不了 site/】→ 线上 64 张卡片全点到 404。
          cp -f cloud/out/比赛详情.html site/比赛详情.html || true
          # 【准实时数据源】分享页会去拉这个文件；
          # 只要它是新的，页面拿到后立刻就地重渲染成新号码
          cp -f cloud/out/tickets.json  site/tickets.json  || true
          # 【图片上云 · 用户 2026-10-21】imgs/ 整个目录复制进 site/ ✔
          cp -r imgs site/imgs 2>/dev/null || true
          # 【名家图库 · 云端自己抓的图】2026-10-21：build-mingjia.mjs 在云端把图写进
          #   cloud/scripts/imgs/mingjia/（cwd=cloud/scripts），上面那行只拷仓库根的 imgs/，
          #   不补这一行 → 云端抓的图永远进不了 site/ → 线上名家图库全是 404。
          cp -r cloud/scripts/imgs site/imgs 2>/dev/null || true
          # 【分享卡片 / 图标 / PWA】
          #   这一步以前只拷上面三个文件 —— cloud-build.mjs 明明已经把图标
          #   拷进 out/ 了，可不在这里 cp 就【永远进不了 site/】，
          #   线上 favicon.ico / share.png / manifest.webmanifest 全是 404。
          #   所以这里必须补上（名单和 cloud-build.mjs 的 ICON_FILES、
          #   两个页面 <head> 里的引用三者要一致）。
          #   ⚠️ manifest.json 是页面现在引用的清单文件（相对路径，用户指定）；
          #      manifest.webmanifest 是旧文件名，留着不删以免老页面/老缓存 404。
          for f in favicon.ico icon.ico icon.svg icon-192.png icon-512.png \
                   apple-touch-icon.png share.png manifest.json manifest.webmanifest; do
            cp -f "cloud/out/$f" "site/$f" || true
          done
          # 【PWA · Service Worker】必须在站点【根目录】（和 index.html 同级），
          #   scope 才覆盖全站 —— 它不在 icons/ 里，cloud-build.mjs 是单独拷进 out/ 的。
          #   ⚠️ 这一步以前【漏了】→ 线上 service-worker.js 一直 404
          #      → 浏览器判定"不可安装" → beforeinstallprompt 永远不触发
          #      → 「📱 一键桌面」在安卓 Chrome 上点了只能出引导提示，弹不出原生安装框。
          cp -f cloud/out/service-worker.js site/service-worker.js || true
          # 【祝福视频】用户 2026-10-18：分享页聊天框顶部的祝福视频（blessing.mp4，2.82 MB）。
          #   来源是 cloud/scripts/blessing.mp4（由本机 sync-cloud.mjs 的 FROM_ROOT 同步上来），
          #   【不是】cloud/out/ —— cloud-build.mjs 只搬 out/ 里那几个白名单文件，
          #   这一个直接走 scripts → site/，所以 cloud-build.mjs 不用改。
          #   ⚠️ 少了这一行 → 线上 404 → 聊天框里只剩「点击播放视频」占位块
          #      （点一下仍有 TTS 语音 + 黄色气泡，但视频永远播不了）。
          #   ⚠️ 必须放在 `mkdir -p site` 之后（本步第一行已经建好）。
          cp -f cloud/scripts/blessing.mp4 site/blessing.mp4 || true
          # 【安装教程大图】用户 2026-10-18 21:50 确认要这张图：分享页「添加到手机桌面」
          #   区块顶部的 install-guide.jpg（800×1432 / 约 204 KB JPEG）。
          #   和 blessing.mp4 一样走 scripts → site/（cloud-build.mjs 不用改），
          #   来源是 cloud/scripts/install-guide.jpg（由本机 sync-cloud.mjs 的 FROM_ROOT 同步上来）。
          #   ⚠️ 少了这一行 → 线上 install-guide.jpg 404 → 图被收起，区块里只剩两列卡片。
          cp -f cloud/scripts/install-guide.jpg site/install-guide.jpg || true
          # 【算法说明独立页 · iframe 子页】用户 2026-10-20 报：iframe 里出
          #   GitHub Pages 的 404 页面（「推荐图 · 方法」那块最明显）。
          #   根因：分享页 / 竞彩页里一共 13 个 <iframe> 指向这 3 个独立页 ——
          #     px9-methods.html ×5 · minjian-methods.html ×6 · core-jiajian.html ×2
          #   它们是【跑在 iframe 里的完整 html】，不是内联片段，必须单独发到站点根目录。
          #   sync-cloud.mjs 的 PAGE_ARTIFACTS 名单里早有这 3 个（仓库 cloud/scripts/ 下有），
          #   可【这一步以前没有 cp】→ 永远进不了 site/ → 线上 404。
          #   和 blessing.mp4 / install-guide.jpg 一样走 scripts → site/
          #   （cloud-build.mjs 不用改，它只搬 out/ 里那几个白名单文件）。
          cp -f cloud/scripts/px9-methods.html     site/px9-methods.html     || true
          cp -f cloud/scripts/minjian-methods.html site/minjian-methods.html || true
          cp -f cloud/scripts/core-jiajian.html    site/core-jiajian.html    || true
          # 【连带依赖】上面 3 个独立页里都有一行 <script src="history.js"></script>，
          #   靠它拿到 DRAW_HISTORY（const 不挂 window，页面直接按名字取）。
          #   主页面 index.html 是把 DRAW_HISTORY 内联进去的，所以以前站点根目录
          #   没有 history.js 也没事；可这 3 个 iframe 子页是【外链】的 →
          #   site/history.js 缺失的话，iframe 里虽然不再是 404 页面，
          #   但会显示「数据缺失 · history.js 没有该彩种」。
          #   来源 cloud/scripts/history.js（sync-cloud 的 FROM_ROOT 同步的）。
          cp -f cloud/scripts/history.js site/history.js || true
          # __RECO_SITE_COPY__ 【推荐串存档】页面会去加载这几个文件。
          # 不在这里 cp 的话，即使 cloud-build.mjs 把它们拷进了 out/，
          # 也【永远进不了 site/】→ 线上 404 → 30 秒刷新静默失效。
          for f in jc-reco-view.js jc-reco-data.js jc-reco-archive.js jc-reco-stats.json; do
            cp -f "cloud/out/$f" "site/$f" || true
          done
          RECO_OK=0
          for f in jc-reco-view.js jc-reco-data.js jc-reco-archive.js; do
            if [ -s "site/$f" ]; then
              echo "✅ site/$f  $(du -h "site/$f" | cut -f1)"
              RECO_OK=$((RECO_OK+1))
            else
              echo "⚠️ site/$f 缺失 -> 线上 404，推荐串刷新会静默失效"
            fi
          done
          echo "推荐串文件进 site/ 的个数：$RECO_OK / 3"
          # 【往期推荐串 · 前端拉取】用户 2026-10-17 要求页面每 60 秒 fetch
          #   ./data/recommend.json（云端每 5 分钟的班重建它）。
          #   cloud-build.mjs 已经把它拷进 out/data/，这里必须再放进 site/data/
          #   —— 不加这行线上永远 404，前端拉取静默失效（页面退回烘好的那份）。
          mkdir -p site/data
          cp -f cloud/out/data/recommend.json site/data/recommend.json || true
          if [ -s site/data/recommend.json ]; then
            echo "✅ site/data/recommend.json $(du -h site/data/recommend.json | cut -f1)"
          else
            echo "⚠️ site/data/recommend.json 缺失 -> 线上 404，往期推荐串拉取会退回页面烘好的那份"
          fi
          BASE="https://chunfengww2026.github.io/chunfeng-lottery"
          # 兜底列表只放页面（图标缺失时从线上拉回旧的那份没有意义，
          # 真要缺就在下面的自证里报警，让人去补文件）
          # ⚠️ 比赛详情.html 也在这里：这一班没出详情页时，从线上拉回当前那份，
          #    免得竞彩页 64 张卡片的链接集体 404。
          # ⚠️ 2026-10-17：兜底列表里原来还有 走势图.html（第三个独立页）。
          #    用户要求「删除单独走势图独立页」→ 那一页不再发布，从列表里【删掉】，
          #    否则每次构建都会去线上拉一个已经不存在的页面（拉了也是 404）。
          for f in index.html football.html 比赛详情.html tickets.json; do
            if [ -s "site/$f" ]; then
              echo "✅ site/$f 由本次构建产出（$(du -h "site/$f" | cut -f1)）"
              continue
            fi
            echo "⚠️ site/$f 本次没产出 → 从线上拉回当前那一份兜底"
            ok=0
            for try in 1 2 3; do
              if curl -fsSL --max-time 60 -H 'Cache-Control: no-cache' "$BASE/$f?t=$(date +%s)" -o "site/$f"; then ok=1; break; fi
              echo "   第 $try 次拉取失败，5 秒后重试"
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "   ✅ 已拉回 $f"; else echo "::warning::兜底也失败：$f"; fi
          done
          touch site/.nojekyll
          # 【分享卡片 / 图标 / PWA】逐个自证
          #   这些文件由 cloud-build.mjs 从 cloud/scripts/icons/ 拷进 out/，
          #   上面 cp 完 out/ 就到位了。缺任何一个都说明图标没同步上仓库，
          #   页面 <head> 里引用的 favicon / manifest / share.png 就会 404。
          echo "--- 分享图标自证 ---"
          MISSING=0
          for f in favicon.ico icon.ico icon.svg icon-192.png icon-512.png apple-touch-icon.png share.png manifest.json manifest.webmanifest; do
            if [ -s "site/$f" ]; then
              echo "✅ site/$f  $(du -h "site/$f" | cut -f1)"
            else
              echo "❌ site/$f 缺失（本机需要跑一次 node make-icons.mjs 再 node sync-cloud.mjs）"
              MISSING=$((MISSING+1))
            fi
          done
          if [ "$MISSING" != "0" ]; then
            echo "::warning::$MISSING 个分享图标没进 site/ —— 页面图标会 404（页面本身仍可访问）"
          fi
          # 【PWA 自证】SW 必须真的在站点根目录，否则「一键桌面」装不上。
          if [ -s "site/service-worker.js" ]; then
            echo "✅ site/service-worker.js  $(du -h "site/service-worker.js" | cut -f1)（纯透传，不缓存）"
          else
            echo "⚠️ site/service-worker.js 缺失 -> 线上 PWA 不可安装（页面仍可访问）"
          fi
          # 【祝福视频自证】聊天框顶部那个 video 的 src 就是 ./blessing.mp4。
          if [ -s site/blessing.mp4 ]; then
            echo "✅ site/blessing.mp4  $(du -h site/blessing.mp4 | cut -f1)（聊天框顶部祝福视频，懒加载）"
          else
            echo "⚠️ site/blessing.mp4 缺失 -> 聊天框视频 404（页面会退回占位块 + TTS 语音，视频播不了）"
          fi
          # 【安装教程大图自证】分享页安装区块顶部的 <img src="./install-guide.jpg">
          if [ -s site/install-guide.jpg ]; then
            echo "✅ site/install-guide.jpg  $(du -h site/install-guide.jpg | cut -f1)（安装教程大图，懒加载）"
          else
            echo "⚠️ site/install-guide.jpg 缺失 -> 线上 404，安装区块顶部图位空白（lazy 失败会收起）"
          fi
          # 【算法说明独立页自证】分享页 / 竞彩页里 13 个 <iframe> 的 src 就是这 3 个文件。
          #   -s 检查文件存在且非空；缺任何一个 → 那个 iframe 里就会显示 404 页面。
          echo "--- 算法说明独立页自证 ---"
          SUB_OK=0
          for f in px9-methods.html minjian-methods.html core-jiajian.html; do
            if [ -s "site/$f" ]; then
              echo "✅ site/$f  $(du -h "site/$f" | cut -f1)"
              SUB_OK=$((SUB_OK+1))
            else
              echo "::warning::site/$f 缺失 -> 线上 iframe 里显示 404（推荐图·方法 / 九算法 / 民间算法 / 核心算法 区块空白）"
            fi
          done
          echo "算法说明独立页进 site/ 的个数：$SUB_OK / 3"
          # 连带依赖：3 个独立页都外链 history.js，缺了 iframe 里就是「数据缺失」。
          if [ -s site/history.js ]; then
            echo "✅ site/history.js  $(du -h site/history.js | cut -f1)（3 个 iframe 子页的数据源）"
          else
            echo "::warning::site/history.js 缺失 -> iframe 子页里显示「数据缺失 · history.js 没有该彩种」"
          fi
          echo "--- site 目录内容 ---"
          ls -lh site/
          echo "--- tickets.json 里的时间 ---"
          node -e "const j=require('./site/tickets.json');console.log('updated='+j.updated,'publishedAt='+j.publishedAt,'source='+j.source)" || true
          if [ ! -s site/index.html ]; then
            echo "::error::site/index.html 不存在 —— 本次没有任何页面可以发布"
            exit 1
          fi

      - name: 数据新鲜度汇报（每一班都打）
        if: always()
        run: |
          echo "===== 各数据文件自带的更新时间（北京时间）====="
          # 【已完场赛果 · 终场比分】jc-results.js（2026-10-18 加）：
          #   由 build-football-results.mjs 抓 live.500.com 完场页生成，
          #   同时用来纠正 jc-history.js 里被「比赛进行中快照」冻住的错比分。
          #   ⚠️ 这里的时间戳 = 本机最后一次同步过来的时间（云端 3b 那一步也会刷新它）；
          #      如果一直不动，说明本机那条更新链停了，推荐串红黑不会再自我纠正。
          for f in draws.js history.js prize-data.js football.js jc-data.js \
                   articles-data.js xysp-data.js kjh-data.js experts-data.js jc-official.js \
                   jc-divergence.js jc-titan.js jc-bifa.js jc-standings.js jc-results.js ; do
            if [ -f "cloud/scripts/$f" ]; then
              S=$(grep -o '"updated"[[:space:]]*:[[:space:]]*"[^"]*"' "cloud/scripts/$f" | head -1 | sed 's/.*"\([^"]*\)"$/\1/')
              if [ -z "$S" ]; then S=$(grep -oE '(更新时间|生成时间)[：:][[:space:]]*[0-9-]+ [0-9:]+' "cloud/scripts/$f" | head -1); fi
              printf '  %-20s 最后更新：%s\n' "$f" "${S:-（读不到）}"
            else
              printf '  %-20s ❌ 文件不存在\n' "$f"
            fi
          done
          # 【足球晒票 · 票面照片】2026-10-18 加。
          #   它的时间戳不是 "updated": 字段，而是 var FB_TICKETS_UPDATED = '...'
          #   （抓取脚本要同时给浏览器和 node 的 vm 读，见 fetch-football-tickets.mjs）。
          #   ⚠️ 云端这一步【预期是抓不到】的（源站 405），所以这里看到的时间
          #      应该等于【本机最后一次同步过来】的时间 —— 如果一直不动，
          #      说明本机那条 10 分钟任务停了，一眼就能看出来。
          if [ -f "cloud/scripts/football-tickets.js" ]; then
            FBT=$(grep -oE "var FB_TICKETS_UPDATED = '[^']*'" cloud/scripts/football-tickets.js | head -1 | sed "s/.*'\([^']*\)'/\1/")
            FBC=$(grep -oE '"image_url"' cloud/scripts/football-tickets.js | wc -l)
            printf '  %-20s 最后更新：%s （%s 张）\n' "football-tickets.js" "${FBT:-（读不到）}" "$FBC"
          else
            printf '  %-20s ❌ 文件不存在\n' "football-tickets.js"
          fi
          echo "===== 推荐号码存档 ====="
          grep -oE '"updated"[[:space:]]*:[[:space:]]*"[^"]*"' cloud/scripts/saved-tickets.js | head -1 || true

      # 【仓库体积守护】用户要求仓库长期保持在 100 MB 以内。
      #   · 真正会撑大仓库的是「每次构建都提交一个 1.27 MB 的网页」——
      #     这一版已经把那两个页面移出版本管理（见下面提交那一步的 git reset）。
      #   · 这一步只做「体检 + 报警」，绝不做任何破坏性操作
      #     （不 force push、不重写历史 —— 代码历史和数据文件一个字都不能丢）。
      - name: 仓库体积守护（超过 100 MB 报警）
        if: always()
        continue-on-error: true
        run: |
          echo "===== 仓库体积 ====="
          SIZE_KB=$(curl -fsSL --max-time 60 \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}" \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{try{console.log(Math.round(JSON.parse(s).size||0))}catch(e){console.log(0)}})")
          echo "GitHub 报告的仓库体积：${SIZE_KB} KB ≈ $((SIZE_KB/1024)) MB"
          echo "本次 checkout 出来的 .git 体积：$(du -sh .git 2>/dev/null | cut -f1)"
          echo "cloud/ 目录体积：$(du -sh cloud 2>/dev/null | cut -f1)"
          echo "（参考）OCR 运行时：$(du -sh cloud/scripts/runtime/ocr 2>/dev/null | cut -f1)"
          if [ "${SIZE_KB:-0}" -gt 102400 ]; then
            echo "::warning::仓库体积已超过 100 MB（${SIZE_KB} KB）—— 需要人工做一次历史瘦身（只重写那两个页面的历史，代码/数据不动）"
          else
            echo "✅ 仓库体积在 100 MB 以内"
          fi

      - name: 提交更新后的数据（保留号码与历史）
        if: always()
        continue-on-error: true
        run: |
          git config user.name  "auto-update-bot"
          git config user.email "auto-update-bot@users.noreply.github.com"
          # 【仓库瘦身 · 用户 2026-10-18 选 A「只提交小数据」】
          #   原来 `git add -A cloud/` 会把 cloud/out 下的大页面一起提交：
          #     index.html 1.9MB / 比赛详情.html 0.36MB / share.png + 图标 0.27MB
          #   实测仓库 10 分钟涨 1.2MB（≈170MB/天）→ 约 6 天就顶到 GitHub 的 1GB 上限。
          #   现在只提交【下一班构建还要用的小数据】（合计几十 KB）：
          #     推荐存档 data/recommend.json · 推荐串派生 js · 票 · 热力图累存
          #   大页面不靠 git 发布（部署走 upload-pages-artifact 的站点产物），
          #   每班也会重新生成，所以不提交它们不会影响线上。
          git add -A cloud/out/data/ cloud/out/jc-reco-data.js cloud/out/jc-reco-archive.js cloud/out/jc-reco-view.js cloud/out/tickets.json cloud/scripts/heatmap-data.js || true
          # Persist collected data and ticket verification between independent cloud runs.
          for f in busuanzi.json football.js jc-data.js jc-history.js jc-results.js draws.js history.js saved-tickets.js reco-archive.json xysp-data.js xysp-tt-data.js xysp-jc-data.js mingjia-data.js mingjia-toutiao.json mingjia-web.json community-topics.json jc-articles.js materials-data.js _ticket-ocr-cache.json; do
            if [ -f "cloud/scripts/$f" ]; then git add -f -- "cloud/scripts/$f"; fi
          done
          if [ -d cloud/scripts/imgs/mingjia ]; then git add -A -- cloud/scripts/imgs/mingjia; fi
          # 【关键】这两个页面【不提交回仓库】：
          #   它们每次构建都会重新生成（只读分享版.html 1.27 MB / 足球推荐.html 52 KB），
          #   提交进去等于每 30 分钟往仓库塞 1.3 MB —— 一天几十 MB。
          #   部署用的是运行时的 site/ 目录（上面那一步），和它们在不在仓库里无关；
          #   万一某班没有新页面，上面那一步已经从线上把当前那份拉回来了。
          git reset -q -- cloud/scripts/只读分享版.html cloud/scripts/足球推荐.html cloud/out/index.html cloud/out/football.html 2>/dev/null || true
          # 【分歧指数据】2026-10-17 第 2 步加的 jc-divergence.js（44 KB）同理【不提交】：
          #   它每个足球班次都会被 build-odds-divergence.mjs 从球探 titan007 重新抓一遍
          #   （每场 320~370 家公司，数字每轮都在变 → git 存不下多少增量），
          #   一天几十班就是几 MB 的仓库体积，而它的内容【已经内嵌在 比赛详情.html 里】，
          #   单独存一份等于同一份数据存两遍（比赛详情.html 本身仍然照常提交）。
          #   ⚠️ 本机 sync-cloud.mjs 会把本机那一份正常传上仓库，所以仓库里永远有兜底的一份；
          #      就算没有，云端 cloud-build.mjs 每班也会自己重新生成，不影响任何页面。
          git reset -q -- cloud/scripts/jc-divergence.js 2>/dev/null || true
          # 【欧赔对比数据】2026-10-17 第 3 步加的 jc-titan.js（约 190 KB）同上【不提交】：
          #   它和 jc-divergence.js 是同一次抓取的两个出口（主流 12 家的 初盘/即时/返还率/凯利），
          #   每个足球班次都会重抓 → 数字每轮都在变，内容【已经内嵌在 比赛详情.html 里】，
          #   单独提交等于同一份数据存两遍。仓库里永远有本机同步过来的兜底一份。
          git reset -q -- cloud/scripts/jc-titan.js 2>/dev/null || true
          # 【雷达寻胆 · 成交资金面】2026-10-17 第 4 步加的 jc-bifa.js（约 10~60 KB）同上【不提交】：
          #   成交额/成交价每轮都在变 → 每个足球班次都会重抓，内容【已经内嵌在 比赛详情.html 里】，
          #   单独提交等于同一份数据存两遍。仓库里永远有本机同步过来的兜底一份；
          #   就算没有，云端每班也会自己重新生成 —— 拿不到只是「雷达寻胆」少一档，不影响页面。
          git reset -q -- cloud/scripts/jc-bifa.js 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "没有变化，跳过提交"
          else
            echo "--- 本次要提交的文件 ---"
            git diff --cached --name-only | head -30
            git commit -m "自动更新 $(date -u '+%Y-%m-%d %H:%M') UTC"
            # 【推送必须抗并发】本机同步（sync-cloud.mjs 走 GitHub API）随时可能
            # 往同一个分支写东西，实测出现过 `! [rejected] main -> main (fetch first)`
            # —— 那一次的数据（含刚摇出来的号）就白丢了。
            # 所以：先把远端拉下来合并（冲突时 -X ours = 以【本次云端算出来的】为准，
            # 因为这里面可能有刚发布的新号码，绝不能被覆盖），然后重试推送 5 次。
            ok=0
            for i in 1 2 3 4 5; do
              git fetch -q origin main || true
              git merge --no-edit -X ours origin/main >/dev/null 2>&1 || true
              if git push -q origin HEAD:main; then ok=1; break; fi
              echo "第 $i 次推送失败（多半是同时有别的东西在推），5 秒后重试"
              sleep 5
            done
            if [ "$ok" = "1" ]; then echo "✅ 数据已推回仓库"; else echo "::warning::重试 5 次都没推上去 —— 下次构建会重新抓一遍，网页本身不受影响"; fi
          fi

      # 【分享包 · Netlify 备用包】2026-10-20（用户批准「export-site 也上云」）
      #   · export-site.mjs 已经进了云端构建（cloud-build.mjs 的 exportList，
      #     排在最后、【只在全量班】跑），产物是 cloud/scripts/分享包/。
      #   · ⚠️ 为什么必须打包成 artifact：runner 是一次性的 ——
      #       分享包/ 既不在下面「提交更新后的数据」的 git add 白名单里，
      #       也不在 site/ 里；不带走的话跑完就随机器一起丢掉，等于白跑。
      #   · ⚠️ 只跟全量班（UTC 18:00 = 北京 02:00）走：一天一个 artifact。
      #       下载解开 → 整个文件夹拖到 https://app.netlify.com/drop 就是最新备用包。
      #   · ⚠️ continue-on-error + if-no-files-found: ignore：
      #       万一没生成就跳过，绝不让流程变红（备用包和线上网页无关）。
      - name: 上传分享包（Netlify 备用包 · 仅全量班）
        if: always() && (github.event.schedule == '0 18 * * *' || github.event.inputs.slot == 'full')
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: 分享包
          path: cloud/scripts/分享包
          if-no-files-found: ignore
          retention-days: 14

      # 【必须每次都跑】哪怕构建步骤部分失败，也要把当前 site/ 发布出去，
      # 不能出现「改了数据但网页没更新」。
      - name: 上传站点产物
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    concurrency:
      group: chunfeng-github-pages-deploy
      cancel-in-progress: false
    # 【关键】always() —— 只要 build 这一步跑过（哪怕它有部分失败、
    # 被 continue-on-error 吞掉），deploy 都必须执行，把当前 site/ 发出去。
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到 GitHub Pages（第 1 次）
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: 等待已有发布释放
        if: steps.deploy1.outcome != 'success'
        run: sleep 30

      - name: 发布到 GitHub Pages（重试一次）
        id: deployment
        if: steps.deploy1.outcome != 'success'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      # 【不能静默失败】两次都失败就明确报错，让这一次班次的失败在 Actions 里看得见。
      - name: 确认发布结果
        if: ${{ always() && needs.build.result == 'success' }}
        run: |
          echo "第 1 次：${{ steps.deploy1.outcome }}"
          echo "重试　：${{ steps.deployment.outcome }}"
          if [ "${{ steps.deploy1.outcome }}" != "success" ] && [ "${{ steps.deployment.outcome }}" != "success" ]; then
            echo "::error::GitHub Pages 两次发布都失败 —— 这一次班次的内容没有更新到网页上"
            exit 1
          fi
          echo "✅ 已发布到网页"

