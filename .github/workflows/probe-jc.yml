name: probe-jc
# 临时探测：云端（美国 IP）能不能访问 jc.titan007.com
# 只发 curl，不写文件、不碰站点、不碰构建逻辑。测完即删。
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: net-probe
        run: |
          set +e
          echo "=== 云端出口 IP ==="
          curl -s --max-time 15 https://api.ipify.org; echo
          curl -s --max-time 15 https://ipinfo.io/json | head -c 300; echo
          echo
          echo "=== 云端时间 ==="
          date -u '+UTC %F %T'
          TZ=Asia/Shanghai date '+SH  %F %T'
          D7=$(TZ=Asia/Shanghai date -d '7 days ago' +%F)
          D1=$(TZ=Asia/Shanghai date -d '1 day ago' +%F)
          echo "D7=$D7 D1=$D1"

          probe() {
            name="$1"; url="$2"
            echo
            echo "---- $name ----"
            echo "URL: $url"
            code=$(curl -sS -L --max-time 30 -A 'Mozilla/5.0' -o /tmp/out.bin -w '%{http_code} %{size_download} %{time_total} %{remote_ip}' "$url" 2>/tmp/err)
            echo "HTTP/SIZE/TIME/IP: $code"
            if [ -s /tmp/err ]; then echo "curl-err: $(head -c 200 /tmp/err | tr -d '\n')"; fi
            echo "BYTES-on-disk: $(wc -c < /tmp/out.bin)"
            echo "周OCC: $(grep -o '周' /tmp/out.bin | wc -l)"
            echo "竞彩编号样例: $(grep -o '周[一二三四五六日][0-9][0-9][0-9]' /tmp/out.bin | head -6 | tr '\n' ',')"
            echo "first200: $(head -c 200 /tmp/out.bin | tr -d '\r\n')"
            echo "---- end $name ----"
          }

          probe "bf_jc.txt(在售/未开赛)" "https://jc.titan007.com/xml/bf_jc.txt"
          probe "JcResult(d=$D7)" "https://jc.titan007.com/handle/JcResult.aspx?d=$D7"
          probe "JcResult(d=$D1)" "https://jc.titan007.com/handle/JcResult.aspx?d=$D1"
          probe "1x2d对照(2910927.js)" "https://1x2d.titan007.com/2910927.js"
          probe "基线(so.toutiao.com)" "https://so.toutiao.com/"

          echo
          echo "=== DNS/连通性小结 ==="
          getent hosts jc.titan007.com || echo "getent jc 失败"
          curl -sS -o /dev/null --max-time 20 -w 'jc.titan007.com 直连 HTTP=%{http_code} ip=%{remote_ip} t=%{time_total}\n' -A 'Mozilla/5.0' https://jc.titan007.com/ || echo "jc 首页直连失败"
          echo "PROBE-DONE"
