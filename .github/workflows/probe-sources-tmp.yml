# 临时探测 workflow（测完就删，不进常规流程）
# 目的：在 GitHub Actions（ubuntu-latest = 美国 IP）上跑 probe-sources-tmp.mjs，
#       看哪些「足球晒票」候选源在云端真的能抓。
name: probe-sources-tmp

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: show egress ip
        run: |
          echo "--- egress ip ---"
          curl -s --max-time 15 https://api.ipify.org || true
          echo
          curl -s --max-time 15 https://ipinfo.io/json || true
      - name: run probe
        run: node probe-sources-tmp.mjs
