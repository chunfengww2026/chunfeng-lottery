name: _probe-toutiao
# 临时探针：验证 GitHub Actions runner（美国 IP）能不能抓今日头条搜索页。
# 用完即删（delete 这个文件即可）。
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A. 不跟随跳转（看 302 去向）
        run: |
          URL="https://www.toutiao.com/search/?keyword=%E6%99%92%E7%A5%A8"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          echo "--- 响应头 ---"
          curl -s -D - -o /tmp/tt0.html -A "$UA" --max-time 40 "$URL" | head -20
          echo "--- body (136B) ---"
          cat /tmp/tt0.html
          echo ""
      - name: B. 跟随跳转 + 重试 3 次
        run: |
          URL="https://www.toutiao.com/search/?keyword=%E6%99%92%E7%A5%A8"
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for i in 1 2 3; do
            OUT=$(curl -sL -o /tmp/tt.html -w 'HTTP=%{http_code} BYTES=%{size_download} URL=%{url_effective}' -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9' --max-time 45 "$URL")
            echo "try$i: $OUT"
            CARDS=$(grep -o 'data-druid-card-data-id' /tmp/tt.html 2>/dev/null | wc -l)
            SIG=$(grep -o 'x-signature=' /tmp/tt.html 2>/dev/null | wc -l)
            echo "try$i: CARDS=$CARDS SIGNED_IMGS=$SIG"
            if [ "$CARDS" -gt 0 ]; then break; fi
            sleep 4
          done
          echo "--- head of body ---"
          head -c 400 /tmp/tt.html; echo ""
      - name: C. 头条图片 CDN 直取（带签名，无 Referer）
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          IMG="https://p11-sign.toutiaoimg.com/tos-cn-i-ezhpy3drpa/b69046fca4534ec8b58e407028381a0a~tplv-26tn0yjwph-cspd-v1:450:294.jpg?_iz=102390&from=search&lk3s=1a023e7a&x-expires=1800748800&x-signature=WMV4VpoJguiEQEI2ZIExGvgNipU%3D"
          curl -sL -o /tmp/one.jpg -w 'IMG_HTTP=%{http_code} TYPE=%{content_type} SIZE=%{size_download}\n' -A "$UA" --max-time 30 "$IMG"
      - name: D. 备用入口 toutiao 其它域名
        run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1"
          for U in "https://m.toutiao.com/search/?keyword=%E6%99%92%E7%A5%A8" \
                   "https://so.toutiao.com/search?keyword=%E6%99%92%E7%A5%A8" \
                   "https://www.toutiao.com/" ; do
            echo -n "$U  ->  "
            curl -sL -o /tmp/x.html -w 'HTTP=%{http_code} BYTES=%{size_download}\n' -A "$UA" -H 'Accept-Language: zh-CN,zh;q=0.9' --max-time 35 "$U"
            echo "        CARDS=$(grep -o 'data-druid-card-data-id' /tmp/x.html 2>/dev/null | wc -l)"
            sleep 3
          done
