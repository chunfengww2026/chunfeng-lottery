name: 验证方舟密钥（临时）

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 读取 Secrets 并只输出长度（不打印内容）
        env:
          ARK_API_KEY: ${{ secrets.ARK_API_KEY }}
          ARK_BASE_URL: ${{ secrets.ARK_BASE_URL }}
          ARK_MODEL: ${{ secrets.ARK_MODEL }}
        run: |
          node -e "
          const k = process.env.ARK_API_KEY || '';
          const b = process.env.ARK_BASE_URL || '';
          const m = process.env.ARK_MODEL || '';
          console.log('ARK_API_KEY  长度=' + k.length + '  前缀=' + (k.slice(0,3) || '(空)') + '  结尾=' + (k.slice(-2) || ''));
          console.log('ARK_BASE_URL 长度=' + b.length + '  值=' + b);
          console.log('ARK_MODEL    长度=' + m.length + '  值=' + m);
          console.log('全部读取成功: ' + ((k.length > 20 && b.length > 10 && m.length > 3) ? 'YES' : 'NO'));
          "
