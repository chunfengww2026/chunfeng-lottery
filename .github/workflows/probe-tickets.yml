name: probe-tickets

# ⚠️ 临时探测工作流（测完立刻删除，只留 daily-update.yml）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 第五轮（500晒票 / 牛票票API / 晒票吧 / 知乎API / 163搜索）
        run: |
          cat > probe5.mjs <<'PROBEEOF'
          const UA_PC = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const UA_M = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';
          const KW = ['晒票', '晒单', '实票', '实单', '票面', 'img_wrap', 'topic/'];
          const LIST = [
            ['500-shaipiao-sub', 'https://shaipiao.500.com/', UA_PC],
            ['500-shaidan', 'https://www.500.com/shaidan/', UA_PC],
            ['500-forum', 'https://www.500.com/forum/', UA_PC],
            ['500-http', 'http://www.500.com/', UA_PC],
            ['npp-api', 'https://api.niupiaopiao.com/', UA_PC],
            ['npp-www', 'https://www.niupiaopiao.com/', UA_PC],
            ['jc258-naked', 'https://jc258.com/', UA_PC],
            ['tieba-shaipiao', 'https://tieba.baidu.com/f?kw=%E6%99%92%E7%A5%A8', UA_PC],
            ['zhihu-api', 'https://www.zhihu.com/api/v4/search_v3?t=general&q=' + encodeURIComponent('竞彩晒票') + '&correction=1&offset=0&limit=20', UA_PC],
            ['163-search', 'https://www.163.com/search?keyword=' + encodeURIComponent('竞彩晒票'), UA_PC],
            ['17500bbs-http', 'http://bbs.17500.cn/', UA_PC],
            ['hupu-lottery2', 'https://bbs.hupu.com/topic-lottery', UA_PC],
            ['weibo-pic', 'https://photo.weibo.com/', UA_PC],
            ['ycxysp', 'https://m.yiqicai.com/xysp/', UA_M],
            ['ycxysp-ssq', 'https://m.yiqicai.com/xysp/ssqxysp', UA_M],
          ];
          for (const [name, url, ua] of LIST) {
            let status = 'ERR', bytes = 0, txt = '', err = '';
            try {
              const r = await fetch(url, { headers: { 'User-Agent': ua, Accept: 'text/html,application/json,*/*', 'Accept-Language': 'zh-CN,zh;q=0.9' }, redirect: 'follow', signal: AbortSignal.timeout(18000) });
              status = r.status;
              const b = Buffer.from(await r.arrayBuffer());
              bytes = b.length; txt = b.toString('utf8');
            } catch (e) { err = (e.cause && e.cause.code) || e.name; }
            const kws = KW.filter((k) => txt.includes(k));
            const items = (txt.match(/<div class="item">/g) || []).length;
            console.log(`P5 ${name.padEnd(18)} ${String(status).padEnd(4)} ${String(bytes).padStart(8)}B item=${String(items).padStart(3)} kw=${kws.join(',') || '-'} ${err ? 'ERR=' + err : ''}`);
            if (status === 200 && kws.length) console.log('    head: ' + txt.replace(/<script[\s\S]*?<\/script>/g, ' ').replace(/\s+/g, ' ').slice(0, 200));
            await new Promise((r2) => setTimeout(r2, 300));
          }
          console.log('DONE5');
          PROBEEOF
          node probe5.mjs
