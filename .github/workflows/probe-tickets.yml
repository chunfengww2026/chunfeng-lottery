name: probe-tickets

# ⚠️ 临时探测工作流（测完立刻删除，只留 daily-update.yml）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 第三轮（33633 变体域名 / 代理 / 图片可达 / 其它站）
        run: |
          cat > probe3.mjs <<'PROBEEOF'
          const UA_PC = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const UA_M = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';
          const KW = ['晒票', '实票', '晒单', '实单', '竞彩', 'img_wrap', 'topic/', 'item'];
          const LIST = [
            ['www-33633', 'https://www.33633.cn/', UA_PC],
            ['www-33633-jc', 'https://www.33633.cn/jingcai/', UA_PC],
            ['m-33633-home', 'https://m.33633.cn/', UA_M],
            ['api-33633', 'https://api.33633.cn/', UA_M],
            ['h5-33633', 'https://h5.33633.cn/', UA_M],
            ['p-33633', 'https://p.33633.cn/', UA_M],
            ['www-cpyc', 'https://www.cpyc.cn/', UA_PC],
            ['m-cpyc', 'https://m.cpyc.cn/', UA_M],
            ['cpyc-jc', 'https://www.cpyc.cn/jingcai/', UA_PC],
            ['jina-33633', 'https://r.jina.ai/https://m.33633.cn/jingcai/', UA_PC],
            ['allorigins-33633', 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://m.33633.cn/jingcai/'), UA_PC],
            ['17500-exp', 'https://www.17500.cn/', UA_PC],
            ['9188', 'https://www.9188.com/', UA_PC],
            ['aibo', 'https://www.aibo.com/', UA_PC],
            ['163-caipiao', 'https://caipiao.163.com/', UA_PC],
            ['okooo-danchang', 'https://www.okooo.com/danchang/', UA_PC],
            ['zhcw-retry', 'https://www.zhcw.com/', UA_PC],
          ];

          for (const [name, url, ua] of LIST) {
            let status = 'ERR', bytes = 0, txt = '', err = '';
            try {
              const r = await fetch(url, {
                headers: { 'User-Agent': ua, Accept: 'text/html,application/json,*/*', 'Accept-Language': 'zh-CN,zh;q=0.9' },
                redirect: 'follow',
                signal: AbortSignal.timeout(20000),
              });
              status = r.status;
              const b = Buffer.from(await r.arrayBuffer());
              bytes = b.length;
              txt = b.toString('utf8');
            } catch (e) { err = (e.cause && e.cause.code) || e.name; }
            const kws = KW.filter((k) => txt.includes(k));
            console.log(`P3 ${name.padEnd(16)} ${String(status).padEnd(4)} ${String(bytes).padStart(8)}B kw=${kws.join(',') || '-'} ${err ? 'ERR=' + err : ''}`);
            if (status === 200 && /晒票|img_wrap/.test(txt)) console.log('    head: ' + txt.replace(/\s+/g, ' ').slice(0, 220));
            await new Promise((r2) => setTimeout(r2, 300));
          }

          console.log('\n---- 33633 票面图可达性（云端）----');
          const IMGS = [
            'https://imgbcw.cpyc.cn/customfiles/files/web/2023-06-01/202306012210331664.jpg',
            'https://img33633.cpyc.cn/CustomFiles/Files/Web/20261018/202610181155188482.webp',
            'https://img33633.cpyc.cn/CustomFiles/Files/Web/20261018/202610181155295207.webp',
          ];
          for (const u of IMGS) {
            for (const ref of ['', 'https://m.33633.cn/']) {
              try {
                const r = await fetch(u, { headers: { 'User-Agent': UA_M, ...(ref ? { Referer: ref } : {}) }, signal: AbortSignal.timeout(15000) });
                const b = Buffer.from(await r.arrayBuffer());
                console.log(`IMG3 ${r.status} ${String(b.length).padStart(7)}B ${(r.headers.get('content-type') || '').slice(0, 16)} ref=${ref ? 'yes' : 'no '} ${u.slice(0, 80)}`);
              } catch (e) { console.log(`IMG3 ERR ${(e.cause && e.cause.code) || e.name} ref=${ref ? 'yes' : 'no '} ${u.slice(0, 80)}`); }
            }
          }
          console.log('DONE3');
          PROBEEOF
          node probe3.mjs
