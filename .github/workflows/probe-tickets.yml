name: probe-tickets

# ⚠️ 临时探测工作流（测完立刻删除，只留 daily-update.yml）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 第四轮（搜狗图片 / Wayback / 代理 / 图片抽样 base64）
        run: |
          cat > probe4.mjs <<'PROBEEOF'
          const UA_PC = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const unesc = (s) => String(s || '').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"');
          const strip = (s) => unesc(String(s || '').replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
          let budget = 5;
          async function peek(u, tag) {
            if (budget <= 0) return;
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA_PC }, signal: AbortSignal.timeout(15000) });
              const b = Buffer.from(await r.arrayBuffer());
              console.log(`PEEK ${tag} ${r.status} ${b.length}B ${(r.headers.get('content-type') || '')} ${u.slice(0, 90)}`);
              if (r.ok && b.length > 1500 && b.length < 120000) {
                budget--;
                console.log(`B64START ${tag}`);
                console.log(b.toString('base64'));
                console.log(`B64END ${tag}`);
              }
            } catch (e) { console.log(`PEEK ${tag} ERR ${(e.cause && e.cause.code) || e.name}`); }
          }

          /* (a) 搜狗图片 — 逐条看标题/图片 */
          for (const q of ['竞彩晒票', '竞彩实单']) {
            const u = 'https://pic.sogou.com/pics?query=' + encodeURIComponent(q) + '&mode=1&start=0&reqType=ajax&reqFrom=result&tn=0';
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA_PC, Referer: 'https://pic.sogou.com/' }, signal: AbortSignal.timeout(20000) });
              const t = await r.text();
              const parts = t.split('"pic_url"').slice(1);
              const rows = [];
              for (const p of parts) {
                const pic = (/^:"([^"]+)"/.exec(p) || [])[1] || '';
                const tt = /"title":"([^"]*)"/.exec(p);
                const page = /"page_url":"([^"]*)"/.exec(p);
                if (pic) rows.push({ pic, title: unesc(tt ? tt[1] : ''), page: page ? unesc(page[1]) : '' });
              }
              const rel = rows.filter((x) => /晒|实单|实票|竞彩/.test(x.title));
              console.log(`\nSGIMG ${q} → ${r.status} ${Buffer.byteLength(t)}B 总=${rows.length} 相关=${rel.length}`);
              rel.slice(0, 6).forEach((x, i) => console.log(`  [${i}] ${x.title.slice(0, 40)} | ${x.pic.slice(0, 85)}`));
              for (const x of rel.slice(0, 3)) await peek(x.pic, 'sg-' + q + '-' + Math.random().toString(36).slice(2, 4));
            } catch (e) { console.log(`\nSGIMG ${q} ERR ${(e.cause && e.cause.code) || e.name}`); }
            await new Promise((r2) => setTimeout(r2, 1200));
          }

          /* (b) Wayback：33633 有没有近期快照 */
          for (const tgt of ['m.33633.cn/jingcai/']) {
            const u = 'https://web.archive.org/cdx/search/cdx?url=' + tgt + '&output=json&limit=-8&fl=timestamp,statuscode,length';
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA_PC }, signal: AbortSignal.timeout(25000) });
              const t = await r.text();
              console.log(`\nWAYBACK ${tgt} → ${r.status} ${Buffer.byteLength(t)}B`);
              console.log('  ' + t.replace(/\s+/g, ' ').slice(0, 500));
            } catch (e) { console.log(`\nWAYBACK ERR ${(e.cause && e.cause.code) || e.name}`); }
          }

          /* (c) 代理能不能取到 33633（WAF 是否只挡某些 IP） */
          const PROXY = [
            ['jina', 'https://r.jina.ai/https://m.33633.cn/jingcai/'],
            ['codetabs', 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent('https://m.33633.cn/jingcai/')],
            ['corslol', 'https://api.cors.lol/?url=' + encodeURIComponent('https://m.33633.cn/jingcai/')],
            ['allorigins', 'https://api.allorigins.win/get?url=' + encodeURIComponent('https://m.33633.cn/jingcai/')],
          ];
          for (const [n, u] of PROXY) {
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA_PC }, signal: AbortSignal.timeout(25000) });
              const t = await r.text();
              console.log(`\nPROXY ${n} → ${r.status} ${Buffer.byteLength(t)}B 有item=${t.includes('img_wrap')} 有晒票=${t.includes('晒票')}`);
              console.log('  ' + t.replace(/\s+/g, ' ').slice(0, 200));
            } catch (e) { console.log(`\nPROXY ${n} ERR ${(e.cause && e.cause.code) || e.name}`); }
          }
          console.log('\nDONE4');
          PROBEEOF
          node probe4.mjs
