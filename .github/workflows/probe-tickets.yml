name: probe-tickets

# ⚠️ 临时探测工作流（测完立刻删除，只留 daily-update.yml）
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 第二轮探测（Telegram / B站 / 搜狗微信 + 图片 base64 抽样）
        run: |
          cat > probe2.mjs <<'PROBEEOF'
          const UA_PC = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36';
          const UA_M = 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1';
          const unesc = (s) => String(s || '').replace(/&amp;/g, '&').replace(/&#39;/g, "'").replace(/&quot;/g, '"').replace(/&lt;/g, '<').replace(/&gt;/g, '>');
          const strip = (s) => unesc(String(s || '').replace(/<[^>]+>/g, ' ')).replace(/\s+/g, ' ').trim();
          let b64budget = 3;

          async function b64(u, tag) {
            if (b64budget <= 0) return;
            try {
              const r = await fetch(u, { headers: { 'User-Agent': UA_PC }, signal: AbortSignal.timeout(15000) });
              const b = Buffer.from(await r.arrayBuffer());
              console.log(`IMGMETA ${tag} ${r.status} ${b.length}B ${r.headers.get('content-type') || ''} ${u.slice(0, 90)}`);
              if (r.ok && b.length > 2000 && b.length < 120000) {
                b64budget--;
                console.log(`B64START ${tag}`);
                console.log(b.toString('base64'));
                console.log(`B64END ${tag}`);
              }
            } catch (e) { console.log(`IMGMETA ${tag} ERR ${(e.cause && e.cause.code) || e.name}`); }
          }

          /* ---------- ① Telegram 公共频道 ---------- */
          const CH = ['jingcaituijian', 'tiyuquan', 'meitituijian2025', 'tiyutuidan08', 'tytuidan1', 'zucaituijian'];
          for (const ch of CH) {
            try {
              const r = await fetch('https://t.me/s/' + ch, { headers: { 'User-Agent': UA_PC }, signal: AbortSignal.timeout(20000) });
              const h = await r.text();
              const posts = h.split('<div class="tgme_widget_message_wrap').slice(1);
              const rows = [];
              for (const p of posts) {
                const dt = (/<time datetime="([^"]+)"/.exec(p) || [])[1] || '';
                const text = strip((/<div class="tgme_widget_message_text[^"]*"[^>]*>([\s\S]*?)<\/div>/.exec(p) || [, ''])[1]).slice(0, 60);
                const photos = [...p.matchAll(/background-image:url\('([^']+)'\)/g)].map((m) => m[1]);
                if (!photos.length) continue;
                rows.push({ dt, text, photo: photos[0] });
              }
              console.log(`\nTG ${ch} → ${r.status} ${Buffer.byteLength(h)}B 有图帖=${rows.length} 晒票词=${h.includes('晒票')} 实单词=${h.includes('实单')}`);
              rows.slice(0, 4).forEach((x, i) => console.log(`  [${i}] ${x.dt.slice(0, 16)} | ${x.text} | ${x.photo.slice(0, 80)}`));
              if (rows.length) await b64(rows[0].photo, 'tg-' + ch);
            } catch (e) { console.log(`\nTG ${ch} → ERR ${(e.cause && e.cause.code) || e.name}`); }
          }

          /* ---------- ② B 站搜索 API ---------- */
          try {
            const u = 'https://api.bilibili.com/x/web-interface/wbi/search/type?search_type=video&keyword=' + encodeURIComponent('竞彩晒票') + '&page=1';
            const r = await fetch(u, { headers: { 'User-Agent': UA_PC, Referer: 'https://search.bilibili.com/' }, signal: AbortSignal.timeout(20000) });
            const t = await r.text();
            console.log(`\nBILI api → ${r.status} ${Buffer.byteLength(t)}B`);
            let j = null; try { j = JSON.parse(t); } catch {}
            const list = (j && j.data && j.data.result) || [];
            console.log('  条数', list.length, 'code', j && j.code);
            list.slice(0, 4).forEach((x, i) => console.log(`  [${i}] ${strip(x.title).slice(0, 40)} | pub=${x.pubdate} | pic=${(x.pic || '').slice(0, 90)}`));
            if (list[0] && list[0].pic) await b64(list[0].pic.startsWith('//') ? 'https:' + list[0].pic : list[0].pic, 'bili');
          } catch (e) { console.log('BILI ERR', (e.cause && e.cause.code) || e.name); }

          /* ---------- ③ 搜狗微信（多关键词汇总） ---------- */
          const jar = new Map();
          const absorb = (res) => { const sc = res.headers.getSetCookie ? res.headers.getSetCookie() : []; for (const c of sc) { const p = c.split(';')[0]; const i = p.indexOf('='); if (i > 0) jar.set(p.slice(0, i), p.slice(i + 1)); } };
          const QS = ['竞彩晒票', '竞彩实单晒票', '竞彩足球实单', '竞彩实单'];
          let all = [];
          for (const q of QS) {
            const fu = 'https://weixin.sogou.com/weixin?type=2&query=' + encodeURIComponent(q) + '&ie=utf8';
            try {
              const r = await fetch(fu, { headers: { 'User-Agent': UA_PC, 'Accept-Language': 'zh-CN,zh;q=0.9' }, signal: AbortSignal.timeout(25000) });
              absorb(r);
              const h = await r.text();
              const parts = h.split(/<li id="sogou_vr_11002601_box_/).slice(1);
              const rows = parts.map((raw) => {
                const h3 = /<h3>([\s\S]*?)<\/h3>/.exec(raw);
                const tm = (/timeConvert\('(\d+)'\)/.exec(raw) || [])[1] || '';
                const thumbRaw = unesc((/<img[^>]*src="([^"]+)"/.exec(raw) || [])[1] || '');
                let qpic = ''; try { const m = /url=([^&]+)/.exec(thumbRaw); if (m) qpic = decodeURIComponent(m[1]).replace(/&amp;/g, '&'); } catch {}
                return {
                  title: h3 ? strip(h3[1]).slice(0, 44) : '',
                  dt: tm ? new Date(Number(tm) * 1000).toISOString().slice(0, 16) : '',
                  qpic,
                  thumb: thumbRaw.startsWith('//') ? 'https:' + thumbRaw : thumbRaw,
                };
              }).filter((x) => x.qpic);
              console.log(`\nWX ${q} → ${r.status} ${Buffer.byteLength(h)}B 有图有效=${rows.length}`);
              rows.slice(0, 3).forEach((x, i) => console.log(`  [${i}] ${x.dt} | ${x.title} | ${x.qpic.slice(0, 85)}`));
              all = all.concat(rows);
            } catch (e) { console.log(`\nWX ${q} ERR ${(e.cause && e.cause.code) || e.name}`); }
            await new Promise((r2) => setTimeout(r2, 1200));
          }
          console.log('\nWX 合计', all.length, '条；去重后', new Set(all.map((x) => x.qpic)).size);
          const uniq = [...new Map(all.map((x) => [x.qpic, x])).values()];
          for (const x of uniq.slice(0, 3)) {
            await b64(x.qpic, 'qpic');
            await b64(x.thumb, 'sogoucdn');
          }
          console.log('\nDONE');
          PROBEEOF
          node probe2.mjs
