name: tmp-jc500-test
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: env
        run: |
          node -v
          node -e "console.log('TZ=', Intl.DateTimeFormat().resolvedOptions().timeZone, 'now=', new Date().toISOString()); try { console.log('gbk-ok=', new TextDecoder('gbk').decode(Buffer.from([0xD6,0xDC,0xC8,0xFD]))); } catch (e) { console.log('gbk-FAIL', e.message); }"
      - name: 1-direct-500
        run: |
          node cloud/scripts/build-jc-count.mjs; echo "EXIT=$?"
          echo '--- jc-official.js ---'; cat cloud/scripts/jc-official.js
      - name: 2-force-sporttery-fail
        run: |
          JC_COUNT_API='http://127.0.0.1:1/x' node cloud/scripts/build-jc-count.mjs; echo "EXIT=$?"
          echo '--- codes ---'; grep -o '"code": "[^"]*"' cloud/scripts/jc-official.js | tr '\n' ' '; echo
      - name: 3-both-fail-keep-old
        run: |
          H1=$(md5sum cloud/scripts/jc-official.js | cut -d' ' -f1)
          JC_COUNT_API='http://127.0.0.1:1/x' JC_500_BASE='http://127.0.0.1:1/x' node cloud/scripts/build-jc-count.mjs; echo "EXIT=$?"
          H2=$(md5sum cloud/scripts/jc-official.js | cut -d' ' -f1)
          if [ "$H1" = "$H2" ]; then echo "KEPT-OLD=OK"; else echo "KEPT-OLD=FAIL"; fi
