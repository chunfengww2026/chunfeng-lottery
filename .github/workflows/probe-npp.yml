# ============================================================
#  probe-npp.yml —— 【临时】云端可达性探测
#
#  第 1 轮：测牛票票 33633.cn → 结论 405（阿里云 WAF 挡境外）❌
#  第 2 轮（现在）：测【一起彩】的真实路径 —— 它是云端晒票的主源，
#                   必须确认云端能访问，否则云端晒票 8 彩种会全空。
#
#  ⚠️ 这个工作流【只跑 curl】，不写任何文件、不碰站点、不碰构建逻辑。
#     测完立刻删除。
# ============================================================
name: probe-npp

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe-npp.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 测一起彩 8 彩种路径 + 基线
        run: |
          echo "=========== 云端 IP ==========="
          curl -s --max-time 15 https://api.ipify.org || echo "(取 IP 失败)"
          echo ""

          echo "=========== 1 一起彩：各候选路径 ==========="
          for U in \
            "https://m.yiqicai.com/" \
            "https://m.yiqicai.com/xysp/ssq.html" \
            "https://m.yiqicai.com/xysp/ssq/" \
            "https://m.yiqicai.com/xysp/ssq" \
            "https://m.yiqicai.com/xysp/" \
            "https://www.yiqicai.com/" \
            ; do
            printf "  %-46s " "$U"
            curl -sL -o /dev/null -w "HTTP=%{http_code} final=%{url_effective} size=%{size_download}\n" \
              --max-time 25 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X) AppleWebKit/605.1.15" "$U" || echo "失败"
          done

          echo ""
          echo "=========== 2 一起彩：真实路径下有没有晒票图 ==========="
          for U in "https://m.yiqicai.com/xysp/ssq.html" "https://m.yiqicai.com/xysp/ssq/" ; do
            echo "--- $U ---"
            curl -sL -o /tmp/yc.html -w "  HTTP=%{http_code} size=%{size_download}\n" \
              --max-time 25 -A "Mozilla/5.0 (iPhone; CPU iPhone OS 16_0 like Mac OS X)" "$U" || echo "  失败"
            if [ -f /tmp/yc.html ]; then
              SZ=$(wc -c < /tmp/yc.html)
              echo "  页面字节: $SZ"
              if [ "$SZ" -gt 5000 ]; then
                echo "  --- 页面里前 6 个图片链接 ---"
                grep -oE 'https?://[^" ]+\.(jpe?g|png|webp)' /tmp/yc.html | head -6 || echo "  (没匹配到图片)"
              else
                echo "  (页面太小，可能是错误页) 前 300 字节:"
                head -c 300 /tmp/yc.html
                echo ""
              fi
            fi
            echo ""
          done

          echo "=========== 3 基线对照（已知云端可用） ==========="
          for U in "https://so.toutiao.com/search/?dvpf=pc&keyword=%E6%99%92%E7%A5%A8" "https://www.baidu.com" ; do
            printf "  %-70s " "$(echo $U | cut -c1-68)"
            curl -sL -o /dev/null -w "HTTP=%{http_code} size=%{size_download}\n" --max-time 25 "$U" || echo "失败"
          done

          echo ""
          echo "=========== 判读 ==========="
          echo "· 一起彩有 200 且页面 >5000 字节 -> 云端正常"
          echo "· 一起彩跳 error.html 或 403/405 -> 云端被挡，晒票会缺 8 彩种"
          echo "· 头条 so.toutiao.com 200 -> 头条那条路正常"
