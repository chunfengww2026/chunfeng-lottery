# ============================================================
#  probe-sched-tmp.yml —— 临时探测（测完就删）
#  只做一件事：在 GitHub Actions（美国 IP）上用纯 HTTP 跑
#  probe-schedules.mjs，看哪些赛程源在云端能抓到
#  未开赛 / 进行中 / 已完场。
#  ⚠️ 和 daily-update.yml 完全隔离：不引用、不修改、不影响它。
#  ⚠️ 只 workflow_dispatch（手动触发），没有 cron，不会自己跑。
# ============================================================
name: probe-sched-tmp

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: probe-sched-tmp
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 取出仓库代码
        uses: actions/checkout@v4

      - name: 装 Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 探测候选赛程源（纯 HTTP，不用浏览器）
        run: node probe-schedules.mjs --json probe-out.json

      - name: 再打一遍 JSON（方便从日志里读）
        if: always()
        run: |
          if [ -f probe-out.json ]; then
            node -e "const j=require('./probe-out.json');for(const r of j.results)console.log([r.name,r.status,r.bytes,r.rows,r.up,r.live,r.fin,r.verdict].join(' | '))"
          else
            echo "probe-out.json 没生成"
          fi

      - name: 存一份结果文件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-sched-out
          path: probe-out.json
          if-no-files-found: warn
          retention-days: 2
