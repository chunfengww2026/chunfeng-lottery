name: _probe-frog-pool
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 1 list data files
        run: |
          echo "=== cloud/scripts/core-* ==="
          ls -l cloud/scripts/core-* 2>/dev/null || echo "NO core-* FILE"
      - name: 2 require core-pool and print pool length
        run: |
          cd cloud/scripts
          node -e "try{const cp=require('./core-pool.js');const a=cp.corePoolFor('ssq'),b=cp.corePoolFor('dlt');const len=(x)=>!(x&&x.pool20)?String(x===null?'null':typeof x):String(x.pool20.length);console.log('ssq pool length = '+len(a)+' issue='+(a&&a.issue));console.log('dlt pool length = '+len(b)+' issue='+(b&&b.issue));}catch(e){console.log('REQUIRE FAILED: '+e.message);}"
      - name: 3 build the page and read the frog panel
        run: |
          cd cloud/scripts
          node export-static.mjs > /tmp/build.log 2>&1 || echo "EXPORT-STATIC EXIT NOT 0"
          tail -6 /tmp/build.log
          node -e "const fs=require('fs');const p='只读分享版.html';if(!fs.existsSync(p)){console.log('NO PAGE');process.exit(0)}const t=fs.readFileSync(p,'utf8');for(const k of ['数据整理中','稍后自动出现','暂无资料','核心算法 20 码'])console.log(k+' = '+(t.split(k).length-1));const i=t.indexOf('frogHome');const seg=t.slice(i,i+1400).replace(/<[^>]+>/g,'|').replace(/\|+/g,'|');console.log('PANEL: '+seg.slice(0,430));const m=seg.match(/第 \\d+ 期/g);console.log('panel issues: '+(m?m.join(' , '):'none'));"
