<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- 【禁止缓存】手机浏览器（尤其微信内置）会缓存很久，
     加上这些标记后每次都会取最新的，避免「App 更新了网页还是旧的」 -->
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>春风十里送大奖 · 推荐图</title>
<style>
/* ============================================================
   styles.css —— 彩虹多多 全局样式
   ============================================================ */

:root {
  --bg:        #0f1115;
  --bg-soft:   #161a21;
  --card:      #1a1f28;
  --card-hover:#212734;
  --line:      #262d3a;
  --text:      #e8eaed;
  --muted:     #8b93a1;
  --dim:       #5a6272;
  --red:       #e5484d;
  --red-2:     #c93236;
  --blue:      #2f6feb;
  --blue-2:    #2158c4;
  --green:     #7ee787;
  --gold:      #f0b429;
  --radius:    12px;
  /* 全局字号缩放：整个界面统一调小 */
  --fs:        0.92;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  /* 应用化：禁止选中文字（输入框单独放开） */
  user-select: none;
  opacity: 0;
  transition: opacity 0.25s ease;
  /* 左导航 + 右内容 并排；窄屏时由媒体查询改成纵向 */
  display: flex;
  align-items: stretch;
  /* 整体字号基准，调小界面文字（不用 zoom，避免干扰网格计算） */
  font-size: 13.5px;
}
body.ready { opacity: 1; }

input, textarea { user-select: text; }

::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: var(--bg); }
::-webkit-scrollbar-thumb { background: #2d3546; border-radius: 5px; }
::-webkit-scrollbar-thumb:hover { background: #3a4459; }

/* ==================== 整体布局：左导航 + 右内容 ==================== */
.layout {
  display: flex;
  min-height: 100vh;
  align-items: stretch;
}

/* ==================== 左侧固定导航栏 ==================== */
.sidebar {
  width: 216px;
  flex-shrink: 0;
  background: #0b0d11;
  border-right: 1px solid var(--line);
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* 侧边栏顶部的品牌区 */
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 20px 18px 18px;
  border-bottom: 1px solid var(--line);
}

.brand .logo {
  width: 34px; height: 34px;
  border-radius: 50%;
  flex-shrink: 0;
  background:
    radial-gradient(circle at 35% 32%, #fff 0%, #fff 22%, transparent 23%),
    conic-gradient(from 200deg, #e5484d, #f0b429, #47e0a0, #4facfe, #a78bfa, #e5484d);
  box-shadow: 0 0 0 2px rgba(255,255,255,0.08);
}

.brand .name {
  font-size: 17px;
  font-weight: 700;
  letter-spacing: 2px;
  background: linear-gradient(90deg, #ff5f6d, #ffc371, #47e0a0, #4facfe, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}

/* 菜单 */
.nav { padding: 12px 10px 20px; }

.nav-group {
  font-size: 11px;
  color: var(--dim);
  padding: 12px 10px 7px;
  letter-spacing: 1px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  margin-bottom: 2px;
  border-radius: 9px;
  font-size: 14px;
  color: #9aa3b2;
  cursor: pointer;
  text-decoration: none;
  transition: background 0.12s, color 0.12s;
  position: relative;
}
.nav-item:hover {
  background: #171c25;
  color: var(--text);
}
.nav-item.on {
  background: linear-gradient(90deg, rgba(74,130,245,0.22), rgba(74,130,245,0.06));
  color: #fff;
  font-weight: 600;
}
.nav-item.on::before {
  content: '';
  position: absolute;
  left: 0; top: 50%;
  transform: translateY(-50%);
  width: 3px; height: 17px;
  border-radius: 0 3px 3px 0;
  background: var(--blue);
}
.nav-item .ico {
  width: 18px;
  text-align: center;
  font-size: 13px;
  flex-shrink: 0;
}

/* ==================== 右侧内容区 ==================== */
.content {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 15px 28px;
  border-bottom: 1px solid var(--line);
  background: rgba(22, 26, 33, 0.9);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(8px);
}

.topbar h1 {
  font-size: 17px;
  font-weight: 600;
  color: var(--text);
}

.topbar .spacer { flex: 1; }

/* 返回按钮 */
.back-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 16px;
  font-size: 14px;
  font-family: inherit;
  color: var(--text);
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}
.back-btn:hover { background: var(--card-hover); border-color: #38425a; }

/* ==================== 首页 ==================== */
/* 注意：这里不能用 margin: 0 auto。
   在 flex 容器里 auto 外边距会让元素收缩到内容宽度，导致卡片排不成多列。 */
.page {
  padding: 24px 26px 50px;
  width: 100%;
  max-width: 1180px;
}

.hero {
  text-align: center;
  padding: 26px 0 34px;
}
.hero .big {
  font-size: 34px;
  font-weight: 700;
  letter-spacing: 3px;
  background: linear-gradient(90deg, #ff5f6d, #ffc371, #47e0a0, #4facfe, #a78bfa);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.hero .sub { margin-top: 10px; font-size: 14px; color: var(--muted); }

.group-title {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 30px 0 16px;
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
}
.group-title::before {
  content: '';
  width: 4px; height: 17px;
  border-radius: 2px;
  background: var(--red);
}
.group-title.blue::before { background: var(--blue); }
.group-title.gold::before { background: var(--gold); }
.group-title .count { font-size: 12px; color: var(--dim); font-weight: 400; }

.cards {
  display: grid;
  /* 固定两列，形成田字形排列 */
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
}

.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 15px 16px;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s, border-color 0.15s;
  position: relative;
  overflow: hidden;
}
.card:hover {
  background: var(--card-hover);
  border-color: #3a4560;
  transform: translateY(-2px);
}
.card:active { transform: translateY(0); }

.card .name {
  font-size: 17px;
  font-weight: 600;
  margin-bottom: 6px;
}
.card .desc {
  font-size: 12px;
  color: var(--muted);
  line-height: 1.6;
}
.card .meta {
  display: flex;
  gap: 12px;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--dim);
}
.card .meta b { color: var(--muted); font-weight: 500; }

/* 卡片上的球示例 */
.card .balls { display: flex; gap: 5px; margin-bottom: 14px; flex-wrap: wrap; }

/* ==================== 卡片：开奖号码区（上半，平铺） ==================== */
.card-draw { min-height: 50px; }

/* 第一行：彩种名 + 期号 */
.draw-head {
  display: flex;
  align-items: baseline;
  flex-wrap: wrap;
  gap: 3px;
  font-size: 12px;
  color: #5a6272;
  margin-bottom: 10px;
}
.draw-head b { color: #e8eaed; font-weight: 600; }
.draw-head.empty { color: #4a5261; }
.draw-head .draw-date { color: #4a5261; margin-left: 2px; }

/* 开奖号码：横向平铺，自动换行 */
.draw-balls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.draw-src {
  margin-top: 8px;
  font-size: 11px;
  color: #454d5c;
}

.draw-none {
  font-size: 13px;
  color: #5a6272;
  line-height: 1.7;
}

/* ==================== 卡片：信息区（下半） ==================== */
.card-body { position: relative; }

.card-title-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 7px;
}
.card-title-row .name {
  font-size: 18px;
  font-weight: 600;
  margin: 0;
}

/* 录入开奖号码按钮（铅笔图标，浮在右上角） */
.edit-btn {
  margin-left: auto;
  padding: 3px 9px;
  font-size: 13px;
  line-height: 1.3;
  font-family: inherit;
  color: #6b7488;
  background: transparent;
  border: 1px solid #2d3546;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.13s;
  white-space: nowrap;
}
.edit-btn:hover {
  color: #fff;
  background: #2f6feb;
  border-color: #2f6feb;
}

/* ==================== 彩票球 ==================== */
.ball {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  font-weight: 700;
  font-family: "Segoe UI", Arial, sans-serif;
  color: #fff;
  flex-shrink: 0;
  box-shadow: inset 0 -2px 4px rgba(0,0,0,0.25), 0 1px 3px rgba(0,0,0,0.3);
}

.ball.red  { background: linear-gradient(180deg, #f0575c, #cc2f34); }
.ball.blue { background: linear-gradient(180deg, #4a83f5, #2158c4); }
.ball.gold { background: linear-gradient(180deg, #f5c451, #d99a12); color: #4a3300; }
.ball.gray { background: linear-gradient(180deg, #6b7688, #4a5364); }

/* 尺寸 */
.ball.s-sm { width: 26px; height: 26px; font-size: 12px; }
.ball.s-md { width: 38px; height: 38px; font-size: 16px; }
.ball.s-lg { width: 46px; height: 46px; font-size: 19px; }

/* ==================== 彩种页面 ==================== */
.game-head {
  display: flex;
  align-items: flex-start;
  gap: 22px;
  padding: 24px 0 8px;
  flex-wrap: wrap;
}
.game-head .info { flex: 1; min-width: 240px; }
.game-head h2 { font-size: 26px; font-weight: 700; margin-bottom: 9px; }
.game-head .tags { display: flex; gap: 8px; flex-wrap: wrap; }
.tag {
  font-size: 12px;
  padding: 4px 11px;
  border-radius: 20px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  color: var(--muted);
}
.tag b { color: var(--text); font-weight: 500; }

.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 18px;
}
.panel h3 {
  font-size: 15px;
  font-weight: 600;
  margin-bottom: 14px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.panel h3 .hint { font-size: 12px; color: var(--dim); font-weight: 400; }

/* 按钮行 */
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

.btn {
  padding: 10px 22px;
  font-size: 14px;
  font-family: inherit;
  color: #fff;
  background: linear-gradient(180deg, #4a82f5, #2860d8);
  border: none;
  border-radius: 10px;
  cursor: pointer;
  transition: filter 0.15s, transform 0.1s;
}
.btn:hover  { filter: brightness(1.12); }
.btn:active { transform: scale(0.98); }
.btn.ghost {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  color: var(--text);
}
.btn.ghost:hover { background: var(--card-hover); }

/* 号码选择网格 */
.pick-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(46px, 1fr));
  gap: 9px;
  margin-top: 4px;
}
.pick {
  aspect-ratio: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.12s;
}
.pick:hover { border-color: #4a5670; color: var(--text); }
.pick.on {
  background: linear-gradient(180deg, #f0575c, #cc2f34);
  border-color: transparent;
  color: #fff;
}
.pick.on.blue {
  background: linear-gradient(180deg, #4a83f5, #2158c4);
}

/* 号码池分组 */
.area-block + .area-block { margin-top: 18px; }
.area-label {
  font-size: 13px;
  color: var(--muted);
  margin-bottom: 9px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.area-label .dot {
  width: 9px; height: 9px; border-radius: 50%;
}
.area-label .dot.red  { background: var(--red); }
.area-label .dot.blue { background: var(--blue); }

/* 投注列表 */
.ticket {
  display: flex;
  align-items: center;
  gap: 6px;
  padding: 11px 14px;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 11px;
  margin-bottom: 9px;
  flex-wrap: wrap;
}
.ticket .idx {
  font-size: 12px;
  color: var(--dim);
  width: 34px;
  flex-shrink: 0;
}
.ticket .sep { color: var(--dim); margin: 0 4px; font-size: 13px; }

.empty {
  padding: 30px;
  text-align: center;
  color: var(--dim);
  font-size: 14px;
}

/* 规则表 */
table.rule {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
table.rule th, table.rule td {
  text-align: left;
  padding: 10px 12px;
  border-bottom: 1px solid var(--line);
}
table.rule th {
  color: var(--muted);
  font-weight: 500;
  font-size: 12px;
}
table.rule tr:last-child td { border-bottom: none; }
table.rule td.money { color: var(--green); font-weight: 600; white-space: nowrap; }

/* 选玩法（快乐8） */
.mode-tabs { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.mode-tab {
  padding: 8px 16px;
  font-size: 13px;
  font-family: inherit;
  color: var(--muted);
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 9px;
  cursor: pointer;
  transition: all 0.12s;
}
.mode-tab:hover { color: var(--text); }
.mode-tab.on {
  background: linear-gradient(180deg, #4a82f5, #2860d8);
  border-color: transparent;
  color: #fff;
  font-weight: 600;
}

/* 提示条 */
.notice {
  display: flex;
  gap: 10px;
  padding: 13px 16px;
  background: rgba(240, 180, 41, 0.08);
  border: 1px solid rgba(240, 180, 41, 0.25);
  border-radius: 11px;
  font-size: 13px;
  color: #d9c08a;
  line-height: 1.7;
  margin-top: 18px;
}
.notice .ico { flex-shrink: 0; }

/* 底部 */
.foot {
  text-align: center;
  padding: 30px 20px 40px;
  font-size: 12px;
  color: var(--dim);
  line-height: 2;
}

/* ==================== 资料库 ==================== */

/* 彩种选择标签 */
.mat-games {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.mat-chip {
  padding: 6px 14px;
  font-size: 13px;
  font-family: inherit;
  color: #9aa3b2;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 20px;
  cursor: pointer;
  transition: all 0.12s;
}
.mat-chip:hover { color: #fff; border-color: #3a4560; }
.mat-chip.on {
  color: #fff;
  background: linear-gradient(180deg, #4a82f5, #2860d8);
  border-color: transparent;
  font-weight: 600;
}

/* 输入框（聊天框样式） */
.mat-input {
  width: 100%;
  padding: 13px 15px;
  font-size: 14px;
  font-family: inherit;
  line-height: 1.75;
  color: var(--text);
  background: #0f1115;
  border: 1px solid var(--line);
  border-radius: 11px;
  outline: none;
  resize: vertical;
  min-height: 120px;
  box-sizing: border-box;
  user-select: text;
}
.mat-input:focus { border-color: #3a5fc0; }
.mat-input::placeholder { color: #4a5261; line-height: 1.8; }

/* 资料列表 */
.mat-list { display: flex; flex-direction: column; gap: 10px; }

.mat-item {
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 11px;
  padding: 13px 15px;
}

.mat-head {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 9px;
  flex-wrap: wrap;
}

.mat-tags { display: flex; gap: 6px; flex-wrap: wrap; }

.mat-tag {
  font-size: 11px;
  padding: 3px 9px;
  border-radius: 20px;
  background: rgba(74, 130, 245, 0.15);
  color: #8ab0f5;
  border: 1px solid rgba(74, 130, 245, 0.3);
}
.mat-tag.all {
  background: rgba(126, 231, 135, 0.12);
  color: #7ee787;
  border-color: rgba(126, 231, 135, 0.3);
}

.mat-time {
  font-size: 11px;
  color: var(--dim);
  margin-left: auto;
}

.mat-del {
  font-size: 11px;
  padding: 3px 9px;
  font-family: inherit;
  color: #6b7488;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 6px;
  cursor: pointer;
  transition: all 0.12s;
}
.mat-del:hover { color: #fff; background: #c93236; border-color: #c93236; }

.mat-body {
  font-size: 13.5px;
  line-height: 1.85;
  color: #c8cfda;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
}

/* ==================== 彩种板块模板 ==================== */

/* 今日推荐卡片 */
.reco-card {
  background: linear-gradient(135deg, #1c2331, #171d29);
  border: 1px solid #2b3550;
  border-radius: var(--radius);
  padding: 22px 24px;
  margin-top: 16px;
  min-height: 110px;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.reco-title {
  font-size: 21px;
  font-weight: 700;
  color: #e5484d;
  letter-spacing: 1px;
  margin-bottom: 10px;
}
.reco-title .t { color: #f0575c; }

.reco-content {
  font-size: 14px;
  line-height: 1.9;
  color: #c8cfda;
  white-space: pre-wrap;
  word-break: break-word;
  user-select: text;
}
.reco-empty {
  font-size: 13px;
  color: #4a5261;
}

/* 出图区 */
.image-slot {
  border: 1px dashed #33405a;
  border-radius: var(--radius);
  min-height: 260px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: #4a5261;
  font-size: 14px;
  margin-top: 16px;
  background: rgba(22, 26, 33, 0.5);
  overflow: hidden;
}
.image-slot img {
  max-width: 100%;
  display: block;
}
.image-slot .slot-hint { font-size: 12px; color: #3a4250; }

/* 响应式：窄屏时侧边栏变成顶部横向导航 */
@media (max-width: 860px) {
  .layout { flex-direction: column; }

  .sidebar {
    width: 100%;
    height: auto;
    position: static;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }

  .brand { padding: 13px 16px; }

  .nav {
    display: flex;
    gap: 7px;
    overflow-x: auto;
    padding: 10px 16px;
    white-space: nowrap;
  }
  .nav-group { display: none; }

  .nav-item {
    margin-bottom: 0;
    flex-shrink: 0;
    border: 1px solid var(--line);
    background: var(--bg-soft);
  }
  .nav-item.on::before { display: none; }
}

@media (max-width: 640px) {
  .page { padding: 20px 16px 40px; }
  .topbar { padding: 13px 16px; }
  .hero .big { font-size: 26px; }
  .cards { grid-template-columns: 1fr; }
  .ball.s-lg { width: 38px; height: 38px; font-size: 16px; }
}

/* ============================================================
   推荐图渲染（固定模板）
   ============================================================ */

.r-image {
  background: #fff;
  color: #222;
  border-radius: 12px;
  overflow: hidden;
  margin-top: 16px;
  width: 100%;
  max-width: 760px;
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
  box-shadow: 0 4px 20px rgba(0,0,0,0.35);
}

/* ---- 红色页头 ---- */
.r-head {
  background: linear-gradient(160deg, #e8402a 0%, #d92f1e 45%, #c4241a 100%);
  color: #fff;
  text-align: center;
  padding: 22px 20px 18px;
  position: relative;
}
.r-head::after {
  content: '';
  position: absolute;
  left: 0; right: 0; bottom: 0;
  height: 3px;
  background: linear-gradient(90deg, #f5d020, #ffe97a, #f5d020);
}
.r-headbrand { font-size: 14px; letter-spacing: 2px; color: #ffe9c9; }
.r-headshop  { font-size: 12px; color: #ffd9a8; margin-top: 3px; }
.r-headtitle {
  font-size: 30px; font-weight: 800; letter-spacing: 3px;
  margin: 12px 0 8px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.25);
}
.r-headissue { font-size: 15px; color: #ffe9c9; letter-spacing: 1px; }
.r-headissue b {
  color: #fff; font-size: 18px; letter-spacing: 3px;
  border-bottom: 2px dashed rgba(255,255,255,0.6);
  padding: 0 6px;
}

/* ---- 内容区 ---- */
.r-body { padding: 16px 18px 4px; }

.r-block { margin-bottom: 16px; }

.r-sectitle {
  font-size: 16px; font-weight: 700; color: #d92f1e;
  padding-left: 11px; position: relative;
  margin-bottom: 12px;
}
.r-sectitle::before {
  content: '';
  position: absolute; left: 0; top: 3px;
  width: 4px; height: 16px; border-radius: 2px;
  background: #e8402a;
}

/* ---- 文本字段网格 ---- */
.r-fields { display: grid; gap: 10px 16px; }
.r-field { font-size: 12px; }
.r-label { color: #999; margin-bottom: 3px; }
.r-value { color: #222; font-weight: 700; font-size: 13px; line-height: 1.5; }
.r-value.empty { color: #ccc; font-weight: 400; }

/* ---- 号码行 ---- */
.r-rows { display: flex; flex-direction: column; gap: 10px; }
.r-numrow { display: flex; align-items: center; gap: 12px; }
.r-numlabel {
  font-size: 13px; color: #666; font-weight: 600;
  min-width: 42px; flex-shrink: 0;
}
.r-ballwrap { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* ---- 球 ---- */
.rball {
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%; font-weight: 700; color: #fff;
  flex-shrink: 0;
  font-family: Arial, Helvetica, sans-serif;
  box-shadow: inset 0 -2px 5px rgba(0,0,0,0.22), 0 1px 2px rgba(0,0,0,0.15);
}
.rball.md { width: 34px; height: 34px; font-size: 14px; }
.rball.sm { width: 28px; height: 28px; font-size: 12px; }
.rball.red    { background: linear-gradient(180deg, #f0575c, #d32f34); }
.rball.gold   { background: linear-gradient(180deg, #f7d24a, #e0a800); color: #5a4200; }
.rball.blue   { background: linear-gradient(180deg, #4a83f5, #2158c4); }
.rball.gray   { background: linear-gradient(180deg, #9aa3b2, #6b7488); }
.rball.empty  { background: #eceff3; box-shadow: none; }
.rball.wx0 { background: linear-gradient(180deg,#f5d24a,#d9a400); color:#5a4200; }
.rball.wx1 { background: linear-gradient(180deg,#5fc98a,#2e9e5b); }
.rball.wx2 { background: linear-gradient(180deg,#4a9af5,#1f66c9); }
.rball.wx3 { background: linear-gradient(180deg,#f0575c,#c93236); }
.rball.wx4 { background: linear-gradient(180deg,#c79a62,#8f6533); }

/* ---- 冷热号 ---- */
.r-twovalues { display: flex; flex-direction: column; gap: 8px; }
.r-tvrow { font-size: 14px; }
.r-tvlabel { color: #d92f1e; font-weight: 700; }
.r-tvvalue { color: #333; letter-spacing: 1px; }

/* ---- 两栏 ---- */
.r-twocol { display: flex; gap: 20px; align-items: flex-start; }
.r-twocol > .r-col { flex: 1; min-width: 0; }

/* ---- 绕胆图 ---- */
.r-gridwrap { text-align: center; }
.r-grid { display: grid; gap: 8px; margin: 0 auto 14px; max-width: 420px; }
.r-cell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  font-size: 22px; font-weight: 800; color: #fff;
  font-family: Arial, sans-serif;
  box-shadow: inset 0 -3px 8px rgba(0,0,0,0.18);
}
.r-cell.goldred { background: linear-gradient(180deg,#f0575c,#cf2a30); }
.r-cell.orange  { background: linear-gradient(180deg,#f9a825,#e07c00); }
.r-cell.purple  { background: linear-gradient(180deg,#c93fa0,#9c1f78); }
.r-cell.purple-dark { background: linear-gradient(180deg,#b3308c,#7d1263); }
.r-cell.blue    { background: linear-gradient(180deg,#4a83f5,#2158c4); }

.r-legend { display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; font-size: 13px; color: #444; }
.r-legenditem { display: inline-flex; align-items: center; gap: 6px; }
.r-dot { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }
.r-dot.gold-red, .r-dot.goldred { background: linear-gradient(180deg,#f0575c,#cf2a30); }
.r-dot.orange   { background: linear-gradient(180deg,#f9a825,#e07c00); }
.r-dot.purple   { background: linear-gradient(180deg,#c93fa0,#9c1f78); }
.r-dot.purple-dark { background: linear-gradient(180deg,#b3308c,#7d1263); }
.r-dot.blue     { background: linear-gradient(180deg,#4a83f5,#2158c4); }
.r-caption { font-size: 12.5px; color: #777; margin-top: 10px; }

/* ============================================================
   实票统计热力图（render.js 的 heatmap section）
   ------------------------------------------------------------
   白底 / 无边框 / 柱状图；几何尺寸（柱高、字号）都写在元素的内联
   样式里，这里只放不随数据变化的外观，保证 HTML→图片 导出稳定。
   ============================================================ */
.r-hm { display: flex; flex-direction: column; }

/* 顶部深红标题条 */
.r-hm-titlebar {
  background: #b71c1c;
  border-radius: 10px;
  color: #fff;
  text-align: center;
  padding: 13px 12px 11px;
  margin-bottom: 14px;
  border: none;
}
.r-hm-t1 { font-size: 23px; font-weight: 800; letter-spacing: 3px; line-height: 1.25; }
.r-hm-t2 { font-size: 12.5px; color: #ffd9d9; margin-top: 5px; letter-spacing: 0.5px; }

/* 每一组（前区/后区） */
.r-hm-sec { margin-bottom: 14px; }
.r-hm-seclabel {
  font-size: 14px; font-weight: 700; color: #b71c1c;
  padding-left: 9px; position: relative; margin-bottom: 8px;
}
.r-hm-seclabel::before {
  content: ''; position: absolute; left: 0; top: 2px;
  width: 3px; height: 13px; border-radius: 2px; background: #b71c1c;
}

.r-hm-chart { display: flex; align-items: flex-start; }
.r-hm-yax { position: relative; }
.r-hm-plot { position: relative; }
.r-hm-bars { display: flex; align-items: flex-end; }
.r-hm-xax { display: flex; }
.r-hm-num { font-variant-numeric: tabular-nums; }
.r-hm-pct { font-variant-numeric: tabular-nums; }

/* 没有数据时 */
.r-hm-nodata { font-size: 12.5px; color: #999; text-align: center; padding: 18px 0; }

/* 数据来源 / 免责 */
.r-hm-src { font-size: 10.5px; color: #9aa0a6; text-align: center; margin-top: 4px; }
.r-hm-tip { font-size: 10.5px; color: #b0b4b9; text-align: center; margin-top: 3px; }

/* ---- 五行 ---- */
.r-wuxing { display: flex; flex-direction: column; gap: 10px; }
.r-wxrow { display: flex; align-items: center; gap: 10px; }
.r-wxbadge {
  width: 34px; height: 34px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.r-wxbadge.wx0 { background: linear-gradient(180deg,#f5d24a,#d9a400); color:#5a4200; }
.r-wxbadge.wx1 { background: linear-gradient(180deg,#5fc98a,#2e9e5b); }
.r-wxbadge.wx2 { background: linear-gradient(180deg,#4a9af5,#1f66c9); }
.r-wxbadge.wx3 { background: linear-gradient(180deg,#f0575c,#c93236); }
.r-wxbadge.wx4 { background: linear-gradient(180deg,#c79a62,#8f6533); }
.r-wxtails { font-size: 11.5px; color: #888; width: 74px; flex-shrink: 0; }
/* 五行阴阳标记（阳X·阴Y）：行内小字，不占号码区宽度 */
.r-wxyy { font-size: 10.5px; color: #b07d18; width: 46px; flex-shrink: 0; }
.r-wxfoot { margin-top: 12px; font-size: 12.5px; color: #444; display: flex; flex-direction: column; gap: 5px; }
.r-wxfoot b { color: #d92f1e; }

/* ---- 九转连环 ---- */
.r-circwrap { text-align: center; }
.r-circle {
  position: relative;
  width: 100%; max-width: 380px; aspect-ratio: 1;
  margin: 0 auto;
}
.r-ring {
  position: absolute; border-radius: 50%;
  border: 1.5px solid #e0b34a;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
}
/* 圆环直径和 render.js 的 CIR_RADII（12/24/36/46%）一一对应：
   直径 92/72/48/24% → 半径 46/36/24/12%，号码点正好落在环线上。
   最外圈留 4% 边距，否则上/下方向的号码点会贴边被切。 */
.r-ring.ring1 { width: 92%; height: 92%; }
.r-ring.ring2 { width: 72%; height: 72%; }
.r-ring.ring3 { width: 48%; height: 48%; }
.r-ring.ring4 { width: 24%; height: 24%; }
.r-center {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(180deg,#f5d24a,#e0a800);
  color: #5a4200; font-weight: 800; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  z-index: 2;
}
.r-ringnum {
  position: absolute;
  transform: translate(-50%, -50%);
  font-size: 13px; font-weight: 700; color: #b8860b;
  background: #fff; padding: 1px 3px; border-radius: 3px;
  z-index: 3;
}

/* ---- 九转连环 · 固定同心圆模板（中心 1 + 4 圈 × 8 方向 = 33 个位置） ----
   位置全部由 render.js 用显式坐标表算好、以内联 top/left(%) 写死，
   这里只管样子：4 个圆环 + 中心点 + 33 个号码。
   号码三档颜色：金胆/银胆(金) > 拖码(橙) > 号码池(红) > 未推荐(浅灰)。 */
.r-ring {
  position: absolute; border-radius: 50%;
  border: 1.2px solid #e8c877;
  left: 50%; top: 50%; transform: translate(-50%, -50%);
  z-index: 0;
}
.r-cirnum {
  position: absolute;
  transform: translate(-50%, -50%);
  width: 17px; height: 17px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; line-height: 1;
  font-family: Arial, sans-serif;
  background: #fff;                                  /* 白底圆点：圆环线从号码底下穿过 */
  color: #d9d9d9;                                    /* 未推荐：浅色 */
  z-index: 3;
}
/* 三档高亮：都用白底 + 字色区分，保证压在最外圈那根环线上也看得清 */
.r-cirnum.pool   { color: #e53935; font-weight: 800; }                       /* 号码池 */
.r-cirnum.silver { color: #d98218; font-weight: 800; }                       /* 拖码 */
.r-cirnum.core   { color: #a8770a; font-weight: 800; }                       /* 金胆/银胆 */
.r-circenter {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  width: 24px; height: 24px; border-radius: 50%;
  background: #fff; border: 1.5px solid #e0b34a;
  color: #b8860b; font-weight: 800; font-size: 11.5px;
  display: flex; align-items: center; justify-content: center;
  z-index: 4;
}
.r-circenter.pool   { color: #e53935; }
.r-circenter.silver { color: #d98218; }
.r-circenter.core   { color: #a8770a; }
/* 图例色点：和图上三档高亮一一对应 */
.r-dot.core   { background: #a8770a; }
.r-dot.silver { background: #d98218; }
.r-dot.pool   { background: #e53935; }
.r-dot.dim    { background: #d9d9d9; }

/* ---- 九宫 ---- */
.r-jgwrap { text-align: center; }
.r-jiugong {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  max-width: 260px;
  margin: 0 auto;
}
.r-jgcell {
  aspect-ratio: 1;
  display: flex; align-items: center; justify-content: center;
  border-radius: 6px;
  font-size: 24px; font-weight: 800; color: #fff;
  background: linear-gradient(180deg,#f9a825,#e07c00);
  font-family: Arial, sans-serif;
}
.r-jgcell.center { background: linear-gradient(180deg,#f7d24a,#e0a800); color: #5a4200; }
.r-jgfoot { font-size: 12.5px; color: #444; margin-top: 12px; line-height: 1.8; }
.r-jgfoot b { color: #d92f1e; }

/* ---- 日历条 ---- */
.r-calendar {
  background: #fffaf0;
  border: 1px solid #f0dfb8;
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 13px;
}
.r-calrow { display: flex; flex-wrap: wrap; gap: 18px; color: #444; }
.r-calitem b { color: #666; font-weight: 600; }
.r-calbadges { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 10px; }
.r-calbadge {
  font-size: 12px; padding: 3px 12px; border-radius: 20px;
  border: 1px solid #e8806a; color: #d92f1e; background: #fff;
}
.r-calbadge b { color: #b3261e; }

/* ---- 热号排行 ---- */
.r-rank { display: flex; flex-direction: column; gap: 14px; }
.r-ranktitle { font-size: 13.5px; font-weight: 700; color: #d92f1e; margin-bottom: 8px; }
.r-ranklist { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px 12px; }
.r-rankitem { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: #555; }
.r-rankcount { color: #888; }

/* ---- 内联脚注 ---- */
.r-inlinefoot { display: flex; flex-wrap: wrap; gap: 18px; margin-top: 12px; font-size: 13px; color: #444; }
.r-inlineitem b { color: #666; font-weight: 600; }
.r-note { font-size: 12.5px; color: #777; margin-top: 10px; }

/* ---- 页脚 ---- */
.r-foot {
  text-align: center;
  padding: 18px 20px 20px;
  font-size: 13px;
  color: #d92f1e;
  font-weight: 700;
  letter-spacing: 1px;
}
.r-disclaimer {
  font-size: 11px; color: #aaa; font-weight: 400;
  margin-top: 6px; letter-spacing: 0;
}

/* ---- 录入表单样式 ---- */
.tk-block {
  border-top: 1px solid var(--line);
  padding-top: 16px;
  margin-top: 16px;
}
.tk-block:first-child { border-top: none; padding-top: 0; margin-top: 0; }
.tk-title {
  font-size: 14px; font-weight: 600; color: #d92f1e;
  margin-bottom: 12px;
}
.tk-subtitle { font-size: 13px; color: var(--muted); margin: 12px 0 8px; }
.tk-twocol { display: flex; gap: 20px; align-items: flex-start; flex-wrap: wrap; }
.tk-twocol > div { flex: 1; min-width: 280px; }
.tk-fields { display: grid; gap: 12px 14px; }
.tk-label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 5px; }
.tk-input {
  width: 100%; padding: 8px 11px; font-size: 13px; font-family: inherit;
  color: var(--text); background: #0f1115; border: 1px solid var(--line);
  border-radius: 8px; outline: none; box-sizing: border-box; user-select: text;
}
.tk-input:focus { border-color: #3a5fc0; }
.tk-numrow { display: flex; align-items: center; gap: 12px; margin-bottom: 8px; }
.tk-numlabel { font-size: 12.5px; color: var(--muted); min-width: 70px; flex-shrink: 0; }
.tk-numinput { flex: 1; }
.tk-note { font-size: 12px; color: var(--dim); margin-top: 10px; line-height: 1.7; }

@media (max-width: 700px) {
  .r-twocol { flex-direction: column; }
  .r-headtitle { font-size: 22px; }
}
/* ---- 输入框 + 骰子按钮 ---- */
.tk-with-dice {
  display: flex;
  align-items: center;
  gap: 8px;
  width: 100%;
  min-width: 0;
}
.tk-with-dice .tk-input { flex: 1; min-width: 0; }

.tk-dice {
  flex-shrink: 0;
  width: 34px;
  height: 34px;
  font-size: 15px;
  line-height: 1;
  background: var(--bg-soft);
  border: 1px solid var(--line);
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.12s;
  padding: 0;
}
.tk-dice:hover {
  background: #2f6feb;
  border-color: #2f6feb;
  transform: scale(1.08);
}
.tk-dice:active { transform: scale(0.94); }
.tk-dice.rolled {
  background: #47e0a0;
  border-color: #47e0a0;
  transform: rotate(180deg) scale(1.1);
}

/* 导出图片时不留白边 */
.r-image { margin: 0; border-radius: 12px; }
/* ============================================================
   足球赛事页面
   ============================================================ */

.fb-layout {
  display: flex;
  gap: 18px;
  align-items: flex-start;
  margin-top: 6px;
}
.fb-listwrap { flex: 1.15; min-width: 0; }
.fb-detailwrap { flex: 1; min-width: 0; position: sticky; top: 16px; }

/* ---- 日期分隔 ---- */
.fb-datehead {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  color: var(--muted);
  padding: 14px 4px 8px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 6px;
}
.fb-datehead .fb-week { color: var(--dim); font-size: 12px; }

/* ---- 比赛行 ---- */
.fb-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: 10px;
  cursor: pointer;
  transition: background 0.12s;
  border: 1px solid transparent;
}
.fb-row:hover { background: #171c25; }
.fb-row.active { background: #1d2534; border-color: #3a5fc0; }
.fb-row.focal .fb-league::before {
  content: '★';
  margin-right: 3px;
  color: var(--gold);
}

.fb-left { width: 76px; flex-shrink: 0; }
.fb-league {
  font-size: 11.5px;
  color: var(--muted);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.fb-time {
  width: 44px;
  flex-shrink: 0;
  font-size: 12.5px;
  color: #9aa3b2;
  font-family: Consolas, monospace;
}

.fb-score {
  flex: 1;
  min-width: 0;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13.5px;
}
.fb-team {
  flex: 1;
  min-width: 0;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  color: var(--text);
}
.fb-team.home { text-align: right; }
.fb-team.away { text-align: left; }
.fb-rank { font-size: 10.5px; color: var(--dim); font-style: normal; margin: 0 3px; }
.fb-vs {
  flex-shrink: 0;
  min-width: 44px;
  text-align: center;
  font-size: 12.5px;
  color: var(--dim);
  font-family: Consolas, monospace;
}

.fb-odds {
  width: 132px;
  flex-shrink: 0;
  display: flex;
  gap: 6px;
  justify-content: flex-end;
  font-size: 12px;
  font-family: Consolas, monospace;
  color: #8b93a1;
}
.fb-odds span { min-width: 34px; text-align: center; }
.fb-noodds { color: #454d5c; font-size: 11px; }

.fb-move-tag {
  flex-shrink: 0;
  font-size: 10px;
  padding: 1px 5px;
  border-radius: 4px;
  background: rgba(229, 72, 77, 0.18);
  color: #f0575c;
  border: 1px solid rgba(229, 72, 77, 0.35);
}

/* ---- 详情 ---- */
.fb-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 14px;
}
.fb-detail-league { font-size: 14px; color: var(--muted); }
.fb-detail-time { font-size: 12px; color: var(--dim); }

.fb-versus {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 8px;
  margin-bottom: 16px;
  background: var(--bg-soft);
  border-radius: 12px;
}
.fb-v-team { flex: 1; min-width: 0; text-align: center; }
.fb-v-team .n {
  font-size: 15px;
  font-weight: 600;
  color: var(--text);
  word-break: break-word;
  line-height: 1.4;
}
.fb-v-team .rk { font-size: 11px; color: var(--dim); margin-top: 4px; }

/* ============================================================
   【关键】锁死推荐图的内部布局

   媒体查询是按「屏幕宽度」判断的。手机上 (<=700px) styles.css 里
   这些规则会被激活，把图片内部重新排版：
       .r-twocol   { flex-direction: column }        左右并排 → 上下堆叠
       .r-ranklist { grid-template-columns: 1fr }    热号排行 → 竖列
   结果就是网页和 App 长得不一样（用户说的「变形」）。

   这里用更高优先级 + !important 锁死，让图片永远保持设计布局，

   ============================================================ */

/* ============================================================
   【口口·两张图左右放】推荐图两两并排
   ------------------------------------------------------------
   用户原话：「我要的模板是两张图左右放，两张图一个版面比如：口口 这样的
     我要的是双色球的两个资料这样布局，大乐透也是
     排三和排五 七星彩和七乐彩这样的布局 快乐8和3D是这样布局」

   配对（左侧 / 右侧）：
     ① 双色球 main  / 双色球 wuxing   （同一个彩种的两张图）
     ② 大乐透 main  / 大乐透 wuxing   （同一个彩种的两张图）
     ③ 排列3        / 排列5
     ④ 七星彩       / 七乐彩
     ⑤ 福彩3D       / 快乐8            （用户先说过「3D左边」）

   ⚠️ 只在【外层容器】上排，推荐图本身【一个字都没改】：
      · 仍然靠 fit() 的 transform: scale(等比) 适配 —— 图不会变形
      · 手机等窄屏：图横向放不下，按容器宽度整体等比缩小（不是变形、不裁切）

   为什么宽屏也要缩一点点：两张图一共 760×2 = 1520px + 间距，
   1920px 屏幕上左右各留 20px 之后只剩 1880px，本来就够；
   于是把每栏设成「各占一半」，fit() 量到 ~930px/栏 ⇒ scale≈1.22（放大，更清楚）。
   窄屏（手机）每栏只有约 175px ⇒ scale≈0.23，图会很小 ——
   这是「两张 760px 的图并排」的必然结果，用户已知情（他要的就是这个版式）。
   ============================================================ */
.ro-imagepair { display: block; }          /* 默认：不并排，两张图照旧上下排 */
@media (min-width: 1366px) {
  /* 1366 起才并排：再窄就真的看不清了（每栏 < 650px ⇒ scale < 0.86） */
  .ro-imagepair {
    display: grid;
    grid-template-columns: 1fr 1fr;        /* 各占一半，fit() 按每栏实测宽度缩放 */
    gap: 20px;
    align-items: start;
    margin-bottom: 20px;
  }
  /* 网格项默认 min-width:auto 会被 760px 的图撑破 → 显式归零 */
  .ro-imagepair > .ro-imagewrap { min-width: 0; margin-bottom: 0; }
  /* 并排时不留出「横向滑动」的余地：宽度已经由 fit() 精确适配 */
  .ro-imagepair > .ro-imagewrap { overflow-x: hidden; }
}

/* 【点击放大】已按用户要求【移除】。 */

/* ============================================================
   【自愈】页面确实旧了就整页刷新（兜底）
   ------------------------------------------------------------
   手机浏览器（尤其微信内置）会把页面缓存很久，
   导致「电脑上更新了、手机上还是旧的」。
   这段代码拿云端的号码文件时间和页面生成时间对比，
   页面确实旧、而且页尾的【准实时】逻辑又没能就地换过来时，
   才带一个【每次都不相同】的尾巴重新加载整页。

   【两个坑都修了】
   1) 时间比较：以前直接拿 publishedAt（UTC、'T' 分隔）和 data-built
      （北京时间）比字符串 —— UTC 比北京早 8 小时，几乎永远比不赢，
      所以这段以前基本不触发。现在统一转成北京时间再比。
   2) 不和准实时机制打架：页尾的准实时逻辑能就地重渲染成功时不刷新整页；
      只有「数据是新的、但页面没能显示出来」才刷新兜底。
   ============================================================ */
(function () {
  try {
    var shown = document.body.getAttribute('data-built') || '';
    if (!shown) return;

    /* 防止无限刷新：同一分钟内只自愈一次 */
    var last = Number(sessionStorage.getItem('cdd.selfheal') || 0);
    if (last && Date.now() - last < 60000) return;

    /* 把 ISO(UTC) 和「YYYY-MM-DD HH:MM」统一成【北京时间的可比较字符串】。
       不带时区的当成北京时间（saved-tickets.js / data-built 都是这种），
       输出精确到分钟，和 data-built 的精度一致。 */
    function toBeijingKey(s) {
      if (!s) return '';
      var str = String(s).trim();
      var d;
      if (/T/.test(str) || /Z$/.test(str)) {
        d = new Date(str);                                  /* ISO(UTC) */
      } else {
        d = new Date(str.replace(' ', 'T') + '+08:00');      /* 北京时间 */
      }
      if (isNaN(d.getTime())) return '';
      var bj = new Date(d.getTime() + (d.getTimezoneOffset() + 480) * 60000);
      var p = function (n) { return String(n).padStart(2, '0'); };
      return bj.getFullYear() + '-' + p(bj.getMonth() + 1) + '-' + p(bj.getDate()) +
             ' ' + p(bj.getHours()) + ':' + p(bj.getMinutes());
    }
    window.__toBeijingKey = toBeijingKey;   /* 方便自测 / 排查 */

    function selfHealReload() {
      sessionStorage.setItem('cdd.selfheal', String(Date.now()));
      location.replace(location.pathname + '?t=' + Date.now());
    }

    function decide(j) {
      if (!j) return;
      var remoteKey = toBeijingKey(j.publishedAt) || toBeijingKey(j.updated);
      var mineKey = toBeijingKey(shown);
      if (!remoteKey || !mineKey) return;
      if (remoteKey <= mineKey) return;          /* 页面不比云端旧，什么都不做 */

      /* 页尾的准实时逻辑已经就地换成新号码、图也是正常实时渲染的
         → 页面上已经是新号码了，不用刷新整页 */
      var applied = false;
      var renderMode = '';
      try { applied = !!window.__roLiveApplied; } catch (e2) { /* 忽略 */ }
      try { renderMode = document.body.getAttribute('data-render') || ''; } catch (e3) { /* 忽略 */ }
      if (applied && renderMode !== 'fallback') return;

      /* 数据是新的，但页面没能就地显示出来（渲染兜底 / 脚本没跑）
         → 整页刷新兜底 */
      selfHealReload();
    }
    window.__roSelfHealDecide = decide;   /* 方便自测 / 排查 */

    fetch('tickets.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        /* 等页尾的准实时逻辑先跑完，再决定要不要刷新整页（免得跟它抢） */
        var p = (typeof window.__roLivePromise !== 'undefined') ? window.__roLivePromise : null;
        var later = function () { setTimeout(function () { decide(j); }, 0); };
        if (p && typeof p.then === 'function') p.then(later, later);
        else later();
      })
      .catch(function () { /* 网络问题就忽略，别影响浏览 */ });
  } catch (e) { /* 忽略 */ }
})();

/* ============================================================
   【实时渲染】推荐图 —— 和本地 App 走同一条渲染路径
   ------------------------------------------------------------
   App（game.html 的 renderImagesInto）是这么渲染的：

       const draw     = getDraw(gameId);
       const nextDate = nextDrawDate(gameId);
       const issue    = nextIssueFor(gameId);
       const entry    = getTicket(gameId, nextDate);
       const manual   = entry && entry.images && entry.images[img.key];
       const resolved = resolveTemplateValues(gameId, img.key, manual);
       const data     = { issue: issue, date: nextDate, images: {} };
       data.images[img.key] = resolved.values;
       renderTicketImage(gameId, img.key, data);

   下面 renderSlot() 就是照抄上面这几行的调用方式（一字不改的语义），
   所以只要 render.js 和数据一样，两边渲染出的 DOM 必然一致。

   图位：<div class="ro-imagewrap" data-game="ssq" data-image="main">…</div>
   里面是服务器端预渲染的兜底内容；
   这里渲染成功后才整体替换掉 —— 万一 JS 挂了，页面也不会空白。
   ============================================================ */
(function () {
  /* 按「彩种 + 图名」渲染一张推荐图 —— 和 game.html / renderImagesInto 完全一致 */
  function renderImageDom(gid, key) {
    if (!gid || !key) return null;
    if (typeof TEMPLATES === 'undefined' || typeof renderTicketImage !== 'function') return null;

    var tpl = TEMPLATES[gid];
    if (!tpl || !tpl.images || !tpl.images.length) return null;

    /* 找到这张图的模板定义；找不到就用第一张（和 renderTicketImage 的兜底一致） */
    var img = null;
    for (var i = 0; i < tpl.images.length; i++) {
      if (tpl.images[i].key === key) { img = tpl.images[i]; break; }
    }
    if (!img) img = tpl.images[0];
    if (!img) return null;

    /* ---------- 以下与 game.html / renderImagesInto 完全一致 ---------- */
    var nextDate = nextDrawDate(gid);
    var draw  = (typeof getDraw === 'function') ? getDraw(gid) : null;
    var issue = (typeof nextIssueFor === 'function') ? nextIssueFor(gid) : ((draw && draw.issue) || '');

    var entry  = (typeof getTicket === 'function') ? getTicket(gid, nextDate) : null;
    var manual = (entry && entry.images && entry.images[key]) || null;

    var resolved = (typeof resolveTemplateValues === 'function')
      ? resolveTemplateValues(gid, key, manual)
      : { values: manual || {} };

    var data = { issue: issue, date: nextDate, images: {} };
    data.images[key] = resolved.values;

    return renderTicketImage(gid, key, data);
    /* ---------- 以上与 game.html / renderImagesInto 完全一致 ---------- */
  }

  /** 图位（<div class="ro-imagewrap" data-game data-image>）→ 渲染成图 */
  function renderSlot(slot) {
    return renderImageDom(slot.getAttribute('data-game'), slot.getAttribute('data-image'));
  }

  function renderAll() {
    var slots = document.querySelectorAll('.ro-imagewrap[data-game]');
    var ok = 0;
    var fail = 0;
    var hidden = 0;

    for (var i = 0; i < slots.length; i++) {
      var slot = slots[i];

      /* ============================================================
         【按天出】实票统计热力图：这里是【客户端】的第二道判断。
         服务器生成时已经判断过一次，但页面会被缓存/长期挂在网上 ——
         第二天打开同一张页面时，昨天的热力图必须自动消失。
         判断口径：heatmap-data.js 里的 shouldShowHeatmap
         （数据必须是今天的 + 今天是开奖日 + 已过北京时间 18:00 +
           还没到窗口结束的 20:00 / 21:00）。
         ============================================================ */
      if (slot.getAttribute('data-image') === 'heatmap') {
        var hg = slot.getAttribute('data-game');
        var show = false;
        try {
          show = (typeof shouldShowHeatmap === 'function') && shouldShowHeatmap(hg);
        } catch (e) { show = false; }
        if (!show) {
          /* 【顶部区块里的那一张不能在这里删】
             现在热力图只出现在 #ro-latest 区块里，把这个图位删掉只会
             留下一个空区块。交给 refreshLatestBlock 换成「最新开奖」。 */
          if (isBlockHeatSlot(slot)) {
            try { refreshLatestBlock(true); } catch (e3) { /* 忽略 */ }
            continue;
          }
          /* 老页面缓存下来的、彩种区块里的热力图 → 整块拿掉，不留占位、不留空白 */
          try {
            if (slot.parentNode && slot.parentNode.removeChild) slot.parentNode.removeChild(slot);
            else slot.style.display = 'none';
          } catch (e) { slot.style.display = 'none'; }
          hidden++;
          continue;
        }
      }

      var dom = null;

      try {
        dom = renderSlot(slot);
      } catch (e) {
        /* 渲染出错：保留服务器端预渲染的兜底内容，不影响浏览 */
        fail++;
        if (window.console && console.warn) {
          console.warn('[分享页] 实时渲染失败，保留预渲染兜底：' +
            slot.getAttribute('data-game') + '/' + slot.getAttribute('data-image'), e);
        }
        continue;
      }

      if (!dom) { fail++; continue; }

      /* 先渲染成功、再替换，避免出现空白 */
      slot.innerHTML = '';
      slot.appendChild(dom);
      ok++;
    }

    /* 留一个标记，方便确认这一页到底跑的是实时渲染还是预渲染兜底 */
    try {
      if (document.body && document.body.setAttribute) {
        document.body.setAttribute('data-render', fail ? 'fallback' : 'live');
        document.body.setAttribute('data-render-count', ok + '/' + slots.length);
        document.body.setAttribute('data-heatmap-hidden', String(hidden));
      }
    } catch (e) { /* 忽略 */ }

    return ok;
  }

  window.__roRenderAll = renderAll;

  /* 【调试】想验证「18:00 之后才有热力图」又不想等到 18:00：
     在网址后面加 ?hmnow=2026-10-15T18:30 —— 时间判断会按这个时刻算。
     不加参数就是真实时间，线上用户不会受影响。 */
  try {
    if (typeof location !== 'undefined' && location.search) {
      var hm = /[?&]hmnow=([^&]+)/.exec(location.search);
      if (hm) {
        window.HEATMAP_NOW_OVERRIDE = decodeURIComponent(hm[1]);
        if (window.console && console.log) console.log('[分享页] 热力图时间已定格：' + window.HEATMAP_NOW_OVERRIDE);
      }
    }
  } catch (e) { /* 忽略 */ }

  /* ============================================================
     【最新开奖 ⇄ 热力图 · 到点自动切换】
     ------------------------------------------------------------
     用户原话：
       「在开双色球的时候 18 点更新到最新开奖位置覆盖住，过了 20 点就更新回来
         最新开奖；同样大乐透在 18 点更新过去，21 点更新回来最新开奖。」

     这一段就是「页面一直开着也会自己换」的实现：
       · 时间窗判断 = latestBlockMode() → heatmap-data.js 的 shouldShowHeatmap()
         （和服务端预渲染、App 用的是同一个函数，不可能漂移）
       · 区块 HTML = latestBlockHtml()（同样是服务端那一份）
       · 只在【形态变了】或【开奖数据更新了】时才动 DOM，平时一次都不碰
       · 任何一步失败 → 保持原样（绝不留白、绝不出现空区块）

     调用时机：
       ① 页面刚打开（先用内联快照，本地时钟算一次）
       ② 每次拉到 tickets.json 之后（90 秒轮询）
       ③ 每 90 秒的定时器里【独立】再算一次 —— 断网也能到点自动切
     ============================================================ */
  var __roBlockMode = '';        /* 页面上这个区块现在是什么形态：'' / 'latest' / 'heatmap:ssq' */

  function blockModeKey() {
    try {
      if (typeof latestBlockMode !== 'function') return '';
      var m = latestBlockMode();
      return m.mode + (m.gameId ? ':' + m.gameId : '');
    } catch (e) { return ''; }
  }

  /**
   * 这个热力图图位就是【顶部区块里那一张】吗？
   * 现在热力图只出现在 #ro-latest 里（彩种区块不再重复出），
   * 所以「当前形态里的那个彩种」就是它 —— 用来避免把顶部区块删成空白。
   */
  function isBlockHeatSlot(slot) {
    return blockModeKey() === 'heatmap:' + slot.getAttribute('data-game');
  }

  /**
   * 把顶部区块换成「现在该有的样子」
   * @param {boolean} force 开奖数据更新了 → 即使形态没变也要重画一次
   * @returns {{ok:boolean, mode:string, changed:boolean}}
   */
  function refreshLatestBlock(force) {
    var out = { ok: false, mode: '', changed: false };
    try {
      /* 老页面没有这个 id（或被缓存的旧版本）→ 什么都不做。
         沙箱/自测环境里没有 getElementById 也走这一条，不会刷告警。 */
      var el = (typeof document !== 'undefined' && typeof document.getElementById === 'function')
        ? document.getElementById(LATEST_DRAWS_ID) : null;
      if (!el) return out;
      if (typeof latestBlockMode !== 'function' || typeof latestBlockHtml !== 'function') return out;
      if (typeof latestDrawsHtml !== 'function' || typeof latestDrawsFromRaw !== 'function') return out;

      var key = blockModeKey();
      if (!key) return out;
      out.mode = key;
      if (!force && key === __roBlockMode) { out.ok = true; return out; }   /* 形态没变 → 不碰 DOM */

      var all = null;
      try { all = (typeof DRAW_DATA !== 'undefined') ? DRAW_DATA.games : null; } catch (e1) { all = null; }

      var html = latestBlockHtml({
        latest: latestDrawsFromRaw(all, (typeof GAMES !== 'undefined') ? GAMES : {}),
        games: (typeof GAMES !== 'undefined') ? GAMES : {},
        /* 热力图内部 HTML：和推荐图走同一个渲染函数（同一次调用语义） */
        heatmap: function (gid) {
          var dom = renderImageDom(gid, 'heatmap');
          return (dom && dom.outerHTML) ? dom.outerHTML : '';
        }
      });
      if (!html) return out;                                 /* 生成不出来 → 保持原样，绝不留白 */

      __roBlockMode = key;                                   /* 记住形态，下次没变就不动 */
      out.ok = true;

      if (el.outerHTML === html) return out;                 /* 一模一样就不用动 DOM */
      el.outerHTML = html;
      out.changed = true;

      try {
        if (document.body && document.body.setAttribute) {
          document.body.setAttribute('data-block-mode', key);
        }
      } catch (e2) { /* 忽略 */ }

      /* 区块里换成了 760px 宽的热力图 → 重新做一次等比缩放 */
      try {
        if (typeof window.__roFit === 'function') window.__roFit();
      } catch (e3) { /* 忽略 */ }

      return out;
    } catch (e) {
      if (window.console && console.warn) console.warn('[分享页] 顶部区块切换失败，保留原内容', e);
      return out;
    }
  }

  /* 方便自测 / 排查：控制台里手动换一次（__roRefreshBlock()） */
  window.__roRefreshBlock = refreshLatestBlock;

  /* 【顺序·重要】先按本地时钟把区块定成该有的形态，再整体渲染图位 ——
     这样「服务器 02:00 预渲染成最新开奖、用户 19:00 打开」也能立刻显示热力图，
     而且顶部那张热力图会由下面的 renderAll() 一起渲染出来。 */
  try {
    refreshLatestBlock(false);
  } catch (e) { /* 忽略 */ }

  /* 页尾脚本执行时，上面的图位已经全部在 DOM 里，直接渲染 */
  try {
    renderAll();
  } catch (e) {
    if (window.console && console.warn) {
      console.warn('[分享页] 实时渲染整体失败，保留预渲染兜底', e);
    }
  }

  /* ============================================================
     【准实时同步】直接拉服务器上的最新号码，拿到就地重渲染
     ------------------------------------------------------------
     为什么需要这一段：
       页面里的号码是「生成那一刻」的快照（内联的 saved-tickets.js）。
       本机摇号后，必须等云端重新构建 + 部署，页面上的号码才会变，
       链路一长就是几十分钟 —— 这就是「摇完号要等两小时」的原因。

     现在的顺序：
       1) 先用内联快照渲染  → 立刻有内容，离线也能看
       2) 再异步拉 tickets.json（服务器上的最新号码）
          · 比页面里的新 → 覆盖内存里的 SAVED_TICKETS 并就地重渲染
          · 不新 / 打不开   → 什么都不做，页面照旧（离线可用）

     注意：SAVED_TICKETS 是 saved-tickets.js 里的 const，
           不能重新赋值整个变量，只能改它的属性。
     ============================================================ */

  /* 把 "2026-10-14T05:00:00.000Z"（ISO，UTC）和 "2026-10-14 05:00"
     （本机/云端生成，北京时间）统一成 'YYYY-MM-DD HH:MM:SS' 北京时间。
     两种格式直接比字符串一定出错（'T' 的编码比空格大），所以先归一化。 */
  function normTime(v) {
    var s = String(v == null ? '' : v).trim();
    if (!s) return '';
    var iso = s.replace(' ', 'T');
    if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$/.test(iso)) iso += ':00';
    /* 不带时区的当成北京时间（saved-tickets.js 里的 updated 就是这种） */
    if (/^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?$/.test(iso)) iso += '+08:00';
    var t = Date.parse(iso);
    if (isNaN(t)) return s.slice(0, 19).replace('T', ' ');
    /* 统一按北京时间输出，格式一样才能直接比大小 */
    var d = new Date(t + 8 * 3600 * 1000);
    var p2 = function (n) { return (n < 10 ? '0' : '') + n; };
    return d.getUTCFullYear() + '-' + p2(d.getUTCMonth() + 1) + '-' + p2(d.getUTCDate()) + ' ' +
           p2(d.getUTCHours()) + ':' + p2(d.getUTCMinutes()) + ':' + p2(d.getUTCSeconds());
  }

  function inlineTicketTime() {
    try {
      return (typeof SAVED_TICKETS !== 'undefined' && SAVED_TICKETS && SAVED_TICKETS.updated) || '';
    } catch (e) { return ''; }
  }

  /* 页面上当前这份【号码本身】的时间（updated），用来判断服务器那份是不是更新。
     注意用的是号码的时间，不是页面生成时间：
     云端如果用【旧号码】重新构建了一遍，它的 publishedAt 会很新，
     但 updated 是旧的 —— 那种不能认，否则会把页面上的新号码换回旧的。 */
  var appliedTime = normTime(inlineTicketTime());
  window.__roLiveApplied = false;
  window.__roLiveRemoteTime = '';

  /**
   * 用服务器数据覆盖页面上的号码并重渲染
   * @returns {boolean} 是否真的用新号码重渲染了
   */
  function applyRemoteTickets(j) {
    if (!j || !j.tickets || !Object.keys(j.tickets).length) return false;
    if (typeof SAVED_TICKETS === 'undefined' || !SAVED_TICKETS) return false;

    var remoteData = normTime(j.updated);
    var remotePub = normTime(j.publishedAt || j.updated);
    if (!remoteData && !remotePub) return false;

    /* 内容一模一样（只是重新构建了一遍）就没必要重画 10 张图 */
    var same = false;
    try { same = JSON.stringify(SAVED_TICKETS.tickets || {}) === JSON.stringify(j.tickets); } catch (e) { same = false; }

    /* 服务器这份比页面上的新吗？
       · 号码时间更晚            → 新（真的摇过号了）
       · 号码时间一样但内容不同  → 新（同一分钟内摇了两次，内容还是会变）
       · 号码时间更早            → 不是（云端拿旧号码重建，publishedAt 再新也不认） */
    var newer;
    if (remoteData && appliedTime) {
      newer = (remoteData > appliedTime) || (remoteData === appliedTime && !same);
    } else {
      newer = remotePub > appliedTime;
    }
    if (!newer) return false;                           /* 服务器的不新，不动 */

    /* 用服务器数据覆盖内存里的 SAVED_TICKETS（只改属性） */
    SAVED_TICKETS.updated = j.updated || SAVED_TICKETS.updated;
    SAVED_TICKETS.tickets = j.tickets;

    /* 同时清掉 localStorage 里的旧号码：
       loadTickets() 的规则是「本地存储比文件新就用本地存储」，
       不清掉的话会被旧号码盖回去，等于白拉一次 */
    try {
      localStorage.removeItem('cdd.tickets.v1');
      localStorage.removeItem('cdd.tickets.ts');
    } catch (e) { /* 忽略 */ }

    appliedTime = remoteData || remotePub;
    window.__roLiveRemoteTime = appliedTime;
    if (same) return false;                             /* 号码没变，不用重画 */

    window.__roLiveApplied = true;
    renderAll();                                        /* 用最新号码重渲染 */

    /* 重渲染后图片尺寸变了，重新做等比缩放 */
    try {
      if (typeof window.__roFit === 'function') window.__roFit();
    } catch (e) { /* 忽略 */ }

    try {
      if (document.body && document.body.setAttribute) {
        document.body.setAttribute('data-tickets-from', 'server');
        document.body.setAttribute('data-tickets-time', appliedTime);
      }
    } catch (e) { /* 忽略 */ }

    return true;
  }

  /* 方便自测 / 排查：页面上可以在控制台手动调 __roLiveApply(数据) */
  window.__roLiveApply = applyRemoteTickets;

  /* ============================================================
     【最新开奖 · 就地更新】拿到 tickets.json 里的 draws 后重画顶部区块
     ------------------------------------------------------------
     以前这块是服务器【预渲染】进 HTML 的静态内容，只有刷新整页才会变。
     现在 tickets.json 里带上了各彩种最新一期开奖（draws），
     拉到比页面内联快照更新的一期就：
       1) 把新号码合并进内存里的 DRAW_DATA（只改属性，只更新有的彩种）
       2) 调 refreshLatestBlock(true) 重画顶部区块
          —— 区块现在可能是「最新开奖」，也可能是顶掉它的「热力图」，
             具体放哪个由 latestBlockMode() 决定（到点会自动切换）：
               · 形态没变、只是开奖号变了 → 重画「最新开奖」那张卡
               · 到点该换回来了            → 换成「最新开奖」（带着新号码）
             【关键】换回来时用的就是刚才合并进 DRAW_DATA 的新号码，
             所以「20:00 / 21:00 一换回来就是最新一期」，不用等下次刷新。
     用的就是生成页面时那份同一个函数（latest-draws.js），
     所以服务端烤进去的和服务端/客户端换上去的写法完全一致。

     降级：拿不到 draws / 只有部分彩种 / 比页面旧 → 一律保持原样，
           不报错、不留白（这条路径整个用 try 包住）。
     ============================================================ */
  function applyRemoteDrawsToPage(j) {
    var res = { applied: [], skipped: [] };
    try {
      if (!j || !j.draws) return res;                      /* 没带就什么都不做 */
      if (typeof applyRemoteDraws !== 'function') return res;   /* 客户端脚本缺失 → 保持预渲染兜底 */

      /* 1) 合并进内存数据（只更新有的彩种；比页面旧的自动跳过） */
      res = applyRemoteDraws(j.draws) || res;
      if (!res.applied.length) return res;                 /* 没有更新 → 区块原样保留 */

      /* 2) 按【当前该有的形态】重画区块（形态判断 + HTML 都来自共享函数）
         【关键】用合并【之后】的完整数据（DRAW_DATA.games）重画，而不是 j.draws：
         服务器这次可能只带了一部分彩种，用 j.draws 直接渲染会把别的彩种弄丢。
         区块必须始终是完整的 8 个彩种。 */
      var r = refreshLatestBlock(true);
      if (!r.ok) return { applied: [], skipped: res.skipped };   /* 画不出来 → 保持原样 */

      try {
        if (document.body && document.body.setAttribute) {
          document.body.setAttribute('data-draws-from', 'server');
          document.body.setAttribute('data-draws-games', res.applied.join(','));
        }
      } catch (e2) { /* 忽略 */ }

      return res;
    } catch (e) {
      /* 任何意外都只是「这次没更新开奖」，不能影响页面其它部分 */
      if (window.console && console.warn) console.warn('[分享页] 最新开奖就地更新失败，保留原内容', e);
      return { applied: [], skipped: [] };
    }
  }

  /* 方便自测 / 排查：控制台里手动调 __roLiveDraws(数据) */
  window.__roLiveDraws = applyRemoteDrawsToPage;

  /* 拉一次服务器上的号码文件 */
  function pullTickets() {
    return fetch('tickets.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {
        /* 两件事各自独立：号码变了就重画 10 张图，开奖变了就重画顶部区块 */
        var t = applyRemoteTickets(j);
        var d = applyRemoteDrawsToPage(j);
        return t || (d && d.applied.length > 0);
      })
      .catch(function () { return false; });   /* 打不开服务器（离线/被墙）就继续用内联快照 */
  }

  var firstPull = pullTickets();
  window.__roLivePromise = firstPull;

  /* 方便自测 / 排查：控制台里手动拉一次（__roPullOnce().then(...)） */
  window.__roPullOnce = pullTickets;

  /* ============================================================
     【自动刷新】页面开着的时候，隔一段时间自动去服务器看有没有新数据
     ------------------------------------------------------------
     为什么需要：
       云端在固定时间更新（凌晨 2:00 全量 / 18:00 热力图 /
       21:30 福彩、21:45 体彩抓开奖同步）。如果你手机上的页面一直开着，
       以前只能【手动刷新】才看得到新内容。
     现在：
       每 90 秒做两件事，都是就地重渲染，不用你动手：
         ① 拉一次 tickets.json —— 有新号码就重画推荐图 + 顶部区块
         ② 【独立】再算一次顶部区块的形态 —— 到 18:00 换成热力图、
            到 20:00（双色球）/ 21:00（大乐透）换回最新开奖。
            这一步只看本机时间、不联网，所以断网也照样到点自动切。
     省流量：
       这只是一个小 JSON（几 KB），而且只有页面开着时才轮询；
       切到后台时浏览器会自动降频。
     ============================================================ */
  if (!window.__roAutoTimer) {
    var AUTO_MS = (typeof window.__roAutoIntervalMs === 'number')
      ? window.__roAutoIntervalMs : 90000;
    window.__roAutoTimer = setInterval(function () {
      try {
        pullTickets();
      } catch (e) { /* 忽略：网络问题不能影响页面 */ }
      /* 【到点自动切换】和网络无关，单独算一次（形态没变时它一个 DOM 都不碰） */
      try {
        refreshLatestBlock(false);
      } catch (e) { /* 忽略 */ }
    }, AUTO_MS);

    /* 页面从后台切回前台时也立刻拉一次（手机切回来马上就是新的） */
    if (typeof document !== 'undefined' && document.addEventListener) {
      document.addEventListener('visibilitychange', function () {
        if (!document.hidden) {
          try { pullTickets(); } catch (e) {}
          try { refreshLatestBlock(false); } catch (e) {}
        }
      });
    }
  }

  /* 补拉：本机刚摇完号时，云端可能还在部署中（约 1 分钟），
     GitHub Actions 排队时甚至会等几分钟，第一次拉到的还是旧的。
     隔几秒再补拉几次 —— 这样「号码刚摇完就打开网址」的人也不用
     手动刷新，页面自己会跟上（最多补拉四次，共约 3.5 分钟）。
     只要有一次拿到更新的数据就停。
     （间隔放在 window 上，方便自测/排查时改短。） */
  if (!window.__roLiveRetryDelays) window.__roLiveRetryDelays = [8000, 25000, 60000, 120000];

  firstPull.then(function (applied) {
    if (applied) return;                       /* 已经换成新号码了，不用补拉 */
    var delays = window.__roLiveRetryDelays || [];
    var step = function (i) {
      if (i >= delays.length) return;
      setTimeout(function () {
        pullTickets().then(function (done) { if (!done) step(i + 1); });
      }, delays[i]);
    };
    step(0);
  });
})();

/* ============================================================
   推荐图等比缩放
   ------------------------------------------------------------
   图片按 760px 设计宽度渲染，内部布局【完全不改】，
   手机上用 transform: scale() 整体缩小 ——
   这样和 App 里看到的一模一样，不会变形。

   【顺序】必须在实时渲染【之后】跑：
   实时渲染把图位内容整体换掉了，尺寸得重新量一遍。
   ============================================================ */
(function () {
  var BASE = 760;   /* 图片设计宽度，跟 .r-image 的宽度一致 */

  function fit() {
    var wraps = document.querySelectorAll('.ro-imagewrap');
    for (var i = 0; i < wraps.length; i++) {
      var w = wraps[i];
      /* 【点击放大】遮罩层里那个容器有它自己的缩放算法，
         不能被这里的「按容器宽度等比缩小」覆盖掉 */
      var img = w.querySelector('.r-image');
      if (!img) continue;

      var avail = w.clientWidth;
      if (!avail) continue;

      var scale = avail / BASE;
      if (scale >= 1) {
        /* 屏幕够宽，原样显示 */
        img.style.transform = 'none';
        w.style.height = 'auto';
      } else {
        /* 等比缩小，内部布局一点不动 */
        img.style.transformOrigin = 'top left';
        img.style.transform = 'scale(' + scale + ')';
        /* 容器高度要跟着缩，否则下面会留一大块空白 */
        w.style.height = Math.round(img.offsetHeight * scale) + 'px';
      }
    }
  }

  window.__roFit = fit;

  /* 【顺序】上面的实时渲染是同步跑完的，这里直接适配一次；
     后面几处只是保险，字体异步加载完再重算。 */
  fit();
  /* 图片里的字体可能异步加载，多算几次更稳 */
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', fit);
  }
  window.addEventListener('load', fit);
  window.addEventListener('resize', function () { setTimeout(fit, 60); });
  setTimeout(fit, 120);
  setTimeout(fit, 600);
  setTimeout(fit, 1500);
})();

/* ============================================================
   【口口】把要「两张图左右放」的图位两两包进一个并排容器
   ------------------------------------------------------------
   用户原话（最终版，最清楚的一次）：
     「我要的模板是两张图左右放，两张图一个版面比如：口口 这样的
      我要的是双色球的两个资料这样布局，大乐透也是
      排三和排五 七星彩和七乐彩这样的布局 快乐8和3D是这样布局」

   ⚠️ 配对单位是【图位 .ro-imagewrap】，不是【彩种区块 .ro-game】——
      因为前两组是「同一个彩种的两张图」（双色球的 main + wuxing），
      按彩种找区块根本区分不出来。

   配对表（左 / 右）：
     ① ssq/main   + ssq/wuxing    同一彩种两张图
     ② dlt/main   + dlt/wuxing    同一彩种两张图
     ③ pl3/main   + pl5/main
     ④ qxc/main   + qlc/main
     ⑤ fc3d/main  + kl8/main      （用户先说过「3D左边」，所以 3D 在左）

   彩种标题怎么处理：
     ③④⑤ 是「两个彩种」，容器放在【前一个彩种的区块内部】，
     两个 <section> 各自带着自己的 <h2> 一起进去 ⇒ 左右各有一个标题，一眼分得清。
     ①② 是「同一个彩种的两张图」，只把两个【图位】并排，
     <section> 和它的 <h2>「双色球」留在外面 ⇒ 标题只出现一次，不会重复。

   只做两件事：
     ① 建一个 .ro-imagepair 容器，把两张图的图位放进去（幂等）
     ② 重算 fit()：容器宽度变了，等比缩放的倍数得跟着重算
   ============================================================ */
(function () { /* __PAIR_V2__ 口口并排（验收脚本按这个标记提取这一段） */
  var PAIRS = [
    { left: 'ssq/main',   right: 'ssq/wuxing' },   /* ① 双色球：两张资料左右放 */
    { left: 'dlt/main',   right: 'dlt/wuxing' },   /* ② 大乐透：同上 */
    { left: 'pl3/main',   right: 'pl5/main'    },   /* ③ 排三 | 排五 */
    { left: 'qlc/main',   right: 'qxc/main'    },   /* ④ 七乐彩 | 七星彩（按用户布局图：七乐彩在左）*/
    { left: 'fc3d/main',  right: 'kl8/main'    }    /* ⑤ 3D（左） | 快乐8 */
  ];

  /* 按 (彩种, 图) 找那一个图位 —— 不用属性选择器拼字符串，
     直接比 dataset，属性顺序变了也不会失效。 */
  function wrapOf(gameId, imageKey) {
    var all = document.querySelectorAll('.ro-imagewrap');
    for (var i = 0; i < all.length; i++) {
      var w = all[i];
      if (w.getAttribute('data-game') === gameId &&
          w.getAttribute('data-image') === imageKey) return w;
    }
    return null;
  }
  /* 往上找最近的彩种区块（③④⑤ 要把整个 <section> 一起搬进去） */
  function sectionOf(node) {
    var n = node;
    while (n && n !== document.body) {
      if (n.className && String(n.className).split(/s+/).indexOf('ro-game') >= 0) return n;
      n = n.parentNode;
    }
    return null;
  }
  /* 这个图位是不是【已经在】某个并排容器里了？
     ⚠️ 必须一路往上找，不能只看 parentNode：
        ① ② 并排后图位的父节点就是 .ro-imagepair，
        但 ③④⑤ 搬的是整个 <section>，图位的父节点仍是 .ro-game ——
        只查 parentNode 会让 ③④⑤ 每跑一次就再套一层容器（实测会从 5 变 8）。 */
  function alreadyPaired(node) {
    var n = node ? node.parentNode : null;
    while (n && n !== document.body) {
      if (n.className && String(n.className).split(/s+/).indexOf('ro-imagepair') >= 0) return true;
      n = n.parentNode;
    }
    return false;
  }

  for (var p = 0; p < PAIRS.length; p++) {
    var li = PAIRS[p].left.split('/');
    var ri = PAIRS[p].right.split('/');
    var Lw = wrapOf(li[0], li[1]);
    var Rw = wrapOf(ri[0], ri[1]);
    /* 两个图位都得在，而且各自都还没被并排过（幂等；同一彩种只并排一次） */
    if (!Lw || !Rw || Lw === Rw) continue;
    if (alreadyPaired(Lw) || alreadyPaired(Rw)) continue;

    /* 容器插在【左边那张】原来的位置 */
    var box = document.createElement('div');
    box.className = 'ro-imagepair';
    box.setAttribute('data-pair', PAIRS[p].left + '+' + PAIRS[p].right);

    /* 同一个彩种（① ②）：只搬两个图位，<section> 和它的 <h2> 留在外面 */
    if (li[0] === ri[0]) {
      Lw.parentNode.insertBefore(box, Lw);
      box.appendChild(Lw);
      box.appendChild(Rw);
      continue;
    }

    /* 两个彩种（③ ④ ⑤）：把两整块 <section> 一起搬进来 —— 左右各自保留标题 */
    var Ls = sectionOf(Lw);
    var Rs = sectionOf(Rw);
    if (!Ls || !Rs || Ls === Rs) { box = null; continue; }
    Ls.parentNode.insertBefore(box, Ls);
    box.appendChild(Ls);
    box.appendChild(Rs);
  }

  /* 容器宽度变了 ⇒ 等比缩放倍数必须重算（__roFit 是上面那个 IIFE 暴露的 fit）。 */
  if (typeof window.__roFit === 'function') {
    window.__roFit();
    setTimeout(window.__roFit, 80);
    setTimeout(window.__roFit, 400);
  }
})();

/* 【点击放大】已按用户要求【移除】：用户原话「图片放大器还是不要了」。 */
</script>
</body>
