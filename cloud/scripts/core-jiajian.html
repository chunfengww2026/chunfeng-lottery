<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>核心算法 · 加减法 · 春风</title>
<style>
  :root { --bg:#f7efe1; --card:#fff; --border:#e8d7bd; --text:#4a3a26; --sub:#8a7a63; --green:#1a8c5a; --red:#c0392b; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif; }
  .wrap { max-width:820px; margin:0 auto; padding:12px; }
  h1 { font-size:17px; text-align:center; color:var(--green); margin:4px 0 10px; }
  .tabs { display:flex; background:#fff; border-radius:8px; padding:4px; border:1px solid var(--border); margin-bottom:10px; }
  .tab { flex:1; text-align:center; padding:9px 0; font-size:13.5px; font-weight:700; color:var(--sub); border-radius:6px; cursor:pointer; }
  .tab.on { background:var(--green); color:#fff; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:13px; margin-bottom:10px; }
  .title { font-size:14px; font-weight:700; margin-bottom:8px; border-left:4px solid var(--green); padding-left:8px; }
  .desc { font-size:11.5px; color:var(--sub); margin-bottom:8px; }
  .balls { display:flex; flex-wrap:wrap; gap:7px; margin-bottom:12px; }
  .ball { display:inline-flex; justify-content:center; align-items:center; width:31px; height:31px; border-radius:50%;
          font-size:13.5px; font-weight:700; color:#fff; background:radial-gradient(circle at 35% 30%,#ff6a5a,#d81e0e 70%); border:1px solid #b01408; }
  .ball.blue { background:radial-gradient(circle at 35% 30%,#5b93ff,#1244c4 70%); border-color:#0b2f92; }
  .ball.gold { background:linear-gradient(135deg,#ffd700,#daa520); color:#333; border:1px solid #b8860b; }
  .ball.silver { background:linear-gradient(135deg,#e0e0e0,#a9a9a9); color:#333; border:1px solid #888; }
  .ball.kill { background:#555; text-decoration:line-through; opacity:.55; }
  .ball.gray { background:#ccc; color:#333; }
  .info { font-size:11px; color:var(--sub); text-align:center; margin-top:6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>核心算法 · 交叉相加减</h1>
  <div class="tabs" id="tabs">
    <div class="tab on" data-g="ssq">双色球</div>
    <div class="tab" data-g="dlt">大乐透</div>
  </div>
  <div id="out"></div>
  <div class="info">按最近 3 期开奖 + 用户算法原样计算 · 仅供统计参考</div>
</div>
<script src="history.js"></script>
<script>
(function () {
  'use strict';
  var CFG = { ssq: { name:'双色球', max:33 }, dlt: { name:'大乐透', max:35 } };
  var st = { g:'ssq' };
  try {
    var m = (location.search || '').match(/[?&]g=(ssq|dlt)/);
    if (m) st.g = m[1];
  } catch (e) { }

  function pad(n) { return String(n).padStart(2, '0'); }
  function getUnit(n) { return Math.abs(n) % 10; }

  function hist(g) {
    try {
      var D = (typeof DRAW_HISTORY !== 'undefined') ? DRAW_HISTORY : null;
      return (D && D.games && D.games[g]) ? D.games[g] : [];
    } catch (e) { return []; }
  }
  function redsOf(d) {
    var a = (d && d.areas) || {};
    return (a.red || a.front || a.nums || []).map(Number);
  }

  /* 用户算法：A=上上期 / B=上期 / C=上上上期，推算下一期
     → 在 history 里：history[0]=最新(上期=B) history[1]=上上期(A) history[2]=上上上期(C) */
  function calc(g) {
    var list = hist(g);
    var c = CFG[g];
    if (list.length < 3) return { err: '历史数据不足（需 3 期）' };
    var B = redsOf(list[0]);
    var A = redsOf(list[1]);
    var C = redsOf(list[2]);
    if (!A.length || !B.length) return { err: '开奖数据为空' };
    var maxNum = c.max;
    var lastA = A.length - 1, lastB = B.length - 1;
    var idx6_A = A[lastA], idx6_B = B[lastB];
    var v = function (n) { return (n < 1 || n > maxNum) ? null : n; };

    /* ① 交叉相加减 */
    var pool1 = [];
    var put = function (x) { if (x !== null && x !== undefined) pool1.push(x); };
    put(v(getUnit(A[0] * B[1])));
    put(v(getUnit(A[0] * B[2])));
    put(v(A[0] + B[2]));
    put(v(A[0] + B[1]));
    put(v(A[0] + getUnit(B[1])));
    put(v(A[2] + getUnit(idx6_B)));
    put(v(A[3] - getUnit(idx6_B)));
    put(v(getUnit(A[3] - idx6_B)));
    put(v(getUnit(A[0] + idx6_B)));
    pool1 = pool1.filter(function (x, i, a) { return a.indexOf(x) === i; }).sort(function (a2, b2) { return a2 - b2; });

    /* ② 减法杀号 */
    var kills = [];
    for (var i = lastB - 1; i >= 0; i--) {
      kills.push(v(getUnit(idx6_B - B[i])));
      kills.push(v(idx6_B - B[i]));
    }
    for (var si = lastB; si > 0; si--) {
      for (var sj = si - 1; sj >= 0; sj--) kills.push(v(B[si] - B[sj]));
    }
    var sumUnit = B.reduce(function (acc, x) { return acc + getUnit(x); }, 0);
    kills.push(v(getUnit(sumUnit)));
    kills = kills.filter(function (x, i, a) { return x !== null && a.indexOf(x) === i; }).sort(function (a2, b2) { return a2 - b2; });

    /* ③ 金胆尾 / 银胆尾
       金胆尾 = 个位( 个位(A[2]-A[1]) + 个位(B[2]-B[1]) + 个位(A[2]-A[0]) + 个位(B[2]-B[0]) + 上上上期金胆尾 )
       ★ 上上上期的金胆尾：用 C 期和更早一期真实算出来（原版写死 3 ✗，这里修正 ✔） */
    var lastGold = 0;
    if (list.length >= 4) {
      var C1 = redsOf(list[2]), C2 = redsOf(list[3]);
      if (C1.length > 2 && C2.length > 2) {
        lastGold = getUnit(getUnit(C1[2] - C1[1]) + getUnit(C2[2] - C2[1]) + getUnit(C1[2] - C1[0]) + getUnit(C2[2] - C2[0]));
      }
    }
    var goldTail = getUnit(getUnit(A[2] - A[1]) + getUnit(B[2] - B[1]) + getUnit(A[2] - A[0]) + getUnit(B[2] - B[0]) + lastGold);
    var goldPool = [];
    for (var n1 = 1; n1 <= maxNum; n1++) if (getUnit(n1) === goldTail) goldPool.push(n1);

    var silverTail = getUnit(getUnit(B[0]) + getUnit(idx6_B));
    var silverPool = [];
    for (var n2 = 1; n2 <= maxNum; n2++) if (getUnit(n2) === silverTail) silverPool.push(n2);

    /* ④ 大乐透跨彩种绝杀尾（用双色球最近两期的首尾个位） */
    var dltKill = [];
    if (g === 'dlt') {
      var sl = hist('ssq');
      if (sl.length >= 2) {
        var s0 = redsOf(sl[0]), s1 = redsOf(sl[1]);
        if (s0.length && s1.length) {
          dltKill = [
            getUnit(getUnit(s1[0]) + getUnit(s1[s1.length - 1])),
            getUnit(getUnit(s0[0]) + getUnit(s0[s0.length - 1]))
          ];
        }
      }
    }

    /* ⑤ 汇总 + 排杀 */
    var final = pool1.concat(goldPool, silverPool).filter(function (x, i, a) { return a.indexOf(x) === i; });
    final = final.filter(function (n) {
      if (kills.indexOf(n) >= 0) return false;
      if (g === 'dlt' && dltKill.some(function (t) { return getUnit(n) === t; })) return false;
      return true;
    }).sort(function (a2, b2) { return a2 - b2; });

    /* ⑥ 不足 20 补齐（原版是随机补齐 ✗ → 这里按"最冷号"补齐 ✔ 可复现） */
    if (final.length < 20) {
      var rest = [];
      for (var n3 = 1; n3 <= maxNum; n3++) {
        if (final.indexOf(n3) < 0 && kills.indexOf(n3) < 0) rest.push(n3);
      }
      /* 用最近 6 期频次升序（最冷优先）当补齐顺序 ✔ */
      var freq = {};
      list.slice(0, 6).forEach(function (d) { redsOf(d).forEach(function (x) { freq[x] = (freq[x] || 0) + 1; }); });
      rest.sort(function (a2, b2) { return ((freq[a2] || 0) - (freq[b2] || 0)) || (a2 - b2); });
      for (var k = 0; k < rest.length && final.length < 20; k++) final.push(rest[k]);
      final.sort(function (a2, b2) { return a2 - b2; });
    }

    return {
      A: A, B: B, C: C, issueB: (list[0].issue || ''), issueA: (list[1].issue || ''),
      pool1: pool1, kills: kills, goldTail: goldTail, goldPool: goldPool,
      silverTail: silverTail, silverPool: silverPool, dltKill: dltKill, final: final
    };
  }

  function render() {
    var g = st.g, c = CFG[g];
    var r = calc(g);
    var out = document.getElementById('out');
    if (r.err) { out.innerHTML = '<div class="card">' + r.err + '</div>'; return; }
    var balls = function (arr, cls) {
      return arr.map(function (n) { return '<span class="ball ' + (cls || '') + '">' + pad(n) + '</span>'; }).join('');
    };
    var h = '';
    h += '<div class="card"><div class="title">🎯 最终 20 码推荐池（' + c.name + '）</div>' +
      '<div class="desc">推算 ' + (r.issueB ? '第 ' + r.issueB + ' 期之后' : '下一期') + ' · 已过滤杀号，不足 20 码自动补齐</div>' +
      '<div class="balls">' + balls(r.final) + '</div></div>';

    h += '<div class="card"><div class="title" style="color:var(--red)">🔪 核心杀号池（' + r.kills.length + ' 个）</div>' +
      '<div class="desc">上期 ' + (r.issueB || '') + ' 号码两两相减 + 个位和</div>' +
      '<div class="balls">' + balls(r.kills, 'kill') + '</div></div>';

    h += '<div class="card"><div class="title" style="color:#b8860b">👑 金胆尾 / 银胆尾</div>' +
      '<div class="desc">金胆尾 = <b>' + r.goldTail + '</b> 尾 · 银胆尾 = <b>' + r.silverTail + '</b> 尾</div>' +
      '<div style="display:flex;gap:12px">' +
      '<div style="flex:1"><div class="desc">金胆</div><div class="balls">' + balls(r.goldPool, 'gold') + '</div></div>' +
      '<div style="flex:1"><div class="desc">银胆</div><div class="balls">' + balls(r.silverPool, 'silver') + '</div></div>' +
      '</div></div>';

    if (g === 'dlt' && r.dltKill.length) {
      h += '<div class="card"><div class="title" style="color:#d35400">⚠️ 跨彩种绝杀尾</div>' +
        '<div class="desc">用双色球最近两期首尾个位推演，以下尾数全杀</div>' +
        '<div class="balls">' + r.dltKill.map(function (t) { return '<span class="ball kill" style="width:auto;padding:0 10px;border-radius:6px">尾 ' + t + '</span>'; }).join('') + '</div></div>';
    }

    h += '<div class="card"><div class="title">📐 第一步 · 交叉基础号（未排杀）</div>' +
      '<div class="desc">A（上上期 ' + (r.issueA || '') + '）=' + r.A.map(pad).join(' ') +
      ' · B（上期 ' + (r.issueB || '') + '）=' + r.B.map(pad).join(' ') + '</div>' +
      '<div class="balls">' + balls(r.pool1, 'gray') + '</div></div>';

    out.innerHTML = h;
    [].slice.call(document.querySelectorAll('#tabs .tab')).forEach(function (b) {
      b.classList.toggle('on', b.getAttribute('data-g') === st.g);
    });
  }

  document.getElementById('tabs').addEventListener('click', function (ev) {
    var b = ev.target.closest('.tab');
    if (!b) return;
    st.g = b.getAttribute('data-g');
    render();
  });
  render();
})();
</script>
</body>
</html>
