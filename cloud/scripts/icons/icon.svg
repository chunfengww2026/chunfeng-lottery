<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="春风大奖">
  <title>春风大奖</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="0.55" stop-color="#111620"/>
      <stop offset="1" stop-color="#080a0e"/>
    </linearGradient>
    <radialGradient id="warm" cx="0.42" cy="0.42" r="0.62">
      <stop offset="0" stop-color="#ff5a46" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ff5a46" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="1" cy="1" r="0.75">
      <stop offset="0" stop-color="#4682f6" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#4682f6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rr" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffb0a2"/>
      <stop offset="0.44" stop-color="#f23e36"/>
      <stop offset="1" stop-color="#8e121c"/>
    </linearGradient>
    <linearGradient id="rg" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#ffd9ae"/>
      <stop offset="0.44" stop-color="#f26a42"/>
      <stop offset="1" stop-color="#8e141b"/>
    </linearGradient>
    <linearGradient id="bb" x1="0" y1="0" x2="0.45" y2="1">
      <stop offset="0" stop-color="#c2e0ff"/>
      <stop offset="0.44" stop-color="#2f6feb"/>
      <stop offset="1" stop-color="#123492"/>
    </linearGradient>
    <radialGradient id="hl">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="113.7" ry="113.7"/>
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>
    <rect width="512" height="512" fill="url(#cool)"/>
    <rect width="512" height="512" fill="url(#warm)"/>

    <!-- 玻璃斜切高光 -->
    <polygon points="0,369 87,369 297,0 184,0" fill="#ffffff" opacity="0.055"/>
  </g>

  <!-- 三红一蓝：蓝球在后，中间那颗稍暖 -->
  <g>
    <circle cx="146" cy="300" r="121" fill="#0a0d13" opacity="0.42" transform="translate(5 28)"/>
    <circle cx="210" cy="182" r="85" fill="#0a0d13" opacity="0.38" transform="translate(4 22)"/>
    <circle cx="300" cy="164" r="85" fill="#0a0d13" opacity="0.38" transform="translate(4 22)"/>
    <circle cx="376" cy="220" r="85" fill="#0a0d13" opacity="0.38" transform="translate(4 22)"/>

    <circle cx="146" cy="300" r="125" fill="url(#bb)"/>
    <circle cx="210" cy="182" r="88" fill="url(#rr)"/>
    <circle cx="300" cy="164" r="88" fill="url(#rg)"/>
    <circle cx="376" cy="220" r="88" fill="url(#rr)"/>

    <ellipse cx="128" cy="150" rx="30" ry="22" fill="url(#hl)"/>
    <ellipse cx="196" cy="112" rx="21" ry="15" fill="url(#hl)"/>
    <ellipse cx="286" cy="94" rx="21" ry="15" fill="url(#hl)"/>
    <ellipse cx="362" cy="150" rx="21" ry="15" fill="url(#hl)"/>

    <circle cx="210" cy="240" r="11" fill="#ffffff" opacity="0.24"/>
    <circle cx="300" cy="222" r="11" fill="#ffffff" opacity="0.24"/>
    <circle cx="376" cy="278" r="11" fill="#ffffff" opacity="0.24"/>
  </g>

  <rect x="1" y="1" width="510" height="510" rx="113" ry="113" fill="none"
        stroke="#ffffff" stroke-opacity="0.10" stroke-width="2"/>
</svg>
