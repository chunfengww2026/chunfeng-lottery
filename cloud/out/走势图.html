/* ============================================================
   trend-render.js —— 走势图渲染内核（页面 + 验收脚本共用）
   ------------------------------------------------------------
   这份文件【只被读取、被内嵌】，本身不会被 <\/script src> 引用，所以：
     · 不用 import / export，纯全局函数，页面里直接可用
     · 迷你 DOM 验收里用 vm.runInContext 直接跑同一份文件
   只做纯函数：给同一份 payload，永远出同一段 HTML。
   ============================================================ */

/* 单区统计：出现次数 / 当前遗漏 / 最大遗漏
   遗漏 = 从最新一期往回数，连续多少期没出现（0 = 最新一期就开了）。
   数字型彩种（positional）按"位"统计：某位等于该数字就算开出。 */
function trAreaStats(series, nCols, lo) {
  const out = [];
  const periods = series.length;
  for (let i = 0; i < nCols; i++) {
    const want = lo + i;
    const hits = series.map((arr) => arr.filter((v) => v === want).length);
    const freq = hits.reduce((a, b) => a + b, 0);
    let gap = 0;
    for (let k = periods - 1; k >= 0; k--) { if (hits[k] > 0) break; gap++; }
    let maxGap = 0, cur = 0;
    for (let k = 0; k < periods; k++) { if (hits[k] > 0) { cur = 0; } else { cur++; if (cur > maxGap) maxGap = cur; } }
    out.push({ n: want, freq, gap, maxGap });
  }
  return out;
}

function trEsc(s) {
  return String(s).replace(/[&<>"]/g, (m) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[m]));
}

/* ============================================================
   【走势连线】命中序列 —— 哪些期开了这个号
   ------------------------------------------------------------
   用户 2026-10-17 要求：「加走势连线」（先做双色球 + 大乐透）。
   传统走势图的样子：同一个号码跨期用线连起来。
   ⚠️ 号码【本身带对子】（按位彩种会出现 2,8,7 这种重复）——所以用
      Set 去重。(n + 1) 是为了让返回值能区分"没开"(0) 和"开了"(1)，
      直接返回布尔数组也可以，但数字数组在验收脚本里更好断言。
   ============================================================ */

/* ============================================================
   【连线数据】纯计算，不碰 DOM
   ------------------------------------------------------------
   给"某号码在各期是否命中"的 0/1 序列，算出要画的线段。
   约定：把每一行看成一个单位高度，行 r 的圆心在 y = r + 0.5。
     · 相邻两期都开（r、r+1）→ 一条竖线，从 r+0.5 连到 r+1.5
     · 中间隔了 gap 期没开     → 从圆心各自伸出一个"短线头"，
                                 长度 = 半个行高（0.45），看起来像虚线趋势
   这样【绝不在没开的期上画线】——线只表示"这个号连续出现的区间"。
   ============================================================ */
/* ============================================================
   【连线数据】纯计算，不碰 DOM
   ------------------------------------------------------------
   给"某号码在各期是否命中"的 0/1 序列，算出要画的线段。
   约定：每一行是一个单位高度，行 r 的圆心在 y = r + 0.5。

   ⚠️ 这里改过一版（实测截图才发现问题）：
      第一版画的是"短线头"—— 每个命中点上下各出一小段 0.45。
      截图一看全是碎毛刺，而且【相邻两期的两个短线头之间是虚的】，
      但相邻两期本来就该是实线连着。是我设计错了。
      现在改成传统走势图的标准画法：
        · 同一个号码，从它【首次出现】一直连到【末次出现】
        · 相邻两期都开 → 实线（连续走势）
        · 中间隔着遗漏   → 虚线（跨过没开的期，一眼能看出断了）
      这样每条线是完整的一条走势，不再是碎点。
   ============================================================ */
function trSegmentsFor(series) {
  const hitRows = [];
  series.forEach((v, r) => { if (v) hitRows.push(r); });
  if (hitRows.length < 2) return [];      /* 只出现过一期 → 连不起来，不画 */
  const segs = [];
  for (let i = 1; i < hitRows.length; i++) {
    const a = hitRows[i - 1];
    const b = hitRows[i];
    segs.push({
      y1: a + 0.5,
      y2: b + 0.5,
      solid: (b - a === 1)                 /* 紧邻 → 实线；有遗漏 → 虚线 */
    });
  }
  return segs;
}

/* 所有列的命中序列一次算出来（避免每个号码都重扫一遍 → O(列²)）。
   返回 { [列号]: [0/1, ...] }，长度 = 期数。 */
function trHitSeriesAll(rows, lo, hi) {
  const nCols = hi - lo + 1;
  const series = [];
  for (let i = 0; i < nCols; i++) series.push(new Array(rows.length).fill(0));
  rows.forEach((r, ri) => {
    const seen = new Set();
    (r || []).forEach((v) => {
      const idx = v - lo;
      if (idx >= 0 && idx < nCols) seen.add(idx);   /* 去重：号码本身带对子 */
    });
    seen.forEach((idx) => { series[idx][ri] = 1; });
  });
  return series;
}

/* 一条线路的整体数据（号码 + 连线 + 出现期数） */
function trTrendLines(payload, gameId, opts) {
  const o = opts || {};
  const game = (payload.games || []).filter((g) => g.id === gameId)[0];
  if (!game) return null;
  const rows = game.rows || [];
  const pick = (arrFn, lo, hi, cls) => {
    if (hi < lo) return [];
    const series = trHitSeriesAll(rows.map(arrFn), lo, hi);
    const lines = [];
    series.forEach((s, i) => {
      const count = s.reduce((a, b) => a + b, 0);
      if (!count) return;                         /* 一期都没开过的号不画线 */
      lines.push({ n: lo + i, cls, count, segs: trSegmentsFor(s) });
    });
    return lines;
  };
  return {
    game: gameId,
    rows: rows.length,
    main: pick((r) => r.nums, game.main.lo, game.main.hi, 'main'),
    extra: game.extra ? pick((r) => r.extra, game.extra.lo, game.extra.hi, 'extra') : []
  };
}

/* ============================================================
   【斜连】用户 2026-10-17 给了两条规则（原话，第二条更严格）：

   ① 普通斜连：上期 a、本期 b，|a - b| === 1 → 可连线

   ② 隔号斜连（用户第二次给的、更严格的定义）：
        001期开1 → 002期开2 → 003期空 → 004期开4
        步长=1，间隔=2（中间空了1期），从1到4共经历3期，差值3=1+2
      代码要求：
        · j 从 i+2 起（gap ≥ 2，真间隔；相邻期不算）
        · 【中间期必须没开"这个方向的号"】：
            期望 = a + (k-i) * (b>a ? 1 : -1)
            中间任何一期开了这个期望号 → 这条不算
          （即"中间被走过"的不算，只留真正跨过去的）
        · maxGap 默认 3

   ⚠️ 为什么一定要用户这个严格版（实测量级，30 期真实数据）：
        宽松版（谁跟谁差 N 就连）：双色球 573 / 快乐8 3477 条  → 糊
        严格版（隔号+中间不许走过）：双色球 107 / 快乐8 471 条 → 能用
      差了约 8 倍。所以间隔斜连【就用严格版】，宽松那版不再使用。

   ⚠️ 只在【同一个区】内连（红球连红球、蓝球连蓝球）：跨区连线没有意义。
   ============================================================ */

/** gap = 1 的普通斜连 */
function trSlantAdjacent(draws) {
  const rows = Array.isArray(draws) ? draws : [];
  const out = [];
  for (let i = 0; i + 1 < rows.length; i++) {
    const from = rows[i] || [], to = rows[i + 1] || [];
    for (let x = 0; x < from.length; x++) {
      for (let y = 0; y < to.length; y++) {
        if (Math.abs(from[x] - to[y]) === 1) {
          out.push({ i, j: i + 1, a: from[x], b: to[y], gap: 1, type: 'slant' });
        }
      }
    }
  }
  return out;
}

/**
 * 隔号斜连（用户的严格定义）。
 * @param {Array<Array<number>>} draws
 * @param {number} maxGap 最大相隔期数，默认 3
 *
 * ⚠️ 这里【故意偏离】了用户给的那行循环一个细节，说明清楚：
 *      用户写的是  j <= Math.min(i + maxGap + 1, …)
 *      那个 `+1` 会让 maxGap 比名字多放一期：maxGap=2 时 gap=3 也进得来
 *      （实测：maxGap=2 → [[1],[],[],[4]] 仍出 gap=3；maxGap=3 会出 gap=4）。
 *      按"maxGap = 最大相隔期数"的直觉，这里用 j <= i + maxGap，让
 *      maxGap 严格等于上限。若哪天要退回用户那版字面语义，把 bound 改成
 *      `Math.min(i + mg + 1, rows.length - 1)` 即可。
 */
function trSlantGap(draws, maxGap) {
  const rows = Array.isArray(draws) ? draws : [];
  const mg = maxGap == null ? 3 : maxGap;
  const results = [];
  for (let i = 0; i < rows.length; i++) {
    const bound = Math.min(i + mg, rows.length - 1);
    for (let j = i + 2; j <= bound; j++) {
      const gap = j - i;
      const from = rows[i] || [], to = rows[j] || [];
      for (let x = 0; x < from.length; x++) {
        for (let y = 0; y < to.length; y++) {
          const a = from[x], b = to[y];
          if (Math.abs(a - b) !== gap) continue;
          /* 中间任何一期开了"这个方向的期望号" → 这条不算 */
          let hasMiddle = false;
          for (let k = i + 1; k < j; k++) {
            const expected = a + (k - i) * (b > a ? 1 : -1);
            if ((rows[k] || []).indexOf(expected) >= 0) { hasMiddle = true; break; }
          }
          if (!hasMiddle) {
            results.push({
              i, j, a, b, gap, type: 'gapSlant',
              step: Math.abs(b - a) / gap       /* 步长（严格版恒为 1，留着便于核对） */
            });
          }
        }
      }
    }
  }
  return results;
}

/**
 * 检测斜连（普通 + 可选隔号）。
 * @param {Array<Array<number>>} draws 每期号码（按期号正序：旧 → 新）
 * @param {object} o { includeGapSlant, maxGap }
 */
function trSlantLines(draws, o) {
  const opt = o || {};
  const out = trSlantAdjacent(draws);
  if (opt.includeGapSlant) {
    out.push(...trSlantGap(draws, opt.maxGap));
  }
  return out;
}

/** 某个彩种要连的斜连（主场 + 第二区各自算，不跨区） */
function trSlantFor(payload, gameId, opts) {
  const o = opts || {};
  const game = (payload.games || []).filter((g) => g.id === gameId)[0];
  if (!game) return null;
  const main = trSlantLines(game.rows.map((r) => r.nums), o).map((x) => ({ ...x, cls: 'main' }));
  const extra = game.extra
    ? trSlantLines(game.rows.map((r) => r.extra), o).map((x) => ({ ...x, cls: 'extra' }))
    : [];
  return { game: gameId, main, extra, all: main.concat(extra) };
}

/* 渲染整块：彩种切换条 + 8 张走势表 + 图例 */
function renderTrendHtml(payload) {
  const esc = trEsc;
  const games = payload.games;
  const L = [];

  /* ① 彩种切换条 */
  L.push('<div class="tr-tabs" role="tablist" aria-label="彩种切换">');
  games.forEach((g, i) => {
    L.push('<a class="tr-tab' + (i === 0 ? ' on' : '') + '" href="#g=' + esc(g.id) +
      '" data-tr-tab="' + esc(g.id) + '">' + esc(g.name) + '</a>');
  });
  L.push('</div>');

  /* ② 每个彩种一块 */
  games.forEach((g) => {
    const rows = g.rows;
    const nCols = g.main.hi - g.main.lo + 1;
    const exCols = g.extra ? (g.extra.hi - g.extra.lo + 1) : 0;
    const withExtra = exCols > 0;

    L.push('<section class="tr-block" id="' + esc(g.id) + '" data-tr-block="' + esc(g.id) + '">');
    L.push('<div class="tr-preseltool" data-tr-preseltool="' + esc(g.id) + '"></div><div class="tr-head">');
    L.push('<h2 class="tr-title">' + esc(g.name) + ' · 走势图</h2>');
    L.push('<div class="tr-sub">最近 <b>' + rows.length + '</b> 期 · 期号 <b>' + esc(rows[0].issue) +
      '</b> → <b>' + esc(rows[rows.length - 1].issue) + '</b> · 每期 ' + g.main.pick + ' 个' +
      esc(g.main.label) + (g.extra ? ' + ' + g.extra.pick + ' 个' + esc(g.extra.label) : '') + '</div>');
    L.push('</div>');

    L.push('<div class="tr-scroll">');
    L.push('<table class="tr-table" data-tr-table="' + esc(g.id) + '">');

    /* 表头：期号 + 号码列（+ 第二区）+ 开出 */
    L.push('<thead><tr>');
    L.push('<th class="tr-th-issue tr-sticky">期号</th>');
    for (let n = g.main.lo; n <= g.main.hi; n++) {
      L.push('<th class="tr-th-num' + (g.main.positional ? ' tr-th-pos' : '') + '">' + n + '</th>');
    }
    if (withExtra) {
      L.push('<th class="tr-th-sep" aria-label="' + esc(g.extra.label) + '"></th>');
      for (let n = g.extra.lo; n <= g.extra.hi; n++) {
        L.push('<th class="tr-th-num tr-th-extra">' + n + '</th>');
      }
    }
    L.push('<th class="tr-th-tail">开出</th>');
    L.push('</tr></thead>');

    /* 表体：每期一行 */
    L.push('<tbody>');
    rows.forEach((r, ri) => {
      const isLast = ri === rows.length - 1;
      /* 数字型彩种按【位】标记：重复号码各算一格（例如 2,8,7） */
      const hitMain = new Array(nCols).fill(0);
      r.nums.forEach((v) => { const idx = v - g.main.lo; if (idx >= 0 && idx < nCols) hitMain[idx]++; });
      const hitExtra = new Array(exCols).fill(0);
      if (withExtra) r.extra.forEach((v) => { const idx = v - g.extra.lo; if (idx >= 0 && idx < exCols) hitExtra[idx]++; });

      L.push('<tr class="tr-row' + (isLast ? ' tr-row-last' : '') + '" data-tr-issue="' + esc(r.issue) + '">');
      L.push('<td class="tr-td-issue tr-sticky"><b>' + esc(r.issue) + '</b><i>' +
        esc(String(r.date).slice(5)) + '</i></td>');
      for (let i = 0; i < nCols; i++) {
        const c = hitMain[i];
        L.push('<td class="tr-td-num' + (c ? ' on' : '') + '" data-tr-hit="' + c + '">' +
          /* 【背景板号数】用户 2026-10-17：每格印上该列号数（很浅），不用抬头看表头 */
          '<i class="tr-ghost">' + (g.main.lo + i) + '</i>' +
          (c ? '<s></s>' : '') + '</td>');
      }
      if (withExtra) {
        L.push('<td class="tr-td-sep"></td>');
        for (let i = 0; i < exCols; i++) {
          const c = hitExtra[i];
          L.push('<td class="tr-td-num tr-td-extra' + (c ? ' on' : '') + '" data-tr-zone="x" data-tr-hit="' + c + '">' +
            '<i class="tr-ghost">' + (g.extra.lo + i) + '</i>' +
            (c ? '<s></s>' : '') + '</td>');
        }
      }
      /* 行尾：本期原始开奖号（数字型彩种用它看"位"的顺序） */
      const tail = g.main.positional
        ? r.nums.join('')
        : (r.nums.slice().sort((a, b) => a - b).join(' ') + (withExtra ? ' + ' + r.extra.join(' ') : ''));
      L.push('<td class="tr-td-tail">' + esc(tail) + '</td>');
      L.push('</tr>');
    });
    L.push(__trPreselRow(g) + '</tbody>');

    /* 表尾：出现次数 / 当前遗漏 / 最大遗漏 */
    const stats = trAreaStats(rows.map((r) => r.nums), nCols, g.main.lo);
    const xstats = withExtra ? trAreaStats(rows.map((r) => r.extra), exCols, g.extra.lo) : null;
    L.push('<tfoot>');
    L.push('<tr class="tr-freq"><td class="tr-tf-label tr-sticky">出现次数</td>');
    stats.forEach((s) => L.push('<td class="tr-td-freq">' + s.freq + '</td>'));
    if (withExtra) {
      L.push('<td class="tr-td-sep"></td>');
      xstats.forEach((s) => L.push('<td class="tr-td-freq tr-td-extra">' + s.freq + '</td>'));
    }
    L.push('<td class="tr-td-tail"></td></tr>');
    L.push('<tr class="tr-gap"><td class="tr-tf-label tr-sticky">当前遗漏</td>');
    stats.forEach((s) => L.push('<td class="tr-td-gap' + (s.gap === 0 ? ' zero' : '') + '">' + s.gap + '</td>'));
    if (withExtra) {
      L.push('<td class="tr-td-sep"></td>');
      xstats.forEach((s) => L.push('<td class="tr-td-gap tr-td-extra' + (s.gap === 0 ? ' zero' : '') + '">' + s.gap + '</td>'));
    }
    L.push('<td class="tr-td-tail"></td></tr>');
    L.push('<tr class="tr-maxgap"><td class="tr-tf-label tr-sticky">最大遗漏</td>');
    stats.forEach((s) => L.push('<td class="tr-td-gap">' + s.maxGap + '</td>'));
    if (withExtra) {
      L.push('<td class="tr-td-sep"></td>');
      xstats.forEach((s) => L.push('<td class="tr-td-gap tr-td-extra">' + s.maxGap + '</td>'));
    }
    L.push('<td class="tr-td-tail"></td></tr>');
    L.push('</tfoot>');

    L.push('</table></div>');
    L.push('<div class="tr-note">横轴 = ' + esc(g.main.label) + '号码 ' + g.main.lo + '~' + g.main.hi +
      (withExtra ? ' · 右侧 ' + esc(g.extra.label) + ' ' + g.extra.lo + '~' + g.extra.hi : '') +
      ' · 纵轴 = 期号（越往下越新）· 米色格 = 该期开出' +
      (g.main.positional ? '（数字型按"位"标记，重复号码各算一次）' : '') + '</div>');
    L.push('</section>');
  });

  /* ③ 图例 */
  L.push('<div class="tr-legend">');
  L.push('<span><i class="tr-lg-on"></i>该期开出</span>');
  L.push('<span><i class="tr-lg-last"></i>最新一期</span>');
  L.push('<span><i class="tr-lg-gap"></i>当前遗漏 = 0（刚开过）</span>');
  L.push('</div>');
  return L.join('');
}


/* ===== build-trend.mjs 注入：预选行（运行时拼 HTML） ===== */
function __trMainCells(g) {
  var o = [];
  for (var i = g.main.lo; i <= g.main.hi; i++) {
    o.push('<td class="tr-td-presel tr-td-num" data-tr-presel="m" data-tr-key="' + (i - g.main.lo) + '" data-tr-hit="0"></td>');
  }
  return o.join('');
}
function __trExtraCells(g) {
  var o = [];
  if (!g.extra) return '';
  for (var i = g.extra.lo; i <= g.extra.hi; i++) {
    o.push('<td class="tr-td-presel tr-td-num is-extra" data-tr-presel="x" data-tr-key="' + (i - g.extra.lo) + '" data-tr-hit="0"></td>');
  }
  return o.join('');
}
var __TREND_PRESEL_ROW__ = '';
var __TREND_PRESEL_EXTRA__ = '';
function __trPreselRow(g) {
  return '<tr class="tr-row-presel tr-row" data-tr-issue="__presel__" data-tr-presel-row="' + g.id + '">' +
    '<td class="tr-td-issue tr-sticky tr-td-presel" data-tr-presel="label">预选</td>' +
    __trMainCells(g) + __trPreselExtra(g) + '<td class="tr-td-tail"></td></tr>';
}
function __trPreselExtra(g) {
  return g.extra ? ('<td class="tr-td-sep"></td>' + __trExtraCells(g)) : '';
}


/* ============================================================
   trend-mount.js —— 走势图页面的挂载 + 彩种切换
   ------------------------------------------------------------
   被 build-trend.mjs 内嵌进页面 <\/script>（readText 后注入），
   所以这里是普通脚本（无 import/export）。
   依赖页面里先有：TREND_DATA、renderTrendHtml。
   ============================================================ */
(function () {
  var root = document.getElementById('tr-root');
  root.innerHTML = renderTrendHtml(TREND_DATA);

  /* querySelectorAll 返回的是 NodeList，只有 forEach 没有 some/filter/slice。
     最初直接写 tabs.some(...) → 带 ?g= 深链时抛
     "tabs.some is not a function"，后面的"隐藏其它块 / 写标题"全没执行，
     表现成"深链失效、8 块全露"（实测踩过）。统一转成真数组。 */
  var toArr = function (nl) { return Array.prototype.slice.call(nl); };

  /* ============================================================
     【走势连线】把同一个号码跨期的绿点连起来
     ------------------------------------------------------------
     用户 2026-10-17 要求：「加走势连线」，先做双色球 + 大乐透。
     为什么放在挂载层而不是渲染层：
       连线要靠【真实单元格坐标】才能画准（吸住的期号列、每列宽度、
       手机上的缩放都会影响）。渲染层只出纯 HTML，量不到坐标；
       这里先用 getBoundingClientRect 量出每格中心，再画 SVG。
     ⚠️ 取不到坐标的环境（迷你 DOM 验收脚本里 rect 全是 0）→ 直接跳过，
        绝不因此抛异常。连线的【数据】另在 trend-render.js 里算，
        那部分是纯函数、能脱离浏览器单测。
     ============================================================ */

  /* ============================================================
     【走势连线】把同一个号码跨期的绿点连起来
     ------------------------------------------------------------
     用户 2026-10-17 要求：「加走势连线」，先做双色球 + 大乐透。
     为什么放在挂载层而不是渲染层：
       连线要靠【真实单元格坐标】才能画准（吸住的期号列、每列宽度、
       手机缩放都会影响）。渲染层只出纯 HTML，量不到坐标；
       这里先量出每格中心，再画 SVG 覆盖层。
     ⚠️ 量不到坐标就直接跳过（迷你 DOM 验收里 rect 全是 0），绝不抛异常、
        也绝不靠公式猜坐标 —— 宁可这条线不画，也不画错位置。
     ⚠️ 哪些号要连、连哪几期，是 trend-render.js 里的【纯函数】算的，
        那部分能脱离浏览器单测。
     ============================================================ */
  var SVGNS = 'http://www.w3.org/2000/svg';

  /* ============================================================
     【斜连】用户给了两条规则：
       ① 普通斜连：|a-b| = 1（相邻期）
       ② 隔号斜连：隔 gap 期、|a-b| = gap，且【中间期没开过这个方向的号】
          （001开1 → 002开2 → 003空 → 004开4 才算；中间开过就不算）
     ⚠️ 实测量级（30 期真实数据）：
         宽松版（不查中间）  双色球 573 / 快乐8 3477 条 → 糊
         严格版（隔号）      双色球 107 / 快乐8  471 条 → 能用
       所以做三档，默认【只画差1】：
         off   = 不画
         slant = 只画差 1（默认）
         gap   = 差 1 + 隔号斜连
     ============================================================ */
  var SLANT_MODES = ['off', 'slant', 'gap'];
  var SLANT_LABEL = { off: '斜连：关', slant: '斜连：差1', gap: '斜连：差1+隔号' };
  var slantMode = 'slant';

  function drawTrendLines(block) {
    var gid = block.getAttribute("data-tr-block");
    var game = null;
    (TREND_DATA.games || []).forEach(function (g) { if (g.id === gid) game = g; });
    if (!game) return 0;

    var table = block.querySelector("[data-tr-table]");
    if (!table || !table.querySelectorAll || !table.getBoundingClientRect) return 0;
    var box = table.getBoundingClientRect();
    if (!box || !box.width || !box.height) return 0;   /* 量不到 → 跳过 */

    /* 先清掉上一次画的覆盖层：切换彩种/切换斜连都会重画，不清就会越叠越多层。 */
    if (block.querySelectorAll) {
      toArr(block.querySelectorAll("svg.tr-lines")).forEach(function (old) {
        if (old.parentNode && old.parentNode.removeChild) old.parentNode.removeChild(old);
      });
    }

    /* ① 量每一行的号码格中心。只存量得到的格子（宽高为 0 的一律不算），
         所以后面查不到就是查不到 → 跳过，不用任何公式猜。 */
    var trs = toArr(table.querySelectorAll("[data-tr-issue]"));
    var map = {};
    trs.forEach(function (tr, ri) {
      toArr(tr.querySelectorAll("[data-tr-hit]")).forEach(function (td, ci) {
        var r = td.getBoundingClientRect();
        if (!r || !r.width || !r.height) return;
        map[ri + "," + ci] = {
          x: r.left - box.left + r.width / 2,
          y: r.top - box.top + r.height / 2
        };
      });
    });
    if (!Object.keys(map).length) return 0;

    /* ② 算连线数据（纯函数）。extra 区紧跟在主场号码之后，中间隔 1 个分隔格。 */
    var data = trTrendLines(TREND_DATA, gid);
    if (!data) return 0;
    var mainCols = game.main.hi - game.main.lo + 1;
    /* ⚠️ 列号换算踩过一次坑，写清楚：
       map 的列号来自 tr.querySelectorAll("[data-tr-hit]")，它【只数号码格】——
       那个分隔格（.tr-td-sep）没有 data-tr-hit，不占编号。
       所以：
         主场 n（lo..hi） → 列号 n - lo                （0 .. mainCols-1）
         分隔格           → 不在编号里
         第二区 n         → 列号 mainCols + (n - lo)    （mainCols .. mainCols+exCols-1）
       第一版我在第二区上多加了 1（mainCols + 1 + …），结果第二区最后一个号
       算出 49、而实际只有 0..48 → 那一条竖向线永远画不出来，
       连带两条隔号斜连也画不出（实测：竖向 162→161、隔号 93→91）。
       行尾还有一格"开出"(.tr-td-tail)，但它也没有 data-tr-hit，同样不占编号。 */
    var colOf = function (line) {
      if (line.cls === "extra") return mainCols + (line.n - game.extra.lo);
      return line.n - game.main.lo;
    };

    /* ③ 画：每条线是一串竖线；相邻两期都有 → 实线，断开的 → 短线头 */
    var svg = document.createElementNS(SVGNS, "svg");
    svg.setAttribute("class", "tr-lines");
    svg.setAttribute("data-tr-lines", gid);
    svg.setAttribute("width", String(box.width));
    svg.setAttribute("height", String(box.height));
    svg.setAttribute("viewBox", "0 0 " + box.width + " " + box.height);
    svg.setAttribute("aria-hidden", "true");

    var segCount = 0;
    data.main.concat(data.extra).forEach(function (line) {
      var ci = colOf(line);
      line.segs.forEach(function (sg) {
        var a = map[Math.floor(sg.y1) + "," + ci];
        var b = map[Math.ceil(sg.y2 - 1) + "," + ci];
        if (!a || !b) return;          /* 缺一格就不画这一段，不猜 */
        var el = document.createElementNS(SVGNS, "line");
        el.setAttribute("x1", a.x.toFixed(1));
        el.setAttribute("y1", a.y.toFixed(1));
        el.setAttribute("x2", b.x.toFixed(1));
        el.setAttribute("y2", b.y.toFixed(1));
        el.setAttribute("class", "tr-line tr-line-" + line.cls + (sg.solid ? "" : " tr-line-gap"));
        svg.appendChild(el);
        segCount++;
      });
    });

    /* ③b 斜连（用户规则：|a-b| === 相隔期数）。用不同颜色区分开。 */
    if (slantMode !== "off") {
      var sl = trSlantFor(TREND_DATA, gid, { includeGapSlant: slantMode === "gap" });
      if (sl) {
        /* ⚠️ 和上面 colOf 同一个口径：第二区【不加分隔格那 1 列】，
           因为 map 的列号只数 data-tr-hit（分隔格没有它）。 */
        var colOfNum = function (n, cls) {
          if (cls === "extra") return mainCols + (n - game.extra.lo);
          return n - game.main.lo;
        };
        sl.all.forEach(function (L) {
          /* 点名：第 i 期在自己列里命中 a、第 j 期命中 b（斜着差 gap 格） */
          var ca = colOfNum(L.a, L.cls), cb = colOfNum(L.b, L.cls);
          var ra = map[L.i + "," + ca], rb = map[L.j + "," + cb];
          /* 同列（a === b，gap 不可能为 0 所以不会发生）跳过；缺格跳过 */
          if (!ra || !rb) return;
          var el = document.createElementNS(SVGNS, "line");
          el.setAttribute("x1", ra.x.toFixed(1));
          el.setAttribute("y1", ra.y.toFixed(1));
          el.setAttribute("x2", rb.x.toFixed(1));
          el.setAttribute("y2", rb.y.toFixed(1));
          el.setAttribute("class", "tr-line tr-slant tr-slant-" + L.type + " tr-slant-" + L.cls);
          el.setAttribute("data-tr-slant-gap", String(L.gap));
          svg.appendChild(el);
          segCount++;
        });
      }
    }
    if (!segCount) return 0;

    /* 放进 .tr-scroll（定位参考层），跟着表格横向滚动 */
    var host = table.parentNode || block;
    if (!host.appendChild) return 0;
    host.appendChild(svg);
    return segCount;
  }

  var blocks = toArr(root.querySelectorAll("[data-tr-block]"));
  var tabs = toArr(root.querySelectorAll("[data-tr-tab]"));

  /* 当前显示的是哪个彩种（斜连开关切换时要知道该重画哪一个） */
  var curId = null;

  /* ============================================================
     斜连开关（点一下换一档：关 → 差1 → 含间隔 → 关 …）
     ------------------------------------------------------------
     为什么必须做成开关：实测量级差太大 ——
       只画差1：双色球 92 条（好看）
       连间隔一起：快乐8 3477 条（糊成一团）
     所以默认「差1」，用户想看更全的自己点。
     ============================================================ */
  var slantBtn = null;
  function paintSlantBtn() {
    if (!slantBtn) return;
    slantBtn.textContent = SLANT_LABEL[slantMode];
    slantBtn.setAttribute("data-tr-slant-mode", slantMode);
    var on = slantMode !== "off";
    slantBtn.className = "tr-slantbtn" + (on ? " on" : "");
  }
  function cycleSlant() {
    var k = SLANT_MODES.indexOf(slantMode);
    slantMode = SLANT_MODES[(k + 1) % SLANT_MODES.length];
    paintSlantBtn();
    /* 重画当前这块（档位变了，线要重算） */
    if (curId) drawOne(curId);
    else drawAll();
  }

  /* 画连线；线条数报到块上（data-tr-lines），验收脚本可直接读。
     单块失败不影响别的块，也不影响彩种切换。 */
  function drawAll() {
    blocks.forEach(function (b) {
      try {
        var n = drawTrendLines(b);
        if (n) b.setAttribute("data-tr-lines", String(n));
      } catch (e) { /* 忽略：画不出线不影响页面功能 */ }
    });
  }

  /* ⚠️ 隐藏的块量不到坐标 → 初始只画了【当前显示】的那一块。
     所以每次切换都要给刚显示出来的块补画一次（实测：不补的话，
     切到大乐透就是一片空白没有连线，但块上却写着 data-tr-lines）。
     已经画过的块再调一次是安全的：drawTrendLines 会先清掉旧的覆盖层。 */
  function drawOne(id) {
    blocks.forEach(function (b) {
      if (b.getAttribute("data-tr-block") !== id) return;
      try {
        var n = drawTrendLines(b);
        if (n) b.setAttribute("data-tr-lines", String(n));
      } catch (e) { /* 忽略 */ }
    });
  }

  drawAll();

  /* ============================================================
     斜连开关（点一下换一档：关 → 差1 → 含间隔 → 关 …）
     ------------------------------------------------------------
     为什么必须做成开关：实测量级差太大 ——
       只画差1：双色球 92 条（好看）
       连间隔一起：快乐8 3477 条（糊成一团）
     所以默认「差1」，用户想看更全的自己点。
     ⚠️ 顺序：必须等 drawAll/drawOne 都定义好再建按钮、绑事件。
     ============================================================ */
  var slantBtn = null;
  function paintSlantBtn() {
    if (!slantBtn) return;

    if (PTR) {
      host.addEventListener('pointerdown', function (ev) { onDown(block, ev); }, { passive: false });
      host.addEventListener('pointermove', function (ev) { onMove(block, ev); }, { passive: false });
      host.addEventListener('pointerup', function (ev) { onUp(block, ev); });
      host.addEventListener('pointercancel', function (ev) { onUp(block, ev); });
    } else if (hasTouch()) {
      /* ⚠️ 只认触摸的机器（老 Android / 老 iOS WebView）：只绑 touch，
         再绑一套 mouse 会和触摸补发的 mousedown/mouseup/click 撞车。 */
      host.addEventListener('touchstart', function (ev) { onDown(block, ev.touches && ev.touches[0] || ev); }, { passive: false });
      host.addEventListener('touchmove', function (ev) { onMove(block, ev.touches && ev.touches[0] || ev); }, { passive: false });
      host.addEventListener('touchend', function (ev) { onUp(block, ev); });
      host.addEventListener('touchcancel', function (ev) { onUp(block, ev); });
    } else {
      host.addEventListener('mousedown', function (ev) { onDown(block, ev); });
      host.addEventListener('mousemove', function (ev) { onMove(block, ev); });
      host.addEventListener('mouseup', function (ev) { onUp(block, ev); });
    }
  });

  /* 移动端：手画到表格外也要收笔（否则线会一直粘着手指） */
  if (typeof window !== 'undefined' && window.addEventListener) {
    var endAll = function () { if (drag) onUp(drag.block); };
    window.addEventListener('pointerup', endAll);
    window.addEventListener('pointercancel', endAll);
    if (!hasPointer()) {
      window.addEventListener('mouseup', endAll);
      window.addEventListener('touchend', endAll);
      window.addEventListener('touchcancel', endAll);
    }
  }

  /* ============================================================
     ⑤ 事件委托：工具栏按钮 + 预选行点选
     ------------------------------------------------------------
     ⚠️ 用委托（不是每格绑定）：
        · 预选行格子很多（快乐8 一口 80 格），逐个绑事件太重
        · 彩种切换会重画连线覆盖层，委托不受影响
     ============================================================ */
  function toolClicked(t, btn) {
    if (t === 'none') { mode = 'none'; applyMode(); return; }
    if (t === 'line') { mode = (mode === 'line') ? 'none' : 'line'; applyMode(); return; }
    if (t === 'clear') {
      var n = clearStrokes();
      if (btn) {
        btn.setAttribute('data-tr-cleared', String(n));
        var old = btn.textContent;
        btn.textContent = '已清空 ' + n + ' 条';
        if (window.setTimeout) window.setTimeout(function () { btn.textContent = old; btn.removeAttribute('data-tr-cleared'); }, 1200);
      }
      return;
    }
    if (t === 'autoPreview') {
      var rep = autoPreview();
      /* 打印一次实例，肉眼/验收脚本都能查（不影响用户界面） */
      try {
        if (window.console && console.log) {
          console.log('[自动衍生预选] 近 ' + (TREND_DATA.periods || 0) + ' 期出现次数最多的号：');
          rep.forEach(function (r) {
            console.log('  ' + r.game + ' → ' + r.main + (r.extra ? '  +  ' + r.extra : ''));
          });
        }
      } catch (e) { /* 控制台不可用就算了 */ }
      window.__TREND_PRESEL_REPORT = rep;
      if (btn) btn.setAttribute('data-tr-done', '1');
      paintTools();
      if (btn && window.setTimeout) window.setTimeout(function () { btn.removeAttribute('data-tr-done'); paintTools(); }, 1600);
      return;
    }
  }

  root.addEventListener('click', function (ev) {
    var el = ev && ev.target;
    if (!el || !el.getAttribute) return;
    /* 按钮里的文字被点到 → 往上找 .btn */
    if (!el.getAttribute('data-tool') && el.parentNode && el.parentNode.getAttribute) el = el.parentNode;
    var t = el.getAttribute && el.getAttribute('data-tool');
    if (t) { if (ev.preventDefault) ev.preventDefault(); toolClicked(t, el); return; }
  });

  /* 浏览器的"补发鼠标事件"要挡掉：
     ① 能出 PointerEvent 的浏览器：pointerdown 里 preventDefault，本来就打断补发；
     ② 只有 touch 的老浏览器：touchstart 里 preventDefault，同样打断补发；
     ③ 裸鼠标桌面：不存在补发。
     eventLockUntil 是最后一道保险（万一某个浏览器还是补了 click，
     就用"刚处理过触摸"这个标志把它吃掉），实测不加保险时
     手指点一下预选格会"选中又立刻取消"（touchend + 补发 click 各 toggle 一次）。 */
  var touchAt = 0;
  function handlePreselTap(ev) {
    var el = ev && ev.target;
    while (el && el.getAttribute && el.getAttribute('data-tr-presel') == null) el = el.parentNode;
    if (!el || !el.getAttribute) return;
    var zone = el.getAttribute('data-tr-presel');
    if (zone === 'label') return;
    if (mode === 'line') return;                 /* 画线模式下别同时改预选 */
    toggleCell(el);
  }
  function isSyntheticAfterTouch(ev) {
    if (!touchAt) return false;
    var now = (ev && ev.timeStamp) || 0;
    return !now || (now - touchAt) < 800;
  }
  root.addEventListener('click', function (ev) {
    if (isSyntheticAfterTouch(ev)) return;
    handlePreselTap(ev);
  });
  root.addEventListener('touchend', function (ev) {
    touchAt = (ev && ev.timeStamp) || 0;
    if (ev && ev.cancelable && ev.preventDefault) ev.preventDefault();   /* 打断补发的 click */
    handlePreselTap(ev);
  });
  root.addEventListener('touchstart', function (ev) {
    var el = ev && ev.target;
    while (el && el.getAttribute && el.getAttribute('data-tr-presel') == null) el = el.parentNode;
    if (el && el.getAttribute && el.getAttribute('data-tr-presel') !== 'label' &&
        mode !== 'line' && ev.cancelable && ev.preventDefault) ev.preventDefault();
  }, { passive: false });

  /* 键盘可达（桌面无障碍）：空格/回车切换 */
  root.addEventListener('keydown', function (ev) {
    var el = ev && ev.target;
    if (!el || !el.getAttribute) return;
    var t = el.getAttribute('data-tool');
    if (t && (ev.key === 'Enter' || ev.key === ' ')) { if (ev.preventDefault) ev.preventDefault(); toolClicked(t, el); return; }
    if (el.getAttribute('data-tr-presel') != null && (ev.key === 'Enter' || ev.key === ' ')) {
      if (ev.preventDefault) ev.preventDefault();
      toggleCell(el);
    }
  });

  /* ============================================================
     ⑥ 收尾：建工具栏、建预选行、给验收脚本留几个可读标记
     ============================================================ */
  qsa('[data-tr-block]').forEach(function (b) { if (!b.hasAttribute('data-tr-strokes')) b.setAttribute('data-tr-strokes', '0'); });
  buildPreselRows();
  mountToolbars();
  applyMode();

  /* 验收/自检用：页面脚本跑完后把这些挂在 window 上（不写 localStorage） */
  window.__TREND_PRESEL = sel;
  window.__TREND_DRAW = {
    mode: function () { return mode; },
    strokes: function () { return strokes; },
    count: function () {
      var n = 0; Object.keys(strokes).forEach(function (k) { n += strokes[k].length; });
      return n;
    },
    autoPreview: autoPreview,
    clear: clearStrokes
  };
})();


/* 页面时间：本机时钟，固定北京时间格式 */
(function () {
  var el = document.getElementById("snapshotTime");
  if (!el) return;
  var d = new Date(Date.now() + 8 * 3600 * 1000);
  el.textContent = "页面时间 " + d.toISOString().slice(0, 19).replace("T", " ");
})();
</script>
</body>
</html>
